# A planted difference, for tools/difftest-selftest: boreutils `true`
# against GNU `false`. The harness passes this file only by FAILING it.
# $BORE_SELFTEST makes difftest compare against the utility named in
# `gnu_util` instead of the file's own.

[[case]]
name = "true is not false"
gnu_util = "false"

# boreutils#70: a `host_id` case still fails where hostid's sources answer,
# and is a SKIP by name where they do not; never an `ok`.
[[case]]
name = "a host_id case is still compared"
gnu_util = "false"
host_id = true
