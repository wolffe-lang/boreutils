[[case]]
name = "core: -p -s ABRT at the expiry, 134"
args = ["-p", "-s", "ABRT", "0.3", "sleep", "5"]
cores = "on"
expect = { status = "exit 134", stderr = "timeout: the monitored command dumped core\n", core = "none", cores = 1 }
compare = ["status", "stdout", "stderr", "elapsed", "core", "cores"]

[[case]]
name = "core: -v -s QUIT, both lines"
args = ["-v", "-s", "QUIT", "0.3", "sleep", "5"]
cores = "on"
expect = { status = "exit 124", stderr = "timeout: sending signal QUIT to command 'sleep'\ntimeout: the monitored command dumped core\n", cores = 1 }

[[case]]
name = "core: -s KILL, no core"
args = ["-s", "KILL", "0.3", "sleep", "5"]
cores = "on"
expect = { status = "signal KILL", stderr = "", cores = 0 }

[[case]]
name = "core: --foreground -s SEGV, standard error closed"
args = ["--foreground", "-s", "SEGV", "0.3", "sleep", "5"]
cores = "on"
stderr_closed = true
expect = { status = "exit 124", cores = 1 }

# timeout ends by the QUIT it passed on, as GNU's does; GNU's own end dumps no core, and this timeout's is the host's default end by QUIT, which dumps where the host writes cores (wolf has no call to make a process undumpable or set its own core limit)
[[case]]
name = "core: QUIT sent to timeout, the command does not trap it"
args = ["5", "sleep", "2"]
send = { signal = "QUIT", after = 0.3 }
cores = "on"
design = { core = "core", cores = 2 }
expect = { status = "signal QUIT", stderr = "timeout: the monitored command dumped core\n", core = "none", cores = 1 }

