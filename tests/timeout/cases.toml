# GNU 9.11 does not end (measured: killed by the runner at 15 s, ev/tprobe-gnu.log); this timeout sends CHLD, which ends nothing, and answers 124 when the command ends
[[case]]
name = "design: -s CHLD"
args = ["-s", "CHLD", "0.3", "sleep", "1"]
gnu = false
ours = { status = "exit 124", stdout = "", stderr = "" }

# The command's end dumped core, cores on (bu28, boreutils#41 (3)): GNU
# says so before it ends, and its OWN end never dumps (`core = "none"`):
# one core file, the command's, is left in the case's directory.
# timeout ends by the command's SEGV, as GNU's does; GNU's own end dumps no core, and this timeout's is the host's default end by SEGV, which dumps where the host writes cores (wolf has no call to make a process undumpable or set its own core limit)
[[case]]
name = "core: the command ends by SEGV"
args = ["5", "sh", "-c", "kill -SEGV $$"]
cores = "on"
design = { core = "core", cores = 2 }
expect = { status = "signal SEGV", stderr = "timeout: the monitored command dumped core\n", core = "none", cores = 1 }

# timeout ends by the command's ABRT, as GNU's does; GNU's own end dumps no core, and this timeout's is the host's default end by ABRT, which dumps where the host writes cores (wolf has no call to make a process undumpable or set its own core limit)
[[case]]
name = "core: the command ends by ABRT, -p"
args = ["-p", "5", "sh", "-c", "kill -ABRT $$"]
cores = "on"
design = { core = "core", cores = 2 }
expect = { status = "signal ABRT", stderr = "timeout: the monitored command dumped core\n", core = "none", cores = 1 }

[[case]]
name = "core: the command ends by TERM, no core"
args = ["5", "sh", "-c", "kill -TERM $$"]
cores = "on"
expect = { status = "signal TERM", stderr = "", core = "none", cores = 0 }
compare = ["status", "stdout", "stderr", "elapsed", "core", "cores"]

[[case]]
name = "core: --foreground -s SEGV at the expiry"
args = ["--foreground", "-s", "SEGV", "0.3", "sleep", "5"]
cores = "on"
expect = { status = "exit 124", stderr = "timeout: the monitored command dumped core\n", core = "none", cores = 1 }
compare = ["status", "stdout", "stderr", "elapsed", "core", "cores"]

[[case]]
name = "core: -s QUIT at the expiry"
args = ["-s", "QUIT", "0.3", "sleep", "5"]
cores = "on"
