# timeout, where it RUNS A COMMAND — run only by tools/timeouttest: one
# fresh container a case, no mount, no network, as a user of the image,
# every process a signal reaches one the case started (bu27). The cases
# that start no command are tests/cases/timeout.toml (tools/difftest).
#
# Each case runs GNU coreutils 9.11's `timeout` (asserted by its
# `--version` line), then this repository's on both tiers, and compares
# how each ended (`exit N`, or `signal NAME`: a death by a signal, which a
# shell's `$?` cannot tell from an exit status of 128+N), its standard
# output and error, its elapsed time (within the tool's tolerance), and,
# where a case asks, what became of the command's own child (`grandchild`)
# or what it wrote to descriptor 3. `expect` is GNU's answer, MEASURED
# (kasumi ~/lanes/bu27/ev/tprobe-gnu.log, tprobe2-gnu.log), asserted of
# GNU on every run; `ours` is where this timeout answers otherwise BY
# DESIGN, each with its reason above it, and `design` (bu28) the narrower
# form: only the fields it names answer otherwise, every other field is
# compared with GNU. A `guard` case is about a hang: both sides are KILLed
# by the runner at the guard (`guard signal KILL`).
#
# A core (bu28): every side runs under `ulimit -c 0`, where a pattern that
# pipes cores to a program (kasumi's systemd-coredump) still dumps every
# fault and GNU says `the monitored command dumped core`, and a file
# pattern (CI's ubuntu runner, `core.%p`) dumps none; so `expect` never
# fixes that line on a default row, and both sides are compared on
# whatever this host does. The `core:` rows run under `ulimit -c
# unlimited` (`cores = "on"`), only where a core is a file in the case's
# own directory (tools/timeouttest's CORES).


[[case]]
name = "expiry: TERM ends the command, 124"
args = ["0.3", "sleep", "5"]
expect = { status = "exit 124" }

[[case]]
name = "expiry: -s KILL ends timeout too (its group)"
args = ["-s", "KILL", "0.3", "sleep", "5"]
expect = { status = "signal KILL" }

[[case]]
name = "expiry: -k, a command that ignores TERM"
args = ["-k", "0.3", "0.3", "sh", "-c", "trap \"\" TERM; sleep 5"]
expect = { status = "signal KILL" }

[[case]]
name = "expiry: --foreground -k, a command that ignores TERM, 137"
args = ["--foreground", "-k", "0.3", "0.3", "sh", "-c", "trap \"\" TERM; sleep 5"]
expect = { status = "exit 137" }

[[case]]
name = "expiry: --foreground -s KILL, 137"
args = ["--foreground", "-s", "KILL", "0.3", "sleep", "5"]
expect = { status = "exit 137" }

[[case]]
name = "expiry: -p, the command's death by TERM as 143"
args = ["-p", "0.3", "sleep", "5"]
expect = { status = "exit 143" }

[[case]]
