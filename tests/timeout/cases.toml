# wolf cannot ignore a fault signal for the length of the group send
[[case]]
name = "design: -s SEGV to the group is refused"
args = ["-s", "SEGV", "0.3", "sleep", "5"]
ours = { status = "exit 125", stdout = "", stderr = "timeout: 'SEGV': wolf cannot ignore this signal, so timeout cannot send it to the group it leads ([os.signal.disp]); with --foreground it is sent to the command alone\n" }
expect = { status = "exit 124" }

