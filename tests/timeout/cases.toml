name = "sent: PROF to timeout, the command traps it and exits 3"
args = ["5", "sh", "-c", "trap 'echo got PROF; exit 3' PROF; sleep 5 & wait"]
send = { signal = "PROF", after = 0.3 }

[[case]]
name = "sent: PROF to timeout, the command does not trap it"
args = ["5", "sleep", "2"]
send = { signal = "PROF", after = 0.3 }

[[case]]
name = "sent: ABRT to timeout, the command traps it and exits 3"
args = ["5", "sh", "-c", "trap 'echo got ABRT; exit 3' ABRT; sleep 5 & wait"]
send = { signal = "ABRT", after = 0.3 }

[[case]]
name = "sent: ABRT to timeout, the command does not trap it"
args = ["5", "sleep", "2"]
send = { signal = "ABRT", after = 0.3 }

[[case]]
name = "sent: CHLD to timeout changes nothing"
args = ["1", "sleep", "2"]
send = { signal = "CHLD", after = 0.3 }

[[case]]
name = "sent: CONT to timeout changes nothing"
args = ["1", "sleep", "2"]
send = { signal = "CONT", after = 0.3 }

[[case]]
name = "sent: WINCH to timeout changes nothing"
args = ["1", "sleep", "2"]
send = { signal = "WINCH", after = 0.3 }

[[case]]
name = "sent: URG to timeout changes nothing"
args = ["1", "sleep", "2"]
send = { signal = "URG", after = 0.3 }

[[case]]
name = "sent: TTIN to timeout changes nothing"
args = ["1", "sleep", "2"]
send = { signal = "TTIN", after = 0.3 }

[[case]]
name = "sent: TTOU to timeout changes nothing"
args = ["1", "sleep", "2"]
send = { signal = "TTOU", after = 0.3 }

[[case]]
name = "sent: TSTP stops timeout"
args = ["1", "sleep", "2"]
send = { signal = "TSTP", after = 0.3 }
guard = 3
compare = ["status", "stdout", "stderr"]

[[case]]
name = "sent: TERM to timeout -k, a command that ignores TERM"
args = ["-k", "0.3", "5", "sh", "-c", "trap \"\" TERM; sleep 3"]
send = { signal = "TERM", after = 0.3 }

[[case]]
name = "sent: ALRM to timeout -k, a command that ignores TERM"
args = ["-k", "0.3", "5", "sh", "-c", "trap \"\" TERM; sleep 3"]
send = { signal = "ALRM", after = 0.3 }

[[case]]
name = "sent: TERM to timeout -p"
args = ["-p", "5", "sleep", "2"]
send = { signal = "TERM", after = 0.3 }

[[case]]
name = "sent: TERM to timeout 0 (no expiry)"
args = ["0", "sleep", "2"]
send = { signal = "TERM", after = 0.3 }

[[case]]
name = "fd: standard input passes"
args = ["5", "cat"]
stdin = "hello\n"

[[case]]
name = "fd: standard input closed"
args = ["5", "sh", "-c", "cat 2>/dev/null; echo \"cat $?\""]
stdin_closed = true

[[case]]
name = "fd: a descriptor above 2 passes"
args = ["5", "sh", "-c", "echo three >&3 && echo wrote"]
fd3 = true

[[case]]
name = "fd: standard output closed"
args = ["5", "sh", "-c", "echo x 2>/dev/null; echo $? >&2"]
stdout_closed = true

[[case]]
name = "env: passes"
args = ["5", "sh", "-c", "echo $FOO"]
env = { FOO = "bar" }

[[case]]
name = "env: argv[0] is the command as written"
args = ["5", "sh", "-c", "tr \"\\0\" \"|\" < /proc/$$/cmdline; echo"]
only_on = "Linux"

[[case]]
name = "signal state: the command's ignored and blocked sets"
args = ["5", "grep", "-E", "Sig(Blk|Ign)", "/proc/self/status"]
only_on = "Linux"

[[case]]
name = "signal state: timeout ignores TTIN and TTOU"
args = ["5", "sh", "-c", "grep SigIgn /proc/$PPID/status"]
only_on = "Linux"

[[case]]
name = "run: a bare name not on PATH"
args = ["5", "no-such-command-bu27"]

[[case]]
name = "run: a command named --help"
args = ["1", "--help"]

[[case]]
name = "run: a command named -s"
args = ["1", "-s", "KILL", "true"]
