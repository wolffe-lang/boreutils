# ls — `tree`, generated from a fixed seed by tools/bench: flat/, a
# directory of 10,000 names, and deep/, 100 directories of 100, at
# --scale 1 (--scale 10: 100,000 names, and 316 directories of 316).
# Neither side stats an entry for a plain listing; both must for -S,
# -t, -l, -s and -i, one stat a name (the floor of those rows), and for
# -R and -F both read the type the kernel hands back with the name
# (`fs_read_dir_entries`, wolf 0.2.27), -F then asking only of regular
# files whether one may be executed.

[[bench]]
name = "flat/, one per line"
command = "{prog} {input}/flat > /dev/null"
input = "tree"

[[bench]]
name = "flat/ in columns (-C)"
command = "{prog} -C {input}/flat > /dev/null"
input = "tree"

[[bench]]
name = "flat/ by size (-S)"
command = "{prog} -S {input}/flat > /dev/null"
input = "tree"

[[bench]]
name = "flat/ by time (-t)"
command = "{prog} -t {input}/flat > /dev/null"
input = "tree"

[[bench]]
name = "-R of deep/"
command = "{prog} -R {input}/deep > /dev/null"
input = "tree"

[[bench]]
name = "start-up: -d of one directory"
command = "{prog} -d {input} > /dev/null"
input = "tree"

[[bench]]
name = "flat/, the long format (-l)"
command = "{prog} -l {input}/flat > /dev/null"
input = "tree"

[[bench]]
name = "flat/, the long format by number (-n)"
command = "{prog} -n {input}/flat > /dev/null"
input = "tree"

[[bench]]
name = "flat/ with blocks (-s)"
command = "{prog} -s {input}/flat > /dev/null"
input = "tree"

[[bench]]
name = "flat/ with marks (-F)"
command = "{prog} -F {input}/flat > /dev/null"
input = "tree"

[[bench]]
name = "flat/ in the directory's order (-U)"
command = "{prog} -U {input}/flat > /dev/null"
input = "tree"

[[bench]]
name = "-lR of deep/"
command = "{prog} -lR {input}/deep > /dev/null"
input = "tree"
