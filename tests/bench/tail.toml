# tail — the bench. bu15 (boreutils#19) priced the missing seek here:
# before wolf 0.2.22 `tail -n 10` of a regular file read all of it and
# GNU read a few kilobytes. Now both read back from the end, on a named
# file and on standard input that is a file; the pipe rows are where
# neither side may seek and both hold a window.
#
# Every row states its locale, for the reason wc's do.

[[bench]]
name = "-n 10 of a file, read back from the end"
command = "LC_ALL=C {prog} -n 10 {input}"
input = "big"

[[bench]]
name = "-c 10 of a file, a positional read of ten bytes"
command = "LC_ALL=C {prog} -c 10 {input}"
input = "big"

[[bench]]
name = "-n 10 of standard input that is a file"
command = "LC_ALL=C {prog} -n 10 < {input}"
input = "big"

[[bench]]
name = "-c 10 of standard input that is a file"
command = "LC_ALL=C {prog} -c 10 < {input}"
input = "big"

[[bench]]
name = "-n 10 through a pipe, where neither side may seek"
command = "LC_ALL=C cat {input} | {prog} -n 10"
input = "big"

[[bench]]
name = "-c 10 through a pipe"
command = "LC_ALL=C cat {input} | {prog} -c 10"
input = "big"

[[bench]]
name = "-n 10 of short lines through a pipe"
command = "LC_ALL=C cat {input} | {prog} -n 10"
input = "lines"

[[bench]]
name = "-n +1, the whole file, which is a copy"
command = "LC_ALL=C {prog} -n +1 {input} > /dev/null"
input = "big"

[[bench]]
name = "-c +100000000, a skip and then a copy"
command = "LC_ALL=C {prog} -c +{bytes:100000000} {input} > /dev/null"
input = "big"

[[bench]]
name = "-n 100000 of short lines, a walk back a hundred thousand lines"
command = "LC_ALL=C {prog} -n 100000 {input} > /dev/null"
input = "lines"
