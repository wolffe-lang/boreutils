# wc — the per-flag bench. Each flag takes a different path through the
# program, so they are timed separately rather than as one "wc" number:
#
#   -c   an fstat on a file operand, a read on standard input
#   -l   the tightest byte loop there is
#   -w   the loop GNU cannot vectorize either
#   -m   bytes in the C locale (an fstat), a decoder under UTF-8
#   -L   the display-width loop
#
# `big` is generated text of ~64-byte lines, `lines` is very short lines
# (so the per-line work dominates) and `noise` is uniformly random bytes
# (so the word state machine flips constantly). They are generated by
# tools/bench and never committed.

[[bench]]
name = "-c on a 1 GiB file (fstat against fstat)"
command = "{prog} -c {input}"
input = "big"

[[bench]]
name = "-c on a 1 GiB file through a redirect (GNU fstats, we read)"
command = "{prog} -c < {input}"
input = "big"

[[bench]]
name = "-l on 1 GiB"
command = "{prog} -l {input}"
input = "big"

[[bench]]
name = "-w on 1 GiB"
command = "{prog} -w {input}"
input = "big"

[[bench]]
name = "-m on 1 GiB, C locale"
command = "LC_ALL=C {prog} -m {input}"
input = "big"

[[bench]]
name = "-m on 1 GiB, UTF-8 locale (the decoder)"
command = "LC_ALL=C.UTF-8 {prog} -m {input}"
input = "big"

[[bench]]
name = "-L on 1 GiB"
command = "{prog} -L {input}"
input = "big"

[[bench]]
name = "the default counts on 1 GiB"
command = "{prog} {input}"
input = "big"

[[bench]]
name = "the default counts on 64 MiB of very short lines"
command = "{prog} {input}"
input = "lines"

[[bench]]
name = "-l on 64 MiB of very short lines"
command = "{prog} -l {input}"
input = "lines"

[[bench]]
name = "the default counts on 256 MiB of binary noise"
command = "{prog} {input}"
input = "noise"

[[bench]]
name = "-L on 256 MiB of binary noise"
command = "{prog} -L {input}"
input = "noise"
