# wc — the per-flag bench. Each flag takes a different path through the
# program, so they are timed separately rather than as one "wc" number:
#
#   -c   an fstat on a file operand, a read on standard input
#   -l   the tightest byte loop there is
#   -w   the loop GNU cannot vectorize either
#   -m   bytes in the C locale (an fstat), a decoder under UTF-8
#   -L   the display-width loop
#
# EVERY row states its locale. The locale picks the loop — the C-locale
# loop reads a byte, the UTF-8 loop decodes a character — so a bench that
# inherited the runner's LANG would measure whichever loop that machine
# happened to choose, and the first draft of this file did exactly that.
#
# `big` is generated text of ~64-byte lines, `lines` is very short lines
# (so the per-line work dominates) and `noise` is uniformly random bytes
# (so the word state machine flips constantly and the UTF-8 decoder meets
# mostly invalid bytes). They are generated by tools/bench, never committed.

[[bench]]
name = "-c on a file, C (fstat against fstat)"
command = "LC_ALL=C {prog} -c {input}"
input = "big"

[[bench]]
name = "-c through a redirect, C (GNU fstats, we read)"
command = "LC_ALL=C {prog} -c < {input}"
input = "big"

[[bench]]
name = "-m, C (bytes, so an fstat)"
command = "LC_ALL=C {prog} -m {input}"
input = "big"

[[bench]]
name = "-m, UTF-8 (the decoder)"
command = "LC_ALL=C.UTF-8 {prog} -m {input}"
input = "big"

[[bench]]
name = "-l, C"
command = "LC_ALL=C {prog} -l {input}"
input = "big"

[[bench]]
name = "-l, UTF-8"
command = "LC_ALL=C.UTF-8 {prog} -l {input}"
input = "big"

[[bench]]
name = "-w, C"
command = "LC_ALL=C {prog} -w {input}"
input = "big"

[[bench]]
name = "-w, UTF-8"
command = "LC_ALL=C.UTF-8 {prog} -w {input}"
input = "big"

[[bench]]
name = "-L, C"
command = "LC_ALL=C {prog} -L {input}"
input = "big"

[[bench]]
name = "-L, UTF-8"
command = "LC_ALL=C.UTF-8 {prog} -L {input}"
input = "big"

[[bench]]
name = "the default counts, C"
command = "LC_ALL=C {prog} {input}"
input = "big"

[[bench]]
name = "the default counts, UTF-8"
command = "LC_ALL=C.UTF-8 {prog} {input}"
input = "big"

[[bench]]
name = "the default counts on very short lines, C"
command = "LC_ALL=C {prog} {input}"
input = "lines"

[[bench]]
name = "-l on very short lines, C"
command = "LC_ALL=C {prog} -l {input}"
input = "lines"

[[bench]]
name = "the default counts on binary noise, C"
command = "LC_ALL=C {prog} {input}"
input = "noise"

[[bench]]
name = "the default counts on binary noise, UTF-8"
command = "LC_ALL=C.UTF-8 {prog} {input}"
input = "noise"

[[bench]]
name = "-L on binary noise, C"
command = "LC_ALL=C {prog} -L {input}"
input = "noise"
