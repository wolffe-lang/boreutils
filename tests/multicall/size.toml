# The size ceilings (M6, its second half): for each host, keyed by
# `System-machine` as Python's platform module names it, the most loadable
# bytes `bore` may have: what an exec maps, an ELF's PT_LOAD filesz or a
# Mach-O's __TEXT, __DATA_CONST and __DATA filesize. The file size is not
# judged; on linux it is mostly symbol and debug sections. Each ceiling is
# 1.15 times the loadable bytes of `bore` measured at a recorded build, named
# beside it; raising one is a reviewed one-line change with its reason. A
# host with no entry is red ("records none").
#
# Both builds are of bore's source as the commit that runs the six separate
# programs from `bore NAME` leaves it (the commits after it change only the
# tools and these files).

