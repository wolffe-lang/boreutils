# ======================================================================
# The long format and its family (bu20, wolf 0.2.27): -l -g -n -o -G
# --full-time --time-style, -s, -i, -u, -c, --time, -U, -f, the marks of
# -F on every kind of file, -L and -H. Black-box against GNU 9.11.
#
# What a fresh tree cannot hold still is held still by the harness:
#   scratch_time_all   every entry's modification and access time
#   "now-N"            a time relative to one instant per case, for the
#                      six-month rule
#   scratch_keep       ONE tree for both sides, where the answer is an
#                      inode number, a status-change or birth time, or
#                      the directory's own order
#   accounts           the case prints an owner's NAME: skipped where
#                      this account is not in /etc/passwd (macOS), and
#                      its `-n` twin runs everywhere
# ======================================================================

# Every kind of file a user can make: regular files (one executable, one
# nobody may read, one hidden), a directory, the sticky directories, a
# pipe, a socket, links to a file, an executable, a directory, a pipe
# and nothing, a file with two names, and set-user-id and set-group-id
# with and without the execute bit under them.
[tree.kinds]
cwd = "t"
scratch_dirs = ["t", "t/dir", "t/dir/sub", "t/tdir", "t/tdirnox"]
scratch = { "t/a" = "12345", "t/bb" = "x", "t/exe" = "#!/bin/sh\n", "t/secret" = "", "t/.hidden" = "hh", "t/dir/inner" = "i", "t/suid" = "s", "t/sgid" = "g", "t/suidnox" = "s", "t/sgidnox" = "g", "t/with space" = "ab" }
scratch_sizes = { "t/big" = 5000 }
scratch_fifos = ["t/fifo"]
scratch_sockets = ["t/sock"]
scratch_links = { "t/link" = "a", "t/xlink" = "exe", "t/dlink" = "dir", "t/flink" = "fifo", "t/dangle" = "nope" }
scratch_hardlinks = { "t/hard" = "t/a" }
scratch_modes = { "t/exe" = 0o755, "t/secret" = 0o000, "t/suid" = 0o4755, "t/sgid" = 0o2755, "t/suidnox" = 0o4644, "t/sgidnox" = 0o2644, "t/tdir" = 0o1777, "t/tdirnox" = 0o1776, "t/bb" = 0o600, "t/dir" = 0o750 }
scratch_time_all = 1600000000
scratch_times = { "t/bb" = 1500000000, "t/big" = 1700000000, "t/dir" = 1650000000, "t/link" = 1550000000 }

# The sticky bit on a FILE, which only linux lets an ordinary user set.
[tree.sticky]
cwd = "t"
scratch_dirs = ["t"]
scratch = { "t/sticky" = "t", "t/stickyx" = "t" }
scratch_modes = { "t/sticky" = 0o1644, "t/stickyx" = 0o1755 }
scratch_time_all = 1600000000

# Sizes on both sides of every unit, as holes: no bytes are written.
[tree.sizes]
cwd = "t"
scratch_dirs = ["t"]
scratch_sizes = { "t/s0" = 0, "t/s1" = 1, "t/s999" = 999, "t/s1000" = 1000, "t/s1001" = 1001, "t/s1023" = 1023, "t/s1024" = 1024, "t/s1025" = 1025, "t/s9999" = 9999, "t/s10239" = 10239, "t/s10240" = 10240, "t/s10241" = 10241, "t/s999999" = 999999, "t/s1048575" = 1048575, "t/s1048576" = 1048576, "t/s1048577" = 1048577, "t/s9G" = 10736344498, "t/huge" = 123456789012, "t/s1T" = 1099511627776, "t/s5P" = 5629499534213120 }
scratch_time_all = 1600000000

# Distinct modification and access times, in different orders.
[tree.times]
cwd = "t"
scratch_dirs = ["t"]
scratch = { "t/a" = "1", "t/b" = "22", "t/c" = "333", "t/d" = "4444" }
scratch_links = { "t/l" = "a" }
scratch_time_all = 1600000000
scratch_times = { "t/a" = 1600000100, "t/b" = 1600000400, "t/c" = 1600000200, "t/d" = 1600000300, "t/l" = 1600000250 }
scratch_atimes = { "t/a" = 1600000900, "t/b" = 1600000600, "t/c" = 1600000800, "t/d" = 1600000700, "t/l" = 1600000750 }

# Ages on both sides of the six-month rule (15,778,476 seconds), a
# minute each way, and a time in the future, each against one instant
# the harness takes once per case.
[tree.ages]
cwd = "t"
scratch_dirs = ["t"]
scratch = { "t/just-recent" = "", "t/just-old" = "", "t/minute-ago" = "", "t/minute-ahead" = "", "t/hour-ahead" = "", "t/month-ago" = "", "t/year-ago" = "", "t/right-now" = "" }
scratch_time_all = 1600000000
scratch_times = { "t/just-recent" = "now-15778416", "t/just-old" = "now-15778536", "t/minute-ago" = "now-60", "t/minute-ahead" = "now+60", "t/hour-ahead" = "now+3600", "t/month-ago" = "now-2592000", "t/year-ago" = "now-31556952", "t/right-now" = "now" }
scratch_atimes = { "t/just-recent" = "now-15778536", "t/just-old" = "now-15778416", "t/minute-ago" = "now+60", "t/minute-ahead" = "now-60", "t/hour-ahead" = "now-3600", "t/month-ago" = "now-31556952", "t/year-ago" = "now-2592000", "t/right-now" = "now" }

# Instants in winter and in summer, before the epoch and past 2038, for
# the time zones. Between 1902 and 2400: ext4, which CI's scratch
# directory is on, holds no time outside 1901..2446 (a year of five
# digits is in src/bore_test.lu instead).
[tree.instants]
cwd = "t"
scratch_dirs = ["t"]
scratch = { "t/y1902" = "", "t/y1969" = "", "t/y1987w" = "", "t/y2020s" = "", "t/y2023w" = "", "t/y2024leap" = "", "t/y2040s" = "", "t/y2100" = "", "t/y2400" = "" }
scratch_time_all = 1600000000
scratch_times = { "t/y1902" = -2145916800, "t/y1969" = -1, "t/y1987w" = 536500800, "t/y2020s" = 1600000000, "t/y2023w" = 1700000000, "t/y2024leap" = 1709210096, "t/y2040s" = 2226000000, "t/y2100" = 4102444800, "t/y2400" = 13569465600 }

# Link counts and sizes of different widths: one file with eleven names.
[tree.widths]
cwd = "t"
scratch_dirs = ["t", "t/d"]
scratch = { "t/one" = "1", "t/many" = "0123456789", "t/d/in" = "" }
scratch_sizes = { "t/wide" = 123456789 }
scratch_hardlinks = { "t/m01" = "t/many", "t/m02" = "t/many", "t/m03" = "t/many", "t/m04" = "t/many", "t/m05" = "t/many", "t/m06" = "t/many", "t/m07" = "t/many", "t/m08" = "t/many", "t/m09" = "t/many", "t/m10" = "t/many" }
scratch_time_all = 1600000000

# A directory that can be read and not searched: its names are listed
# and nothing about them can be asked.
[tree.unsearchable]
cwd = "t"
scratch_dirs = ["t", "t/locked", "t/locked/d"]
scratch = { "t/locked/in" = "x", "t/f" = "" }
scratch_links = { "t/locked/l" = "in" }
scratch_modes = { "t/locked" = 0o600 }
scratch_time_all = 1600000000

# Links that lead back up, for -R under -L.
[tree.backlinks]
cwd = "t"
scratch_dirs = ["t", "t/loop", "t/loop/sub"]
scratch = { "t/loop/f" = "" }
scratch_links = { "t/loop/self" = "../loop", "t/loop/sub/up" = "..", "t/loop/dangle" = "nope" }
scratch_time_all = 1600000000

