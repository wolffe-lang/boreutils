# ls — GNU coreutils 9.11, black-box, on linux x86-64 and macOS arm64,
# with standard output a pipe (difftest's default) and, in the cases
# under "on a terminal", a pseudo-terminal (`tty`, bu19).
#
# Every case stands in a SCRATCH tree laid out fresh for each side
# (tools/difftest): the trees below are named and shared, every entry's
# modification time set to the second (`scratch_times`, bu18) so that
# `-t` compares what both sides were given and not the instant the
# harness made the file. Most cases stand in `t`, so `..` is the scratch
# directory itself, whose time is set too.
#
# The help and version TEXT is ours, so those compare the exit only.
# A behaviour this ls cannot match is a SKIP naming why:
#   wolf-lang#643  a terminal's own width (GNU asks TIOCGWINSZ)
#   wolf-lang#685  no extended attribute: -Z, and the + and . after a mode
#   wolf-lang#692  -f and -aU: where . and .. stand in the directory's
#                  own order
#   and what is not written yet (--author, --block-size, the quoting
#   styles, --time-style=+FORMAT), each refused by name.
# Until wolf 0.2.27 the long format, -s, -i, -u, -c and the unsorted
# orders were skips here (wolf-lang#625, #626, #536); s218's
# fs_stat/fs_lstat/fs_read_link/fs_read_dir_entries answer them, and
# those cases run now, beside the bu20 section at the end of the file.

# ------------------------------------------------------------- the trees

# Files of distinct sizes (two deliberately tied), hidden files, a name
# with a space, a name with a NEWLINE, a non-ASCII name, extensions for
# -X, directories nested two deep, an empty one and a hidden one.
[tree.plain]
cwd = "t"
scratch_dirs = ["t", "t/dir", "t/dir/sub", "t/empty", "t/.hdir"]
scratch_times = { "." = 1600004000, "t" = 1600003000, "t/a" = 1600000100, "t/bb" = 1600000900, "t/ccc" = 1600000500, "t/Upper" = 1600000300, "t/_under" = 1600000700, "t/with space" = 1600000200, "t/new\nline" = 1600000600, "t/x.tar.gz" = 1600000400, "t/b.c" = 1600001000, "t/z.c" = 1600000800, "t/A.TXT" = 1600001100, "t/.hidden" = 1600001200, "t/é" = 1600001300, "t/dir" = 1600001400, "t/empty" = 1600001500, "t/.hdir" = 1600001600, "t/dir/inner" = 1600002000, "t/dir/.dot" = 1600002100, "t/dir/sub" = 1600002200, "t/dir/sub/deep" = 1600002300, "t/.hdir/h" = 1600002400 }

[tree.plain.scratch]
"t/a" = "12345"
"t/bb" = "0123456789012345678901234567890123456789"
"t/ccc" = "x"
"t/Upper" = "1234567"
"t/_under" = "abc"
"t/with space" = "ab"
"t/new\nline" = "xyz"
"t/x.tar.gz" = "123456"
"t/b.c" = "12345678"
"t/z.c" = "123456789"
"t/A.TXT" = "0123456789"
"t/.hidden" = "0123456789a"
"t/é" = "0123456789ab"
"t/dir/inner" = "i"
"t/dir/.dot" = "dd"
"t/dir/sub/deep" = "eee"
"t/.hdir/h" = "h"

# Twenty-four names for the column layouts.
[tree.greek]
cwd = "t"
scratch_dirs = ["t"]

[tree.greek.scratch]
"t/alpha" = ""
"t/beta" = ""
"t/gamma" = ""
"t/delta" = ""
"t/epsilon" = ""
"t/zeta" = ""
"t/eta" = ""
"t/theta" = ""
"t/iota" = ""
"t/kappa" = ""
"t/lambda" = ""
"t/mu" = ""
"t/nu" = ""
"t/xi" = ""
"t/omicron" = ""
"t/pi" = ""
"t/rho" = ""
"t/sigma" = ""
"t/tau" = ""
"t/upsilon" = ""
"t/phi" = ""
"t/chi" = ""
"t/psi" = ""
"t/omega" = ""

# Symbolic links: to a file, to a directory, to nothing, and to the
# directory that holds it.
[tree.links]
cwd = "t"
scratch_dirs = ["t", "t/d"]
scratch = { "t/a" = "12345", "t/d/inner" = "i", "t/zz" = "0123456789" }
scratch_links = { "t/ln" = "a", "t/lnd" = "d", "t/dangling" = "nope", "t/loop" = "." }
scratch_times = { "." = 1600004000, "t" = 1600003000, "t/a" = 1600000100, "t/d" = 1600000200, "t/d/inner" = 1600000300, "t/zz" = 1600000400, "t/ln" = 1600000500, "t/lnd" = 1600000600, "t/dangling" = 1600000700, "t/loop" = 1600000800 }

# A dangling link and nothing that resolves: the one kind of link this
# ls can see.
[tree.dangle]
cwd = "t"
scratch_dirs = ["t", "t/d"]
scratch = { "t/a" = "12345", "t/bb" = "0123456789", "t/d/x" = "" }
scratch_links = { "t/dangling" = "nope" }
scratch_times = { "." = 1600004000, "t" = 1600003000, "t/a" = 1600000100, "t/bb" = 1600000200, "t/d" = 1600000300, "t/d/x" = 1600000400, "t/dangling" = 1600000500 }

# A link to the directory that holds it, beside a real subdirectory.
[tree.loop]
cwd = "t"
scratch_dirs = ["t", "t/d", "t/d/e"]
scratch = { "t/a" = "1", "t/d/x" = "2", "t/d/e/y" = "3" }
scratch_links = { "t/self" = ".", "t/d/e/back" = "../.." }

# A directory nobody may read, and one inside a readable one.
[tree.locked]
cwd = "t"
scratch_dirs = ["t", "t/locked", "t/open", "t/open/inner", "t/open/inner/shut"]
scratch = { "t/f" = "" }
scratch_modes = { "t/locked" = 0o000, "t/open/inner/shut" = 0o000 }

