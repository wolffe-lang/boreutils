# ---------------------------------------------------------- on a terminal
#
# Standard output a pseudo-terminal (`tty = COLUMNS`, bu19): `ls` asks
# `os_isatty(1)` (wolf 0.2.26, s215) and takes GNU's terminal defaults,
# measured black-box against 9.11: columns, the shell-escape quoting
# style with one leading space for every unquoted name in a listing that
# holds a quoted one, quoted headers, and `?` for an unprintable byte
# under the literal style (`-N`). The terminal's own width is asked by
# GNU (TIOCGWINSZ) and cannot be by wolf (wolf-lang#643), so the
# terminals here are 80 wide or report no size, where the two agree; the
# rest skip naming it.

