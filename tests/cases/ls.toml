tree = "kinds"
args = ["-aU"]
skip = "where . and .. stand in the directory's own order is not something fs_read_dir_entries says (it leaves them out, wolf-lang#692): this ls puts them first, which is right on btrfs, tmpfs and APFS and not on ext4"

[[case]]
name = "-f is -a and -U"
tree = "kinds"
args = ["-f"]
skip = "where . and .. stand in the directory's own order is not something fs_read_dir_entries says (it leaves them out, wolf-lang#692): this ls puts them first, which is right on btrfs, tmpfs and APFS and not on ext4"

[[case]]
name = "--sort=none (kinds)"
tree = "kinds"
args = ["--sort=none"]
scratch_keep = true

[[case]]
name = "-U with -l"
tree = "kinds"
args = ["-nU"]
scratch_keep = true

[[case]]
name = "-f with -l"
tree = "kinds"
args = ["-nf"]
skip = "where . and .. stand in the directory's own order is not something fs_read_dir_entries says (it leaves them out, wolf-lang#692): this ls puts them first, which is right on btrfs, tmpfs and APFS and not on ext4"

[[case]]
name = "-l and then -f stays long"
tree = "kinds"
args = ["-n", "-f"]
skip = "where . and .. stand in the directory's own order is not something fs_read_dir_entries says (it leaves them out, wolf-lang#692): this ls puts them first, which is right on btrfs, tmpfs and APFS and not on ext4"

[[case]]
name = "-U with -r is not reversed"
tree = "kinds"
args = ["-Ur"]
scratch_keep = true

[[case]]
name = "-U with -F"
tree = "kinds"
args = ["-UF"]
scratch_keep = true

[[case]]
name = "-U with -p"
tree = "kinds"
args = ["-Up"]
scratch_keep = true

[[case]]
name = "-U with -s"
tree = "kinds"
args = ["-Us"]
scratch_keep = true

[[case]]
name = "-U with -C"
tree = "kinds"
args = ["-U", "-C", "-w", "60"]
scratch_keep = true

[[case]]
name = "-U with -m"
tree = "kinds"
args = ["-U", "-m"]
scratch_keep = true

[[case]]
name = "-U with -R"
tree = "kinds"
args = ["-UR"]
scratch_keep = true

[[case]]
name = "-f and then -A hides . and .."
tree = "kinds"
args = ["-f", "-A"]
scratch_keep = true

[[case]]
name = "-U and then -S sorts by size"
tree = "kinds"
args = ["-U", "-S"]
scratch_keep = true

[[case]]
name = "-S and then -U is unsorted"
tree = "kinds"
args = ["-S", "-U"]
scratch_keep = true

[[case]]
name = "-t and then -f"
tree = "kinds"
args = ["-t", "-f"]
skip = "where . and .. stand in the directory's own order is not something fs_read_dir_entries says (it leaves them out, wolf-lang#692): this ls puts them first, which is right on btrfs, tmpfs and APFS and not on ext4"

[[case]]
name = "-U with --group-directories-first"
tree = "kinds"
args = ["-U", "--group-directories-first"]
scratch_keep = true

[[case]]
name = "-U of operands keeps their order"
tree = "kinds"
args = ["-Ud", "sock", "a", "dir", "bb"]
scratch_keep = true

# --- device files: the host's own, so each case names the one it
# needs and is a skip where the host has none.
[[case]]
name = "character devices: major and minor"
args = ["-n", "/dev/null", "/dev/zero"]
requires = "/dev/zero"

[[case]]
name = "character devices by name"
args = ["-l", "/dev/null", "/dev/zero"]
requires = "/dev/zero"
accounts = true

[[case]]
name = "a device beside a large file: the size column"
args = ["-n", "/dev/null", "big"]
scratch_sizes = { "big" = 123456789012 }
scratch_time_all = 1600000000

[[case]]
name = "a device beside a small file"
args = ["-n", "/dev/null", "a"]
scratch = { "a" = "1" }
scratch_time_all = 1600000000

[[case]]
name = "a device under -h"
args = ["-nh", "/dev/null", "big"]
scratch_sizes = { "big" = 123456789012 }
scratch_time_all = 1600000000

[[case]]
name = "a device under -s and -i"
args = ["-nsi", "/dev/null"]
requires = "/dev/null"

[[case]]
name = "a device under -F has no mark"
args = ["-F", "/dev/null"]
requires = "/dev/null"

[[case]]
name = "--full-time of a device"
args = ["-n", "--full-time", "/dev/null"]
requires = "/dev/null"

[[case]]
name = "a block device (an nvme disk)"
args = ["-n", "/dev/nvme0n1"]
requires = "/dev/nvme0n1"

[[case]]
name = "a block device (a scsi disk)"
args = ["-n", "/dev/sda"]
requires = "/dev/sda"

[[case]]
name = "a block device (a loop device)"
args = ["-n", "/dev/loop0"]
requires = "/dev/loop0"

[[case]]
name = "a block device beside a character device"
args = ["-n", "/dev/null", "/dev/loop0"]
requires = "/dev/loop0"

[[case]]
name = "a block device (a mac's disk)"
args = ["-n", "/dev/disk0"]
requires = "/dev/disk0"

# --- the long format on a terminal: quoted names, no columns
[[case]]
name = "-l on a terminal quotes a name that needs it"
tree = "kinds"
args = ["-n"]
tty = 80

[[case]]
name = "-l on a terminal with -N"
tree = "kinds"
args = ["-nN"]
tty = 80

[[case]]
name = "-s on a terminal is columns"
tree = "kinds"
args = ["-s"]
tty = 80

[[case]]
name = "-g on a terminal"
tree = "kinds"
args = ["-gn"]
tty = 80

# --- what is still refused by name: the exit status is the claim
[[case]]
name = "--author"
tree = "kinds"
args = ["-l", "--author"]
skip = "--author (a fourth name column) is not written yet: refused by name, status 2"

[[case]]
name = "--block-size"
tree = "kinds"
args = ["-l", "--block-size=1"]
skip = "--block-size, and the LS_BLOCK_SIZE, BLOCK_SIZE and BLOCKSIZE variables, are not written yet: refused by name, status 2"

[[case]]
name = "--time-style=+FORMAT"
tree = "kinds"
args = ["-l", "--time-style=+%Y"]
skip = "--time-style=+FORMAT needs date's format language, not written yet: refused by name, status 2"

[[case]]
name = "-Z"
tree = "kinds"
args = ["-lZ"]
skip = "a security context is an extended attribute, which wolf cannot read (wolf-lang#685): refused by name, status 2"

[[case]]
name = "-Q under -l"
tree = "kinds"
args = ["-lQ"]
skip = "the quoting styles but -N are not written yet: refused by name, status 2"

