# wc — GNU coreutils 9.11, black-box. Every expectation here was read
# off the GNU binary on BOTH hosts (macOS arm64 Homebrew `gwc`, linux
# x86-64 native `wc`), which agreed on every case in this file.
#
# The fixtures under tests/fixtures/ are committed data, not generated:
#   two.txt   29 B, 2 lines, 5 words        one.txt   2 B
#   empty.txt 0 B                           nonl.txt  19 B, no newline
#   tabs.txt  tab stops                     ctrl.txt  CR, BS, NUL-ish, tabs
#   utf8.txt  valid multibyte               wide.txt  CJK, combining, emoji
#   bad.dat   invalid UTF-8                 bin.dat   every byte value
#   k9999.txt 9999 B, so that the SUM of sizes (10001) has one more
#             digit than the largest (9999) and the width rule is pinned
#   names0*   NUL-separated name lists for --files0-from
#
# File operands are written relative to the repository root, which is
# where difftest runs them from.
#
# --help and --version print OUR text, so they compare the exit status
# and stderr only. --debug compares stdout and the exit only: GNU prints
# which SIMD kernel its line counter chose (linux says "using avx512
# hardware support"), and boreutils has no such kernel to report.

# ---------------------------------------------------------------- basics

[[case]]
name = "one file, the default counts"
args = ["tests/fixtures/two.txt"]

[[case]]
name = "stdin from a pipe"
stdin = "a b\nc\n"

[[case]]
name = "stdin from a regular file"
stdin_file = "two.txt"

[[case]]
name = "a dash operand reads stdin and is labelled"
args = ["-"]
stdin = "a b\nc\n"

[[case]]
name = "a dash beside a file"
args = ["-", "tests/fixtures/two.txt"]
stdin = "a b\nc\n"

[[case]]
name = "empty file"
args = ["tests/fixtures/empty.txt"]

[[case]]
name = "empty stdin"
stdin = ""

[[case]]
name = "a last line with no newline still counts words and bytes"
args = ["tests/fixtures/nonl.txt"]

[[case]]
name = "binary input, every byte value"
args = ["tests/fixtures/bin.dat"]

[[case]]
name = "binary input on stdin"
stdin_file = "bin.dat"

