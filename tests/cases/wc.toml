[[case]]
name = "-l alone"
args = ["-l", "tests/fixtures/two.txt"]

[[case]]
name = "-w alone"
args = ["-w", "tests/fixtures/two.txt"]

[[case]]
name = "-c alone"
args = ["-c", "tests/fixtures/two.txt"]

[[case]]
name = "-m alone"
args = ["-m", "tests/fixtures/two.txt"]

[[case]]
name = "-L alone"
args = ["-L", "tests/fixtures/two.txt"]

[[case]]
name = "--lines long"
args = ["--lines", "tests/fixtures/two.txt"]

[[case]]
name = "--bytes long"
args = ["--bytes", "tests/fixtures/two.txt"]

[[case]]
name = "--chars long"
args = ["--chars", "tests/fixtures/two.txt"]

[[case]]
name = "--words long"
args = ["--words", "tests/fixtures/two.txt"]

[[case]]
name = "--max-line-length long"
args = ["--max-line-length", "tests/fixtures/two.txt"]

[[case]]
name = "a long option abbreviated to a unique prefix"
args = ["--max", "tests/fixtures/two.txt"]

[[case]]
name = "a short cluster"
args = ["-lwc", "tests/fixtures/two.txt"]

[[case]]
name = "the print order is fixed whatever order the flags come in"
