name = "directory"
args = ["/"]
stdin = ""

[[case]]
name = "stdin dash"
args = ["-"]
stdin = "foo\n"

[[case]]
name = "closed empty"
args = []
stdin = ""
stdout_closed = true

[[case]]
name = "closed output"
args = []
stdin = "foo"
stdout_closed = true

[[case]]
name = "full output"
args = []
stdin = "foo"
stdout_file = "/dev/full"

[[case]]
name = "stream chunk boundary"
args = ["-w", "7"]
stdin = "ab"
stdin_repeat = 100000

[[case]]
name = "numeric boundary ' 2'"
args = ["-w", " 2"]
stdin = "a"

[[case]]
name = "numeric boundary '2 '"
args = ["-w", "2 "]
stdin = "a"

[[case]]
name = "numeric boundary '-0'"
args = ["-w", "-0"]
stdin = "a"

[[case]]
name = "numeric boundary '+0'"
args = ["-w", "+0"]
stdin = "a"

[[case]]
name = "numeric boundary '18446744073709551615'"
args = ["-w", "18446744073709551615"]
stdin = "a"

[[case]]
name = "numeric boundary '18446744073709551616'"
args = ["-w", "18446744073709551616"]
stdin = "a"

[[case]]
name = "numeric boundary '9223372036854775808'"
args = ["-w", "9223372036854775808"]
stdin = "a"

[[case]]
name = "numeric boundary '0002'"
args = ["-w", "0002"]
stdin = "a"

[[case]]
name = "numeric boundary '2x'"
args = ["-w", "2x"]
stdin = "a"

[[case]]
name = "numeric boundary '+'"
args = ["-w", "+"]
stdin = "a"

[[case]]
name = "numeric boundary '\\t2'"
args = ["-w", "\t2"]
stdin = "a"

