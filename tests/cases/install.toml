[[case]]
name = "D preserves existing parent permissions"
args = ["-D", "a", "d/new"]
scratch = { a = "abc" }
scratch_dirs = ["d"]
scratch_modes = { d = 0o700 }

[[case]]
name = "D creates explicit target directory"
args = ["-D", "-t", "d/new", "a"]
