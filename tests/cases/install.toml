[[case]]
name = "['a', 'new']"
args = ["a", "new"]
scratch = { a = "abc\n", b = "old\n", same = "abc\n", original = "keep\n" }
scratch_dirs = ["d"]
scratch_links = { link = "original" }
scratch_times = { a = 1000000000, b = 1000000001 }

