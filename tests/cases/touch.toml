# touch — GNU coreutils 9.11, black-box, on linux x86-64 and macOS arm64.
# Written by notes/bu22/gen/touch_cases.py; this file is the record.
#
# touch changes the file system, so every case runs in a scratch
# directory (tools/difftest). A case that says `times = true` compares
# every entry's access and modification time to the nanosecond, a
# time inside the side's own run read as `now`; a fixture time is set
# on every entry whose move to `now` the case is about.

# Usage.
[[case]]
name = "no operand"
args = []

[[case]]
name = "-d with no argument"
args = ["-d"]

[[case]]
name = "-t with no argument"
args = ["-t"]

[[case]]
name = "-r with no argument"
args = ["-r"]

[[case]]
name = "an invalid option"
args = ["-Q", "f"]
scratch = { "f" = "x\n" }
scratch_times = { "f" = "1000000000.000000000" }
times = true

[[case]]
name = "--help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "--version"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "-d and -t together"
args = ["-d", "@1", "-t", "202001020304", "f"]
