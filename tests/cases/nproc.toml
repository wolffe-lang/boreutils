[[case]]
name = "OMP_THREAD_LIMIT='3' caps the count"
env = { OMP_THREAD_LIMIT = "3" }

[[case]]
name = "OMP_THREAD_LIMIT='2,1' caps the count"
env = { OMP_THREAD_LIMIT = "2,1" }

[[case]]
name = "OMP_THREAD_LIMIT=' 2 ' caps the count"
env = { OMP_THREAD_LIMIT = " 2 " }

[[case]]
name = "OMP_THREAD_LIMIT='99999999999999999999' caps the count"
env = { OMP_THREAD_LIMIT = "99999999999999999999" }

[[case]]
name = "OMP_THREAD_LIMIT='+3' is ignored"
env = { OMP_THREAD_LIMIT = "+3" }

[[case]]
name = "OMP_THREAD_LIMIT='3.5' is ignored"
env = { OMP_THREAD_LIMIT = "3.5" }

[[case]]
name = "OMP_THREAD_LIMIT='0x2' is ignored"
env = { OMP_THREAD_LIMIT = "0x2" }

[[case]]
name = "OMP_THREAD_LIMIT='-1' is ignored"
env = { OMP_THREAD_LIMIT = "-1" }

[[case]]
name = "OMP_THREAD_LIMIT='0' is ignored"
env = { OMP_THREAD_LIMIT = "0" }

[[case]]
name = "OMP_THREAD_LIMIT='' is ignored"
env = { OMP_THREAD_LIMIT = "" }

[[case]]
name = "both variables, the limit lower"
env = { OMP_NUM_THREADS = "40", OMP_THREAD_LIMIT = "20" }

[[case]]
name = "both variables, the limit higher"
env = { OMP_NUM_THREADS = "4", OMP_THREAD_LIMIT = "20" }

[[case]]
name = "OMP_NUM_THREADS and --ignore"
args = ["--ignore=2"]
env = { OMP_NUM_THREADS = "8" }

[[case]]
name = "a saturated OMP_NUM_THREADS and --ignore"
args = ["--ignore=2"]
env = { OMP_NUM_THREADS = "99999999999999999999" }

[[case]]
name = "--all disregards OMP_NUM_THREADS"
args = ["--all"]
env = { OMP_NUM_THREADS = "2" }

[[case]]
name = "--all disregards OMP_THREAD_LIMIT"
args = ["--all"]
env = { OMP_THREAD_LIMIT = "1" }

[[case]]
name = "options permute"
args = ["--all", "--ignore", "1"]

[[case]]
name = "help"
args = ["--help"]
compare = ["exit", "stderr"]

[[case]]
name = "help after an operand"
args = ["x", "--help"]
compare = ["exit", "stderr"]

[[case]]
name = "version"
args = ["--version"]
compare = ["exit", "stderr"]

[[case]]
name = "standard output closed is a write error"
args = []
stdout_closed = true

# A write error on a LIVE descriptor (linux only; a SKIP where there is
# no /dev/full): GNU appends strerror(ENOSPC), which wolf cannot say
# (wolf-lang#407), so the exit status is the comparison.
[[case]]
name = "a write error on a live descriptor"
stdout_file = "/dev/full"
compare = ["exit"]
