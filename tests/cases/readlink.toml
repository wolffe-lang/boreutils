[[case]]
name = "-m and then -f"
tree = "links"
args = ["-mf", "nope/x"]

[[case]]
name = "no operand"
tree = "links"
args = []

[[case]]
name = "no operand after an option"
tree = "links"
args = ["-n"]

[[case]]
name = "an unknown option"
tree = "links"
args = ["-x"]

[[case]]
name = "an unknown long option"
tree = "links"
args = ["--nope"]

[[case]]
name = "--help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "--version"
args = ["--version"]
compare = ["exit"]

