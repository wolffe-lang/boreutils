# GNU 9.11, fixture traversal order preserved; allocated sizes measured locally.
[tree.links]
scratch = { a = "abc", "d/b" = "xy", empty = "" }
scratch_dirs = ["d", "d/sub"]
scratch_hardlinks = { h = "a" }
scratch_links = { sym = "a" }
scratch_times = { a = 1000000000, "d/b" = 1000000001, d = 1000000002, "d/sub" = 1000000003, h = 1000000000, sym = 1000000000, empty = 1000000000 }
scratch_time_all = 1000000000

[[case]]
name = "help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "version"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "tree []"
args = ["."]
tree = "links"
env = { TZ = "UTC0" }

