# sort — GNU coreutils 9.11, black-box. Every expectation here was read
# off the GNU binary; the harness compares stdout, stderr's shape and the
# exit status against it, so nothing below states an answer.
#
# Sources: POSIX.1-2024 `sort` for the key grammar and the options it
# names, GNU's `--help` and info node for the rest, and GNU 9.11 run
# black-box under the oracle's environment (LC_ALL=C), `--debug`'s key
# underlines included. Never GNU source.
#
# --help and --version print OUR text (GNU's is the FSF's prose), so
# their cases compare the exit status and stderr only.
#
# Fixtures written for this file:
#   sortwords.txt   words: cases, a blank-led line, a tab-led non-ASCII
#                   line, digits, punctuation, an empty line, duplicates
#   sortnums.txt    numbers in every spelling -n has an opinion about
#   sortpasswd.txt  a passwd-shaped table for -t :
#   sortfields.txt  blank-separated fields with ragged leading blanks
#   sortsorted.txt, sortsorted2.txt   two sorted files, for -c and -m
#   sortdups.txt    sorted, with one duplicate
#   sortmonths.txt  month names in several spellings, for -M
#   sorthuman.txt   sizes with SI suffixes, for -h

# ------------------------------------------------------------ the default: whole lines, as bytes
#
# POSIX: with no key, the whole line is the key; GNU under LC_ALL=C
# compares bytes, so upper case sorts before lower case and a byte above
# 127 after every ASCII one. A missing final newline is supplied, per
# file.

[[case]]
name = "a file of words"
args = ["tests/fixtures/sortwords.txt"]

[[case]]
name = "standard input by default"
stdin = "b\nc\na\n"

[[case]]
name = "a dash operand is standard input"
args = ["-"]
stdin = "b\nc\na\n"

[[case]]
name = "two files are one input"
args = ["tests/fixtures/sortsorted2.txt", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "the same file twice"
args = ["tests/fixtures/sortsorted.txt", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "standard input among files"
args = ["tests/fixtures/sortsorted2.txt", "-", "tests/fixtures/sortsorted.txt"]
stdin = "m\nc\n"

[[case]]
name = "a dash twice reads standard input once"
args = ["-", "-"]
stdin = "b\na\n"

[[case]]
name = "a last line with no newline gets one"
args = ["tests/fixtures/nonl.txt"]

[[case]]
name = "no final newline on standard input"
stdin = "b\na"

[[case]]
name = "a file without a newline does not join the next"
args = ["tests/fixtures/nonl.txt", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "empty input"
args = ["tests/fixtures/empty.txt"]

[[case]]
name = "empty standard input"
stdin = ""

[[case]]
name = "one empty line"
stdin = "\n"

[[case]]
name = "empty lines sort first"
stdin = "b\n\na\n\n"

[[case]]
name = "runs of blank lines"
args = ["tests/fixtures/blanks.txt"]

[[case]]
name = "upper case before lower case"
args = ["tests/fixtures/mixedcase.txt"]

[[case]]
name = "digits before letters"
stdin = "b\n2\nA\n10\n"

[[case]]
name = "a prefix sorts first"
stdin = "abc\nab\nabcd\na\n"

[[case]]
name = "duplicates are kept"
args = ["tests/fixtures/sortdups.txt"]

[[case]]
name = "already sorted"
args = ["tests/fixtures/sortsorted.txt"]

[[case]]
name = "reverse sorted input"
stdin = "e\nd\nc\nb\na\n"

[[case]]
name = "leading blanks are significant"
stdin = "b\n a\n  c\n\td\n"

[[case]]
name = "a tab sorts before a space"
stdin = " x\n\tx\n"

[[case]]
name = "bytes above 127 sort after ASCII"
args = ["tests/fixtures/utf8.txt", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "binary input is byte exact"
args = ["tests/fixtures/binary.bin"]

[[case]]
name = "NUL bytes inside lines"
stdin = "a\u0000b\na\nb\u0000\n"

[[case]]
name = "CRLF is not special"
args = ["tests/fixtures/crlf.txt"]

[[case]]
name = "control characters"
args = ["tests/fixtures/ctrl.txt"]

[[case]]
name = "a line longer than a read"
stdin = "\na\n"

[[case]]
name = "many lines"
stdin = "q\nw\ne\nr\nt\ny\nu\ni\no\np\na\ns\nd\nf\ng\nh\nj\nk\nl\nz\nx\nc\nv\nb\nn\nm\n"
stdin_repeat = 500

[[case]]
name = "the options end at a double dash"
args = ["--", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "a dash-named file after a double dash"
args = ["--", "-"]
stdin = "b\na\n"

# ------------------------------------------------------------ the default: what can go wrong
#
# `sort` exits 2 for trouble (1 is reserved for `-c`'s disorder), reads
# every input before it writes, and stops at the first input it cannot
# read, having written nothing.

[[case]]
name = "a missing file"
args = ["nope"]

[[case]]
name = "a missing file after a good one writes nothing"
args = ["tests/fixtures/sortsorted.txt", "nope"]

[[case]]
name = "a missing file before a good one"
args = ["nope", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "two missing files name the first"
args = ["nope1", "nope2"]

[[case]]
name = "a directory"
args = ["tests/fixtures"]

[[case]]
name = "an empty file name"
args = [""]

[[case]]
name = "a file name that needs quoting"
args = ["no such"]

[[case]]
name = "an unknown option"
args = ["-j", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "y is obsolete and ignored"
args = ["-y", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "y takes an attached word"
args = ["-yr", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "an unknown long option"
args = ["--nope", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "an ambiguous long option"
args = ["--=x"]

[[case]]
name = "an ambiguous prefix"
args = ["--ch", "--r", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "an option missing its argument"
args = ["-k"]

[[case]]
name = "a long option missing its argument"
args = ["--key"]

[[case]]
name = "a flag given an argument"
args = ["--reverse=yes", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "help"
args = ["--help"]
compare = ["exit", "stderr"]

[[case]]
name = "version"
args = ["--version"]
compare = ["exit", "stderr"]

[[case]]
name = "help before a bad option"
args = ["--help", "-j"]
compare = ["exit", "stderr"]

[[case]]
name = "a bad option before help"
args = ["-j", "--help"]

[[case]]
name = "standard output closed"
args = ["tests/fixtures/sortsorted.txt"]
stdout_closed = true

[[case]]
name = "standard output closed, nothing to write"
args = ["tests/fixtures/empty.txt"]
stdout_closed = true

[[case]]
name = "standard output closed, help"
args = ["--help"]
stdout_closed = true
