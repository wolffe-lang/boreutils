# sort — GNU coreutils 9.11, black-box. Every expectation here was read
# off the GNU binary; the harness compares stdout, stderr's shape and the
# exit status against it, so nothing below states an answer.
#
# Sources: POSIX.1-2024 `sort` for the key grammar and the options it
# names, GNU's `--help` and info node for the rest, and GNU 9.11 run
# black-box under the oracle's environment (LC_ALL=C), `--debug`'s key
# underlines included. Never GNU source.
#
# --help and --version print OUR text (GNU's is the FSF's prose), so
# their cases compare the exit status and stderr only.
#
# Fixtures written for this file:
#   sortwords.txt   words: cases, a blank-led line, a tab-led non-ASCII
#                   line, digits, punctuation, an empty line, duplicates
#   sortnums.txt    numbers in every spelling -n has an opinion about
#   sortpasswd.txt  a passwd-shaped table for -t :
#   sortfields.txt  blank-separated fields with ragged leading blanks
#   sortsorted.txt, sortsorted2.txt   two sorted files, for -c and -m
#   sortdups.txt    sorted, with one duplicate
#   sortmonths.txt  month names in several spellings, for -M
#   sorthuman.txt   sizes with SI suffixes, for -h

# ------------------------------------------------------------ the default: whole lines, as bytes
#
# POSIX: with no key, the whole line is the key; GNU under LC_ALL=C
# compares bytes, so upper case sorts before lower case and a byte above
# 127 after every ASCII one. A missing final newline is supplied, per
# file.

[[case]]
name = "a file of words"
args = ["tests/fixtures/sortwords.txt"]

[[case]]
name = "standard input by default"
stdin = "b\nc\na\n"

[[case]]
name = "a dash operand is standard input"
args = ["-"]
stdin = "b\nc\na\n"

[[case]]
name = "two files are one input"
args = ["tests/fixtures/sortsorted2.txt", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "the same file twice"
args = ["tests/fixtures/sortsorted.txt", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "standard input among files"
args = ["tests/fixtures/sortsorted2.txt", "-", "tests/fixtures/sortsorted.txt"]
stdin = "m\nc\n"

[[case]]
name = "a dash twice reads standard input once"
args = ["-", "-"]
stdin = "b\na\n"

[[case]]
name = "a last line with no newline gets one"
args = ["tests/fixtures/nonl.txt"]

[[case]]
name = "no final newline on standard input"
stdin = "b\na"

[[case]]
name = "a file without a newline does not join the next"
args = ["tests/fixtures/nonl.txt", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "empty input"
args = ["tests/fixtures/empty.txt"]

[[case]]
name = "empty standard input"
stdin = ""

[[case]]
name = "one empty line"
stdin = "\n"

[[case]]
name = "empty lines sort first"
stdin = "b\n\na\n\n"

[[case]]
name = "runs of blank lines"
args = ["tests/fixtures/blanks.txt"]

[[case]]
name = "upper case before lower case"
args = ["tests/fixtures/mixedcase.txt"]

[[case]]
name = "digits before letters"
stdin = "b\n2\nA\n10\n"

[[case]]
name = "a prefix sorts first"
stdin = "abc\nab\nabcd\na\n"

[[case]]
name = "duplicates are kept"
args = ["tests/fixtures/sortdups.txt"]

[[case]]
name = "already sorted"
args = ["tests/fixtures/sortsorted.txt"]

[[case]]
name = "reverse sorted input"
stdin = "e\nd\nc\nb\na\n"

[[case]]
name = "leading blanks are significant"
stdin = "b\n a\n  c\n\td\n"

[[case]]
name = "a tab sorts before a space"
stdin = " x\n\tx\n"

[[case]]
name = "bytes above 127 sort after ASCII"
args = ["tests/fixtures/utf8.txt", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "binary input is byte exact"
args = ["tests/fixtures/binary.bin"]

[[case]]
name = "NUL bytes inside lines"
stdin = "a\u0000b\na\nb\u0000\n"

[[case]]
name = "CRLF is not special"
args = ["tests/fixtures/crlf.txt"]

[[case]]
name = "control characters"
args = ["tests/fixtures/ctrl.txt"]

[[case]]
name = "a line longer than a read"
stdin = "\na\n"

[[case]]
name = "many lines"
stdin = "q\nw\ne\nr\nt\ny\nu\ni\no\np\na\ns\nd\nf\ng\nh\nj\nk\nl\nz\nx\nc\nv\nb\nn\nm\n"
stdin_repeat = 500

[[case]]
name = "the options end at a double dash"
args = ["--", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "a dash-named file after a double dash"
args = ["--", "-"]
stdin = "b\na\n"

# ------------------------------------------------------------ the default: what can go wrong
#
# `sort` exits 2 for trouble (1 is reserved for `-c`'s disorder), reads
# every input before it writes, and stops at the first input it cannot
# read, having written nothing.

[[case]]
name = "a missing file"
args = ["nope"]

[[case]]
name = "a missing file after a good one writes nothing"
args = ["tests/fixtures/sortsorted.txt", "nope"]

[[case]]
name = "a missing file before a good one"
args = ["nope", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "two missing files name the first"
args = ["nope1", "nope2"]

[[case]]
name = "a directory"
args = ["tests/fixtures"]

[[case]]
name = "an empty file name"
args = [""]

[[case]]
name = "a file name that needs quoting"
args = ["no such"]

[[case]]
name = "an unknown option"
args = ["-j", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "y is obsolete and ignored"
args = ["-y", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "y takes an attached word"
args = ["-yr", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "an unknown long option"
args = ["--nope", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "an ambiguous long option"
args = ["--=x"]

[[case]]
name = "an ambiguous prefix"
args = ["--ch", "--r", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "an option missing its argument"
args = ["-k"]

[[case]]
name = "a long option missing its argument"
args = ["--key"]

[[case]]
name = "a flag given an argument"
args = ["--reverse=yes", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "help"
args = ["--help"]
compare = ["exit", "stderr"]

[[case]]
name = "version"
args = ["--version"]
compare = ["exit", "stderr"]

[[case]]
name = "help before a bad option"
args = ["--help", "-j"]
compare = ["exit", "stderr"]

[[case]]
name = "a bad option before help"
args = ["-j", "--help"]

[[case]]
name = "standard output closed"
args = ["tests/fixtures/sortsorted.txt"]
stdout_closed = true

[[case]]
name = "standard output closed, nothing to write"
args = ["tests/fixtures/empty.txt"]
stdout_closed = true

[[case]]
name = "standard output closed, help"
args = ["--help"]
stdout_closed = true

# ------------------------------------------------------------ -r, -u and -s
#
# POSIX's -r reverses the comparison; GNU's last-resort comparison of
# whole lines is reversed with it. -u keeps the first of each run of
# equal lines and turns the last resort off; -s turns it off and keeps
# input order among equal keys.

[[case]]
name = "r reverses"
args = ["-r", "tests/fixtures/sortwords.txt"]

[[case]]
name = "r on standard input"
args = ["-r"]
stdin = "a\nc\nb\n"

[[case]]
name = "r keeps duplicates"
args = ["-r", "tests/fixtures/sortdups.txt"]

[[case]]
name = "r with empty lines"
args = ["-r"]
stdin = "b\n\na\n"

[[case]]
name = "reverse spelled long"
args = ["--reverse", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "r twice is still r"
args = ["-r", "-r", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "u drops duplicates"
args = ["-u", "tests/fixtures/sortdups.txt"]

[[case]]
name = "u on groups"
args = ["-u", "tests/fixtures/groups.txt"]

[[case]]
name = "u with r"
args = ["-ur", "tests/fixtures/sortdups.txt"]

[[case]]
name = "u on empty lines"
args = ["-u"]
stdin = "\n\na\n\n"

[[case]]
name = "unique spelled long"
args = ["--unique", "tests/fixtures/sortdups.txt"]

[[case]]
name = "u keeps distinct lines"
args = ["-u", "tests/fixtures/sortwords.txt"]

[[case]]
name = "s on whole lines changes nothing"
args = ["-s", "tests/fixtures/sortwords.txt"]

[[case]]
name = "stable spelled long"
args = ["--stable", "tests/fixtures/sortwords.txt"]

[[case]]
name = "s with r"
args = ["-sr", "tests/fixtures/sortdups.txt"]

[[case]]
name = "u and s together"
args = ["-us", "tests/fixtures/sortdups.txt"]

[[case]]
name = "options permute with operands"
args = ["tests/fixtures/sortsorted2.txt", "-r"]

[[case]]
name = "POSIXLY_CORRECT stops the permutation"
args = ["tests/fixtures/sortsorted2.txt", "-r"]
env = { POSIXLY_CORRECT = "1" }

[[case]]
name = "a prefix naming one option"
args = ["--rev", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "y does not take the next word"
args = ["-y", "-r", "tests/fixtures/sortsorted.txt"]

# ------------------------------------------------------------ -n, -h, -M and --sort
#
# -n: optional blanks, an optional '-', digits, an optional '.' and
# digits; no '+', no exponent, no thousands separator in the C locale;
# an empty number is zero and signs on zero do not count. Lines equal
# as numbers fall to the last-resort byte comparison. -h orders by sign,
# then SI suffix, then value. -M folds the first three bytes after blanks
# to upper case and compares JAN..DEC, anything else lowest.

[[case]]
name = "n on a mixed file"
args = ["-n", "tests/fixtures/sortnums.txt"]

[[case]]
name = "n reversed"
args = ["-nr", "tests/fixtures/sortnums.txt"]

[[case]]
name = "n unique"
args = ["-nu", "tests/fixtures/sortnums.txt"]

[[case]]
name = "n stable"
args = ["-ns", "tests/fixtures/sortnums.txt"]

[[case]]
name = "n with leading zeros"
args = ["-n"]
stdin = "007\n7\n07.0\n1\n"

[[case]]
name = "n unique keeps the first equal"
args = ["-nu"]
stdin = "007\n7\n07.0\n"

[[case]]
name = "n fractions digit by digit"
args = ["-n"]
stdin = "1.10\n1.9\n1.09\n1.1\n"

[[case]]
name = "n negative numbers"
args = ["-n"]
stdin = "-1\n-2\n-10\n-1.5\n-0.5\n"

[[case]]
name = "n every spelling of zero"
args = ["-n"]
stdin = "0.0\n-0\n.\n-.\n-\n0\n"

[[case]]
name = "n every spelling of zero, stable"
args = ["-ns"]
stdin = "0.0\n-0\n.\n-.\n-\n0\n"

[[case]]
name = "n plus is not a sign"
args = ["-n"]
stdin = "+5\n3\n-1\n"

[[case]]
name = "n stops at a comma"
args = ["-n"]
stdin = "1,000\n2\n999\n"

[[case]]
name = "n stops at an exponent"
args = ["-n"]
stdin = "1e3\n2\n1E5\n"

[[case]]
name = "n longer than any integer"
args = ["-n"]
stdin = "99999999999999999999999\n99999999999999999999998\n1\n-99999999999999999999999\n"

[[case]]
name = "n blank lines are zero"
args = ["-n"]
stdin = "1\n\n-1\n\n"

[[case]]
name = "n with leading tabs and spaces"
args = ["-n"]
stdin = "\t 5\n 4\n6\n"

[[case]]
name = "numeric-sort spelled long"
args = ["--numeric-sort", "tests/fixtures/sortnums.txt"]

[[case]]
name = "n reversed stable"
args = ["-nrs"]
stdin = "10\n9\n010\n"

[[case]]
name = "h on sizes"
args = ["-h", "tests/fixtures/sorthuman.txt"]

[[case]]
name = "h reversed"
args = ["-hr", "tests/fixtures/sorthuman.txt"]

[[case]]
name = "h unique"
args = ["-hu", "tests/fixtures/sorthuman.txt"]

[[case]]
name = "human-numeric-sort spelled long"
args = ["--human-numeric-sort", "tests/fixtures/sorthuman.txt"]

[[case]]
name = "h plain numbers"
args = ["-h"]
stdin = "10\n9\n-3\n0\n"

[[case]]
name = "M on months"
args = ["-M", "tests/fixtures/sortmonths.txt"]

[[case]]
name = "M reversed"
args = ["-Mr", "tests/fixtures/sortmonths.txt"]

[[case]]
name = "M unique"
args = ["-Mu", "tests/fixtures/sortmonths.txt"]

[[case]]
name = "month-sort spelled long"
args = ["--month-sort", "tests/fixtures/sortmonths.txt"]

[[case]]
name = "M short names are not months"
args = ["-M"]
stdin = "ja\nJA\nJan\n"

[[case]]
name = "sort=numeric"
args = ["--sort=numeric", "tests/fixtures/sortnums.txt"]

[[case]]
name = "sort=month"
args = ["--sort=month", "tests/fixtures/sortmonths.txt"]

[[case]]
name = "sort=human-numeric"
args = ["--sort=human-numeric", "tests/fixtures/sorthuman.txt"]

[[case]]
name = "sort=WORD abbreviated"
args = ["--sort=n", "tests/fixtures/sortnums.txt"]

[[case]]
name = "sort=WORD that is not one"
args = ["--sort=bogus", "tests/fixtures/sortnums.txt"]

[[case]]
name = "sort=WORD ambiguous"
args = ["--sort=", "tests/fixtures/sortnums.txt"]

[[case]]
name = "sort=WORD case matters"
args = ["--sort=Numeric", "tests/fixtures/sortnums.txt"]

[[case]]
name = "sort=month then numeric"
args = ["--sort=month", "--sort=numeric", "tests/fixtures/sortnums.txt"]

[[case]]
name = "n and g together"
args = ["-ng", "tests/fixtures/sortnums.txt"]

[[case]]
name = "n and M together"
args = ["-nM", "tests/fixtures/sortnums.txt"]

[[case]]
name = "h and M together"
args = ["-hM", "tests/fixtures/sortnums.txt"]

[[case]]
name = "n and R together"
args = ["-nR", "tests/fixtures/sortnums.txt"]

[[case]]
name = "g and V together"
args = ["-gV", "tests/fixtures/sortnums.txt"]

[[case]]
name = "all six numeric kinds"
args = ["-ngMhRV", "tests/fixtures/sortnums.txt"]

# ------------------------------------------------------------ -f, -d, -i and -b
#
# -f folds lower case to upper case; -d compares only blanks, letters
# and digits; -i only printable bytes, and has no effect beside -d; -b
# skips the blanks that start the key (with no -k, the line).

[[case]]
name = "f folds case"
args = ["-f", "tests/fixtures/sortwords.txt"]

[[case]]
name = "f on mixed case"
args = ["-f", "tests/fixtures/mixedcase.txt"]

[[case]]
name = "f puts underscore after letters"
args = ["-f"]
stdin = "_a\nb\nA\n"

[[case]]
name = "f unique keeps the first seen"
args = ["-fu"]
stdin = "B\na\nb\nA\n"

[[case]]
name = "f stable"
args = ["-fs"]
stdin = "B\na\nb\nA\n"

[[case]]
name = "f reversed"
args = ["-fr"]
stdin = "B\na\nb\nA\n"

[[case]]
name = "ignore-case spelled long"
args = ["--ignore-case", "tests/fixtures/sortwords.txt"]

[[case]]
name = "d ignores punctuation"
args = ["-d"]
stdin = "a-b\nab\na b\n_a\n"

[[case]]
name = "d on words"
args = ["-d", "tests/fixtures/sortwords.txt"]

[[case]]
name = "d unique"
args = ["-du"]
stdin = "a-b\nab\na.b\n"

[[case]]
name = "d keeps tabs"
args = ["-d"]
stdin = "a\tb\na b\nab\n"

[[case]]
name = "dictionary-order spelled long"
args = ["--dictionary-order", "tests/fixtures/sortwords.txt"]

[[case]]
name = "i ignores control bytes"
args = ["-i"]
stdin = "a\u0001b\nab\naa\n"

[[case]]
name = "i on the control fixture"
args = ["-i", "tests/fixtures/ctrl.txt"]

[[case]]
name = "i ignores high bytes"
args = ["-i", "tests/fixtures/utf8.txt", "tests/fixtures/sortsorted.txt"]

[[case]]
name = "i ignores tabs"
args = ["-i"]
stdin = "a\tc\nab\n"

[[case]]
name = "ignore-nonprinting spelled long"
args = ["--ignore-nonprinting", "tests/fixtures/ctrl.txt"]

[[case]]
name = "d and i together"
args = ["-di"]
stdin = "a\tc\na\u0001b\nab\n"

[[case]]
name = "d and f together"
args = ["-df", "tests/fixtures/sortwords.txt"]

[[case]]
name = "f d and i together"
args = ["-dfi", "tests/fixtures/sortwords.txt"]

[[case]]
name = "b on indented lines"
args = ["-b"]
stdin = "  a\n b\nc\n\td\n"

[[case]]
name = "b on words"
args = ["-b", "tests/fixtures/sortwords.txt"]

[[case]]
name = "b unique"
args = ["-bu"]
stdin = " a\na\n  a\n"

[[case]]
name = "ignore-leading-blanks spelled long"
args = ["--ignore-leading-blanks", "tests/fixtures/sortwords.txt"]

[[case]]
name = "b with n"
args = ["-bn"]
stdin = " 2\n1\n  3\n"

[[case]]
name = "d and n together"
args = ["-dn", "tests/fixtures/sortnums.txt"]

[[case]]
name = "i and n together"
args = ["-in", "tests/fixtures/sortnums.txt"]

[[case]]
name = "d and M together"
args = ["-dM", "tests/fixtures/sortmonths.txt"]

[[case]]
name = "i and g together"
args = ["-ig", "tests/fixtures/sortnums.txt"]

[[case]]
name = "i and h together"
args = ["-ih", "tests/fixtures/sortnums.txt"]

[[case]]
name = "d f i and n together"
args = ["-dfin", "tests/fixtures/sortnums.txt"]
