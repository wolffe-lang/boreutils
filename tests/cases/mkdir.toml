[[case]]
name = "-p: the rest are still made"
args = ["-p", "a/n1", "f/n2", "a/n3"]
scratch = { "f" = "x\n" }

[[case]]
name = "-p: an empty name"
args = ["-p", ""]

[[case]]
name = "-p: the working directory"
args = ["-p", "."]

[[case]]
name = "-p: ./"
args = ["-p", "./"]

[[case]]
name = "-p: dot components"
args = ["-p", "./t/./u"]

[[case]]
name = "-p: a final dot"
args = ["-p", "d/new/."]
scratch_dirs = ["d"]

[[case]]
name = "-p: doubled slashes"
args = ["-p", "t//u///"]

[[case]]
name = "-p: a link to a directory"
args = ["-p", "l"]
scratch_dirs = ["d"]
scratch_links = { "l" = "d" }

[[case]]
name = "-p: through a link to a directory"
args = ["-p", "l/x/y"]
scratch_dirs = ["d"]
scratch_links = { "l" = "d" }

[[case]]
name = "-p: a dangling link"
args = ["-p", "l"]
scratch_links = { "l" = "nowhere" }

[[case]]
name = "-p: through a dangling link"
args = ["-p", "l/x"]
scratch_links = { "l" = "nowhere" }

[[case]]
name = "-p: a link to a file"
args = ["-p", "l"]
scratch = { "f" = "x\n" }
scratch_links = { "l" = "f" }

[[case]]
name = "-p: through a link to a file"
args = ["-p", "l/x"]
scratch = { "f" = "x\n" }
scratch_links = { "l" = "f" }

[[case]]
name = "-p: a directory that may not be written"
args = ["-p", "ro/x/y"]
scratch_dirs = ["ro"]
scratch_modes = { "ro" = 0o555 }

[[case]]
name = "-p: a directory that may not be searched"
args = ["-p", "no/sub/x"]
scratch_dirs = ["no/sub"]
scratch_modes = { "no" = 0o000 }

[[case]]
name = "-p: a new name in a directory that may not be searched"
args = ["-p", "no/new"]
scratch_dirs = ["no"]
scratch_modes = { "no" = 0o000 }

[[case]]
name = "-p: the directory that may not be searched, itself"
args = ["-p", "no"]
scratch_dirs = ["no"]
scratch_modes = { "no" = 0o000 }

[[case]]
name = "-p: deep in a directory that may not be searched"
args = ["-p", "ok/no/a/b"]
scratch_dirs = ["ok/no"]
scratch_modes = { "ok/no" = 0o000 }

[[case]]
name = "-p: an absolute path"
args = ["-p", "{scratch}/x/y"]

[[case]]
name = "-p: no operand"
args = ["-p"]

[[case]]
name = "--parents"
