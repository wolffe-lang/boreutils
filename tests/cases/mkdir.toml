[[case]]
name = "-p: part of it exists"
args = ["-p", "x/y/z"]
scratch_dirs = ["x"]

[[case]]
name = "-p: an existing directory is no error"
args = ["-p", "a"]
scratch_dirs = ["a"]

[[case]]
name = "-p: a file is in the way"
args = ["-p", "f"]
scratch = { "f" = "x\n" }

[[case]]
name = "-p: a file is in the way, with a slash"
args = ["-p", "f/"]
scratch = { "f" = "x\n" }

