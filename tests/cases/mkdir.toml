[[case]]
name = "a mask of 077"
args = ["a"]
umask = 0o077

[[case]]
name = "a mask of 027 under -p"
args = ["-p", "a/b/c"]
umask = 0o027

[[case]]
name = "a mask of 077 under -p"
args = ["-p", "a/b/c"]
umask = 0o077

[[case]]
name = "a mask of 000"
args = ["-p", "a/b"]
umask = 0o000

[[case]]
name = "a mask that takes the owner's write: one directory"
args = ["a"]
umask = 0o277

# What this mkdir cannot match, named: see the header of src/mkdir.lu.
[[case]]
name = "a mask that takes the owner's write: -p"
args = ["-p", "a/b/c"]
umask = 0o277
skip = "GNU gives a missing parent u+wx whatever the mask says; wolf cannot read or set the mask (wolf-lang#704), so the parent gets the mask's mode and the host refuses the next component"

[[case]]
name = "a mask that takes the owner's search: -p"
args = ["-p", "a/b"]
umask = 0o177
skip = "GNU gives a missing parent u+wx whatever the mask says; wolf cannot read or set the mask (wolf-lang#704)"

[[case]]
name = "a mask that takes the owner's write: -p of one new component"
args = ["-p", "a"]
umask = 0o277

[[case]]
