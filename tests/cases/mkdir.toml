# mkdir — GNU coreutils 9.11, black-box, on linux x86-64 and macOS arm64.
# Written by ~/lanes/bu21/gen/mkdir_cases.py (kept beside the lane's
# evidence, not in the repository); this file is the record.
#
# mkdir changes the file system, so every case runs in a scratch
# directory whether it names one or not (tools/difftest, bu21), and what
# each side leaves is compared twice: `files` (names, kinds, bytes) and
# `tree` (modes, link counts). No case names a path outside it.
#
# What this mkdir cannot match is named, never imitated:
#   wolf-lang#346  no mode at creation and no chmod: -m is refused (skips)
#   wolf-lang#704  no umask: under -p a missing parent gets the mask's
#                  mode, not GNU's u+wx (two skips, under masks that take
#                  the owner's write or search)

[[case]]
name = "no operand"
args = []

[[case]]
name = "one directory"
args = ["a"]

[[case]]
name = "two directories"
args = ["a", "b"]

[[case]]
name = "a directory that exists"
args = ["a"]
scratch_dirs = ["a"]

[[case]]
name = "a file is in the way"
args = ["f"]
scratch = { "f" = "x\n" }

[[case]]
name = "a missing parent"
args = ["x/y/z"]

[[case]]
name = "the rest are still made"
args = ["a", "b", "a", "c"]
scratch_dirs = ["a"]

[[case]]
name = "a trailing slash"
args = ["t/"]

[[case]]
name = "a trailing slash on a file"
args = ["f/"]
scratch = { "f" = "x\n" }

[[case]]
name = "inside an existing directory"
args = ["d/e"]
scratch_dirs = ["d"]

[[case]]
name = "under a file"
args = ["f/x"]
scratch = { "f" = "x\n" }

[[case]]
name = "an empty name"
args = [""]

[[case]]
name = "the working directory"
args = ["."]

[[case]]
name = "a link to a directory is in the way"
args = ["l"]
scratch_dirs = ["d"]
scratch_links = { "l" = "d" }

[[case]]
name = "a dangling link is in the way"
args = ["l"]
scratch_links = { "l" = "nowhere" }

[[case]]
name = "through a link to a directory"
args = ["l/x"]
scratch_dirs = ["d"]
scratch_links = { "l" = "d" }

[[case]]
name = "a directory that may not be written"
args = ["ro/x"]
scratch_dirs = ["ro"]
scratch_modes = { "ro" = 0o555 }

[[case]]
name = "a directory that may not be searched"
args = ["no/x"]
scratch_dirs = ["no"]
scratch_modes = { "no" = 0o000 }

[[case]]
name = "a name with a space"
args = ["sp ace"]

[[case]]
name = "names that need quoting, taken"
args = ["q'uote", "a\"b", "tab\tx", "new\nline", "\u00e9", "back\\slash"]
scratch_dirs = ["q'uote", "a\"b", "tab\tx", "new\nline", "\u00e9", "back\\slash"]

[[case]]
name = "-- ends the options"
args = ["--", "-p"]

[[case]]
name = "a name that begins with a dash, refused as an option"
args = ["-x"]

[[case]]
name = "POSIXLY_CORRECT: the first operand ends the options"
args = ["pc", "-v", "pc2"]
env = { "POSIXLY_CORRECT" = "1" }

[[case]]
name = "the cwd is a subdirectory"
args = ["x"]
scratch_dirs = ["d"]
cwd = "d"

[[case]]
name = "an absolute path"
args = ["{scratch}/abs"]

[[case]]
name = "an absolute path that exists"
args = ["{scratch}/d"]
scratch_dirs = ["d"]

[[case]]
name = "-v"
args = ["-v", "a"]

[[case]]
name = "-v, several"
args = ["-v", "a", "b", "c"]

[[case]]
name = "--verbose"
args = ["--verbose", "a"]

[[case]]
name = "--verb abbreviates"
args = ["--verb", "a"]

[[case]]
name = "--v is ambiguous"
args = ["--v", "a"]

[[case]]
name = "-v says nothing of a failure"
args = ["-v", "a", "b"]
scratch_dirs = ["a"]

[[case]]
name = "-v with a trailing slash"
