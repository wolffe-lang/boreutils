args = ["-Z"]

# -m: refused by name (wolf-lang#346).
[[case]]
name = "-m 700"
args = ["-m", "700", "m"]
skip = "a directory's mode cannot be set in wolf 0.2.27 (wolf-lang#346): -m is refused by name, status 1, and nothing is made"

[[case]]
name = "-m attached"
args = ["-m755", "m"]
skip = "a directory's mode cannot be set in wolf 0.2.27 (wolf-lang#346): -m is refused by name, status 1, and nothing is made"

[[case]]
name = "--mode=u+x,g-w"
args = ["--mode=u+x,g-w", "m"]
skip = "a directory's mode cannot be set in wolf 0.2.27 (wolf-lang#346): -m is refused by name, status 1, and nothing is made"

[[case]]
name = "-m 0"
args = ["-m", "0", "m"]
skip = "a directory's mode cannot be set in wolf 0.2.27 (wolf-lang#346): -m is refused by name, status 1, and nothing is made"

[[case]]
name = "-m a=rwxt"
args = ["-m", "a=rwxt", "m"]
skip = "a directory's mode cannot be set in wolf 0.2.27 (wolf-lang#346): -m is refused by name, status 1, and nothing is made"

[[case]]
name = "-pm 700: the parents take the mask, the last the mode"
args = ["-pm", "700", "pm/a/b"]
skip = "a directory's mode cannot be set in wolf 0.2.27 (wolf-lang#346): -m is refused by name, status 1, and nothing is made"

[[case]]
name = "-m with an invalid mode"
args = ["-m", "999", "m"]
skip = "a directory's mode cannot be set in wolf 0.2.27 (wolf-lang#346): -m is refused by name, status 1, and nothing is made (GNU says: invalid mode '999')"

[[case]]
name = "-m with no argument"
args = ["-m"]

[[case]]
name = "--mode with no argument"
args = ["--mode"]

[[case]]
