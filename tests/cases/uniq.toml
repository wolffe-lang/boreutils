# ----------------------------------------------------------- the operands

[[case]]
name = "standard input by default"
stdin = "a\na\nb\n"

[[case]]
name = "a dash operand is standard input"
args = ["-"]
stdin = "a\na\nb\n"

[[case]]
name = "an OUTPUT operand of /dev/stdout"
args = ["tests/fixtures/groups.txt", "/dev/stdout"]

[[case]]
name = "an OUTPUT operand of /dev/null"
args = ["tests/fixtures/groups.txt", "/dev/null"]

[[case]]
name = "a dash OUTPUT operand is standard output"
args = ["tests/fixtures/groups.txt", "-"]

[[case]]
name = "an OUTPUT that cannot be created"
args = ["tests/fixtures/groups.txt", "tests/fixtures/nosuchdir/out.txt"]

[[case]]
name = "three operands"
args = ["tests/fixtures/groups.txt", "/dev/null", "extra"]

[[case]]
name = "a missing INPUT"
args = ["tests/fixtures/nosuch.txt"]

[[case]]
name = "a missing INPUT whose name needs quoting"
args = ["tests/fixtures/no such file.txt"]

[[case]]
name = "a missing INPUT whose name holds a quote"
args = ["tests/fixtures/a'b"]

[[case]]
name = "a directory as INPUT"
