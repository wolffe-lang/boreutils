# ------------------------------------------------------- NUL-terminated

[[case]]
name = "-z"
args = ["-z", "tests/fixtures/groups0.bin"]

[[case]]
name = "-z -c"
args = ["-z", "-c", "tests/fixtures/groups0.bin"]

[[case]]
name = "-z -D"
args = ["-z", "-D", "tests/fixtures/groups0.bin"]

[[case]]
name = "--zero-terminated"
args = ["--zero-terminated", "tests/fixtures/groups0.bin"]

[[case]]
name = "-z over newline-separated input sees one record"
args = ["-z", "tests/fixtures/groups.txt"]

[[case]]
