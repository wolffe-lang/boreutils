# ------------------------------------------------------- help and version

[[case]]
name = "--help"
args = ["--help"]
compare = ["exit", "stderr"]

[[case]]
name = "--version"
args = ["--version"]
compare = ["exit", "stderr"]

[[case]]
name = "--help wins when it comes first"
args = ["--help", "-Q"]
compare = ["exit", "stderr"]

[[case]]
name = "a bad option before --help is still an error"
args = ["-Q", "--help"]
