# env — GNU coreutils 9.11, black-box, on linux x86-64 and macOS arm64
# (bu20, wolf 0.2.27: s225's os_exec and the handed environment).
#
# tools/difftest builds every case's environment from scratch (PATH,
# then [oracle.env], then the case's own), so what a case can see is
# exactly what it names. `env` replaces itself with the command, so the
# status a case compares is the command's own.
#
# What this env cannot match is named, never imitated:
#   wolf-lang#535  env_vars() answers the environment SORTED: a listing
#                  that starts from the inherited environment is in
#                  another order than GNU's (skips). Under -i the order
#                  is exact: a new entry goes where the host's C
#                  library puts one, last on linux and first on macOS
#   [os.proc.exec] an entry with an empty name is refused by os_exec
# and -S, -v and the signal options are not written yet (skips).
# The help and version TEXT is ours, so those compare the exit only.

[tree.box]
scratch_dirs = ["d"]
scratch = { "f" = "x", "noshebang" = "echo script ran $1\n", "badinterp" = "#!/nonexistent/interp\n", "noexec" = "echo x\n", "hello" = "#!/bin/sh\necho hello $0 $1\n", "argonly" = "#!/bin/sh\necho only $1\n" }
scratch_modes = { "noshebang" = 0o755, "badinterp" = 0o755, "hello" = 0o755, "argonly" = 0o755 }

# --- printing the environment it would hand on
[[case]]
name = "-i alone prints nothing"
args = ["-i"]

[[case]]
name = "-i and two entries, in the host's order"
args = ["-i", "A=1", "B=2"]

[[case]]
name = "-i orders new entries as the host does, never by the alphabet"
args = ["-i", "B=2", "A=1"]

[[case]]
name = "a name given twice keeps its first place and its last value"
args = ["-i", "B=2", "A=1", "B=3"]

[[case]]
name = "a lone - is -i"
args = ["-", "A=1"]

[[case]]
name = "-i and -"
args = ["-i", "-", "A=1"]

[[case]]
name = "--ignore-environment"
args = ["--ignore-environment", "A=1"]

[[case]]
name = "an empty value"
args = ["-i", "A="]

[[case]]
name = "a value holding ="
args = ["-i", "A=1=2"]

[[case]]
name = "a name holding a space"
args = ["-i", "A B=1"]

[[case]]
name = "a value holding a space and a newline"
args = ["-i", "A=x y\nz"]

[[case]]
name = "an entry with an empty name is printed"
args = ["-i", "=x"]

[[case]]
name = "-0 ends each entry with NUL"
args = ["-i", "-0", "A=1", "B=2"]

[[case]]
name = "--null"
args = ["--null", "-i", "A=1"]

[[case]]
name = "-i0"
args = ["-i0", "A=1"]

[[case]]
name = "-u of a name set later still sets it"
args = ["-iu", "A", "A=1"]

[[case]]
name = "-u after -i of nothing"
args = ["-i", "-u", "A"]

[[case]]
name = "-- ends the options"
args = ["-i", "--", "A=1"]

[[case]]
name = "-u removes an inherited variable, seen by the command"
args = ["-u", "GONE", "sh", "-c", "echo [${GONE-unset}]"]
env = { "GONE" = "here" }

[[case]]
name = "--unset="
args = ["--unset=GONE", "sh", "-c", "echo [${GONE-unset}]"]
env = { "GONE" = "here" }

[[case]]
name = "two -u"
args = ["-u", "A", "-u", "B", "sh", "-c", "echo [${A-unset}] [${B-unset}] [$C]"]
env = { "A" = "1", "B" = "2", "C" = "3" }

[[case]]
name = "-u of a variable that is not set"
args = ["-u", "NOPE_NOT_SET", "true"]

[[case]]
name = "-u of an empty name is refused, status 125"
args = ["-u", "", "true"]

[[case]]
name = "-u of a name holding = is refused"
args = ["-u", "A=B", "true"]

[[case]]
name = "-u needs an argument"
args = ["-u"]

[[case]]
name = "an inherited variable is replaced"
args = ["A=new", "sh", "-c", "echo $A"]
env = { "A" = "old" }

[[case]]
name = "an inherited variable is kept"
args = ["B=2", "sh", "-c", "echo $A $B"]
env = { "A" = "old" }

# --- running a command
[[case]]
name = "the command sees the variable"
args = ["-i", "A=1", "/bin/sh", "-c", "echo $A"]

[[case]]
name = "the command's status is the status"
args = ["sh", "-c", "exit 7"]

[[case]]
name = "false is 1"
args = ["false"]

[[case]]
name = "true with arguments"
args = ["true", "extra", "args"]

[[case]]
name = "the last value of a name given twice"
args = ["-i", "A=1", "A=2", "/bin/sh", "-c", "echo $A"]

[[case]]
name = "a variable with an empty value is set"
args = ["A=", "sh", "-c", "echo [${A-unset}]"]

[[case]]
name = "-i empties the environment the command sees"
args = ["-i", "/bin/sh", "-c", "echo [${LC_ALL-unset}]"]

[[case]]
name = "a command killed by a signal"
args = ["sh", "-c", "kill -9 $$"]

[[case]]
name = "a command ended by TERM"
args = ["sh", "-c", "kill -15 $$"]

[[case]]
name = "options after the first assignment are the command"
args = ["-i", "A=1", "-u", "A"]

[[case]]
name = "-i after an assignment is the command"
args = ["-i", "A=1", "-i"]

[[case]]
name = "-0 after an assignment is the command"
args = ["-i", "A=1", "-0"]

[[case]]
name = "a word with no = after assignments is the command"
args = ["-i", "A=1", "B"]

[[case]]
name = "-- and then a dash word is the command"
args = ["--", "-i"]

[[case]]
name = "a second - is the command"
args = ["-i", "A=1", "-", "B=2"]

[[case]]
name = "env runs env"
args = ["-i", "A=1", "env"]

[[case]]
name = "env runs printenv"
args = ["-i", "A=1", "printenv", "A"]

[[case]]
name = "the command's output and status"
args = ["-i", "A=1", "sh", "-c", "echo $A; exit 3"]

[[case]]
name = "standard input reaches the command"
args = ["sh", "-c", "read x; echo got $x"]
stdin = "line\n"

# --- which program: the PATH of the NEW environment
[[case]]
name = "no PATH at all: the default one"
tree = "box"
args = ["-i", "ls", "-d", "."]

[[case]]
name = "an empty PATH is the working directory"
tree = "box"
args = ["-i", "PATH=", "ls", "-d", "."]

[[case]]
name = "a PATH with no such program"
tree = "box"
args = ["-i", "PATH=/nonexistent", "ls"]

[[case]]
name = "a new PATH replaces the inherited one"
tree = "box"
args = ["PATH=/nonexistent", "true"]

[[case]]
name = "the PATH the command sees"
tree = "box"
args = ["-i", "PATH=/usr/bin:/bin", "sh", "-c", "echo $PATH"]

[[case]]
name = "-u PATH: the default one finds sh"
tree = "box"
args = ["-u", "PATH", "sh", "-c", "echo hi"]

[[case]]
name = "-u PATH and no such program"
tree = "box"
args = ["-u", "PATH", "nope-cmd"]

[[case]]
name = "a command that is not found is 127"
tree = "box"
args = ["nope-cmd"]

[[case]]
name = "-i and a command that is not found"
tree = "box"
args = ["-i", "nope-cmd"]

[[case]]
name = "a command with a slash is used as written"
tree = "box"
args = ["./hello", "arg"]

[[case]]
name = "an empty PATH component finds it in the working directory"
tree = "box"
args = ["-i", "PATH=", "argonly", "arg"]

[[case]]
name = "an empty component between two others"
tree = "box"
args = ["-i", "PATH=/nonexistent::/nowhere", "argonly", "arg"]

[[case]]
name = "PATH=. finds it"
tree = "box"
args = ["-i", "PATH=.", "hello", "arg"]

[[case]]
name = "a file with no execute bit is 126"
tree = "box"
args = ["./f"]

[[case]]
name = "a directory is 126"
tree = "box"
args = ["./d"]

[[case]]
name = "a file that is no program is 126"
tree = "box"
args = ["/etc/passwd"]

[[case]]
name = "a script whose interpreter is missing is 127"
tree = "box"
args = ["./badinterp"]

[[case]]
name = "a script with no #! line runs under sh"
tree = "box"
args = ["./noshebang", "arg"]

[[case]]
name = "the same under -i"
tree = "box"
args = ["-i", "./noshebang", "arg"]

[[case]]
name = "the same found along PATH"
tree = "box"
args = ["-i", "PATH=.", "noshebang", "arg"]

[[case]]
name = "a script with no #! line and no execute bit is 126"
tree = "box"
args = ["./noexec"]

# --- -C and -a
[[case]]
name = "-C changes the directory first"
tree = "box"
args = ["-C", "d", "pwd"]

[[case]]
name = "--chdir="
tree = "box"
args = ["--chdir=d", "pwd"]

[[case]]
name = "-C with -i and an assignment"
tree = "box"
args = ["-i", "-C", "d", "A=1", "/bin/sh", "-c", "pwd; echo $A"]

[[case]]
name = "-iC"
tree = "box"
args = ["-iC", "d", "/bin/pwd"]

[[case]]
name = "-C of a missing directory is 125"
tree = "box"
args = ["-C", "nope", "pwd"]

[[case]]
name = "-C of a file is 125"
tree = "box"
args = ["-C", "f", "pwd"]

[[case]]
name = "-C with no command is a usage error"
tree = "box"
args = ["-C", "d"]

[[case]]
name = "-C needs an argument"
tree = "box"
args = ["-C"]

[[case]]
name = "-C twice: the last"
tree = "box"
args = ["-C", "nope", "-C", "d", "pwd"]

[[case]]
name = "-C twice: the last, which is missing"
tree = "box"
args = ["-C", "d", "-C", "nope", "pwd"]

[[case]]
name = "-C and a relative command"
tree = "box"
args = ["-C", "d", "../hello", "x"]

[[case]]
name = "-a names the program to itself"
tree = "box"
args = ["-a", "zero", "/bin/sh", "-c", "echo $0"]
gnu_min = "9.11"

[[case]]
name = "--argv0="
tree = "box"
args = ["--argv0=zero", "sh", "-c", "echo $0"]
gnu_min = "9.11"

[[case]]
name = "-a needs an argument"
tree = "box"
args = ["-a"]
gnu_min = "9.11"

[[case]]
name = "-a and a script"
tree = "box"
args = ["-a", "other", "./hello", "x"]
gnu_min = "9.11"

# --- usage
[[case]]
name = "-0 with a command is a usage error"
args = ["-0", "true"]

[[case]]
name = "an unknown option is 125"
args = ["-x"]

[[case]]
name = "an unknown long option"
args = ["--nope"]

[[case]]
name = "--help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "--version"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "a closed standard output with nothing to print"
args = ["-i"]
stdout_closed = true

[[case]]
name = "a closed standard output and an entry to print"
args = ["-i", "A=1"]
stdout_closed = true

[[case]]
name = "a full device"
args = ["-i", "A=1"]
stdout_file = "/dev/full"

# --- named differences
[[case]]
name = "the inherited environment, as it is"
args = []
skip = "wolf 0.2.27 lists the environment only through env_vars(), which answers it SORTED; GNU prints the order the process received, and the harness hands every case PATH before LC_ALL (wolf-lang#535)"

[[case]]
name = "the inherited environment and one more"
args = ["Z=1"]
skip = "wolf 0.2.27 lists the environment only through env_vars(), which answers it SORTED; GNU prints the order the process received, and the harness hands every case PATH before LC_ALL (wolf-lang#535)"

[[case]]
name = "the inherited environment less one"
args = ["-u", "LC_ALL"]
skip = "wolf 0.2.27 lists the environment only through env_vars(), which answers it SORTED; GNU prints the order the process received, and the harness hands every case PATH before LC_ALL (wolf-lang#535)"

[[case]]
name = "the inherited environment under -0"
args = ["-0"]
skip = "wolf 0.2.27 lists the environment only through env_vars(), which answers it SORTED; GNU prints the order the process received, and the harness hands every case PATH before LC_ALL (wolf-lang#535)"

[[case]]
name = "what a command inherits, in order"
args = ["env"]
skip = "wolf 0.2.27 lists the environment only through env_vars(), which answers it SORTED; GNU prints the order the process received, and the harness hands every case PATH before LC_ALL (wolf-lang#535)"

[[case]]
name = "an entry with an empty name, handed to a command"
args = ["=x", "true"]
skip = "os_exec refuses an environment entry with an empty name as `invalid` ([os.proc.exec]); GNU hands it on. Status 125 here, said so"

[[case]]
name = "the name a script found through an empty PATH component is started by"
tree = "box"
args = ["-i", "PATH=", "hello", "arg"]
skip = "os_exec runs ./hello for an empty PATH component where execvp runs hello, and the script prints it as $0 (wolf-lang#689)"

[[case]]
name = "-S splits a string into the command"
args = ["-S", "sh -c 'echo hi'"]
skip = "-S/--split-string is not written yet: refused by name, status 125"

[[case]]
name = "-v says what it runs"
args = ["-v", "true"]
skip = "-v/--debug is not written yet: refused by name, status 125"

[[case]]
name = "--default-signal"
args = ["--default-signal=PIPE", "true"]
skip = "the signal options are not written yet: refused by name, status 125"

[[case]]
name = "--ignore-signal"
args = ["--ignore-signal=PIPE", "true"]
skip = "the signal options are not written yet: refused by name, status 125"

[[case]]
name = "--block-signal"
args = ["--block-signal=PIPE", "true"]
skip = "the signal options are not written yet: refused by name, status 125"

[[case]]
name = "--list-signal-handling"
args = ["--list-signal-handling", "true"]
skip = "the signal options are not written yet: refused by name, status 125"

