# seq — GNU coreutils 9.11, black-box. Every expectation here was read
# off the GNU binary on BOTH hosts (macOS arm64 Homebrew `gseq`, linux
# x86-64 native `seq`), which agreed on every case in this file.
#
# The contract named seq's float formatting as a likely GNU version-skew
# site. It is not one BETWEEN THE TWO 9.11 HOSTS: every probe this file
# was written from answered identically on both. It could not be checked
# against the 9.4 oracle CI runs, because neither host has one, so no
# case here asserts anything that only 9.11 does; if CI finds one, that
# case is the place to put a gnu_min.
#
# The skew that IS here is between the two hosts' C libraries, not
# between coreutils releases, and the four skipped cases at the end name
# it.
#
# seq takes no file operands and reads no input, so every case is
# arguments and arguments alone.
#
# --help and --version print OUR text (GNU's is the FSF's prose), so
# their cases compare the exit status and stderr only.

# ------------------------------------------------------- the three forms

[[case]]
name = "one operand is LAST"
args = ["5"]

[[case]]
name = "one operand of zero prints nothing"
args = ["0"]

[[case]]
name = "one negative operand prints nothing"
args = ["-3"]

[[case]]
name = "two operands are FIRST and LAST"
args = ["2", "5"]

[[case]]
name = "two operands the wrong way round print nothing"
args = ["5", "2"]

[[case]]
name = "three operands are FIRST, INCREMENT and LAST"
args = ["1", "2", "9"]

[[case]]
name = "FIRST equal to LAST is one value"
args = ["3", "3"]

[[case]]
name = "an INCREMENT larger than the range is one value"
args = ["1", "10", "5"]

[[case]]
name = "a negative INCREMENT counts down"
args = ["5", "-2", "1"]

[[case]]
name = "a negative FIRST needs no -- to be an operand"
args = ["-3", "3"]

[[case]]
name = "a negative FIRST with a negative INCREMENT"
args = ["-1", "-1", "-5"]

[[case]]
name = "counting down to a negative LAST"
