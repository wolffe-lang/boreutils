# ------------------------- what GNU's long double does and boreutils does not

[[case]]
name = "huge integers GNU cannot separate"
args = ["-100000000000000000002", "-100000000000000000000"]
skip = "GNU's arbitrary-precision path does not take this one, so it walks in long double, where x + 1 == x: coreutils 9.11 prints -100000000000000000000 forever on BOTH hosts. boreutils computes in exact decimal and prints the three values asked for, then stops. Recorded, not imitated: a case here would hang the harness."

[[case]]
name = "a huge FIRST with a fractional INCREMENT"
args = ["100000000000000000000", "0.5", "100000000000000000002"]
skip = "Same shape as the case above: GNU prints 100000000000000000000.0 forever on both hosts because the increment is below the long double ulp there. boreutils prints the five exact values and stops."

[[case]]
name = "an explicit -f precision coarser than the exact value"
args = ["-f", "%.1f", "0.05", "0.1", "0.35"]
skip = "GNU rounds its long double, whose 0.05 is a shade above one twentieth, and prints 0.1 0.2 0.2. The exact value is a tie, and round-half-to-even prints 0.0 0.2 0.2 0.4 — the fourth value is there because 0.35 is exactly reachable in decimal and not in long double. The DEFAULT format cannot reach this, because its precision is never coarser than the values it prints."

[[case]]
name = "-f %a, the one conversion boreutils does not implement"
args = ["-f", "%a", "1", "2"]
skip = "The hexadecimal float conversion is the C library's, and the two hosts' libraries disagree at the same coreutils 9.11: Apple's prints 0x1p+0 0x1p+1 and glibc prints 0x8p-3 0x8p-2. No answer matches both, so seq refuses %a with GNU's own unknown-directive wording and the divergence is recorded here."

[[case]]
name = "a value too large for a long double to hold exactly"
args = ["1e30", "1e30", "3e30"]
skip = "The two hosts do not agree with each other here, let alone with an exact answer: macOS prints 1000000000000000019884624838656 (its long double is a double) and linux prints 1000000000000000000024696061952 (x87 extended), and macOS stops one value earlier. boreutils prints 1e30, 2e30 and 3e30 exactly."

[[case]]
name = "an exponent too large for a long double"
args = ["1", "1", "1e400"]
skip = "Another C library difference at one coreutils release: macOS refuses '1e400' as an invalid floating point argument and linux reads it as an infinity and never stops. boreutils reads the exponent exactly and treats it as the finite number it is."
