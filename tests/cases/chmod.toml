scratch = { "d/f" = "x\n", "e/x" = "y\n" }
scratch_dirs = ["d/s", "e/sub"]
scratch_links = { "d/l" = "../e", "ld" = "e", "lf" = "d/f", "d/dang" = "nowhere" }

