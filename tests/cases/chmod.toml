# chmod — GNU coreutils 9.11, black-box, on linux x86-64 and macOS arm64.
# Written by notes/bu22/gen/chmod_cases.py; this file is the record.
#
# chmod changes the file system, so every case runs in a scratch
# directory (tools/difftest), and what each side leaves is compared:
# `files` (names, kinds, bytes) and `tree` (modes, link counts).

# Usage: what is missing, what is not an option.
[[case]]
name = "no operand"
args = []

[[case]]
name = "a mode and no file"
args = ["755"]

[[case]]
name = "a symbolic mode and no file"
args = ["u+x"]

[[case]]
name = "an option mode and no file"
args = ["-x"]

[[case]]
name = "-R alone"
args = ["-R"]

[[case]]
name = "only --"
args = ["--"]

[[case]]
name = "an invalid option"
args = ["-Q", "7", "f"]
scratch = { "f" = "x\n" }

[[case]]
name = "an unrecognized long option"
args = ["--bogus", "7", "f"]
scratch = { "f" = "x\n" }

[[case]]
name = "--mode is not an option of chmod"
args = ["--mode=644", "f"]
scratch = { "f" = "x\n" }

[[case]]
name = "--help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "--version"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "--reference with a mode"
args = ["--reference=f", "-w", "f"]
scratch = { "f" = "x\n" }

[[case]]
name = "--reference and no file"
args = ["--reference=f"]
scratch = { "f" = "x\n" }

[[case]]
name = "--reference to nothing"
args = ["-v", "--reference=nope", "f"]
scratch = { "f" = "x\n" }

[[case]]
name = "--reference copies"
args = ["--reference=d", "f"]
scratch = { "f" = "x\n" }
scratch_dirs = ["d"]
scratch_modes = { "d" = 0o751 }

[[case]]
name = "--reference as two words"
args = ["--reference", "d", "f"]
scratch = { "f" = "x\n" }
scratch_dirs = ["d"]
scratch_modes = { "d" = 0o700 }

[[case]]
name = "--ref abbreviates"
args = ["--ref=d", "f"]
scratch = { "f" = "x\n" }
scratch_dirs = ["d"]
scratch_modes = { "d" = 0o711 }

[[case]]
name = "--reference: the next word is a file"
args = ["--reference=f", "700", "d"]
scratch = { "f" = "x\n" }
scratch_dirs = ["d"]

[[case]]
name = "--reference with set-id bits"
args = ["--reference=s", "f"]
scratch = { "f" = "x\n", "s" = "y\n" }
scratch_modes = { "s" = 0o6750 }

