scratch_links = { "c/sub/up" = ".." }

[[case]]
name = "walk: an empty directory"
args = ["-vR", "700", "z"]
scratch_dirs = ["z"]

[[case]]
name = "walk: a file"
args = ["-vR", "700", "f"]
scratch = { "f" = "x\n" }
