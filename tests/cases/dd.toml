# Summary time/rate are measured by shape; record counters remain byte-exact.

[[case]]
name = "stdin []"
args = ["status=noxfer"]
stdin = "aBcD eF\nxy\nlast"

[[case]]
name = "stdin ['bs=2']"
args = ["bs=2", "status=noxfer"]
stdin = "aBcD eF\nxy\nlast"

[[case]]
name = "stdin ['ibs=2', 'obs=3']"
args = ["ibs=2", "obs=3", "status=noxfer"]
stdin = "aBcD eF\nxy\nlast"

[[case]]
name = "stdin ['count=0']"
args = ["count=0", "status=noxfer"]
stdin = "aBcD eF\nxy\nlast"

[[case]]
