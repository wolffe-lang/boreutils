# stat — GNU coreutils 9.11, black-box, on linux x86-64 and macOS arm64
# (bu20, wolf 0.2.27: s218's twenty-word record).
#
# Every case stands in a scratch tree. A status-change time, a birth
# time, an inode and a device number cannot be given to a tree, so the
# cases that print one keep ONE tree for both sides (`scratch_keep`).
# A case that prints an owner's NAME is `accounts` (a skip on a host
# whose accounts are not in /etc/passwd), and has a numeric twin.
#
# What this stat cannot match is named, never imitated:
#   wolf-lang#684  no I/O block size: %o and the default format's
#                  `IO Block:` print `?`. The default and terse cases
#                  compare every other byte through a `mask` on that
#                  one field.
#   wolf-lang#686  no file-system record: -f is refused (skips)
#   wolf-lang#536  no record of an open handle: `-` is refused (skips)
#   wolf-lang#685  no extended attribute: %C is refused (skip)
# The help and version TEXT is ours, so those compare the exit only.


[tree.kinds]
cwd = "t"
scratch_dirs = ["t", "t/dir", "t/dir/sub", "t/tdir"]
scratch = { "t/a" = "12345", "t/bb" = "x", "t/exe" = "#!/bin/sh\n", "t/empty" = "", "t/.hidden" = "hh", "t/dir/inner" = "i", "t/suid" = "s", "t/sgid" = "g", "t/with space" = "ab", "t/new\nline" = "n" }
scratch_sizes = { "t/big" = 5000, "t/huge" = 123456789012 }
scratch_fifos = ["t/fifo"]
scratch_sockets = ["t/sock"]
scratch_links = { "t/link" = "a", "t/dlink" = "dir", "t/dangle" = "nope", "t/splink" = "with space", "t/nllink" = "new\nline" }
scratch_hardlinks = { "t/hard" = "t/a" }
scratch_modes = { "t/exe" = 0o755, "t/suid" = 0o4755, "t/sgid" = 0o2755, "t/tdir" = 0o1777, "t/bb" = 0o600, "t/dir" = 0o750 }
scratch_time_all = 1600000000
scratch_times = { "t/bb" = 1500000000, "t/big" = 1700000000, "t/dir" = 1650000000, "t/link" = 1550000000, "t/huge" = -1 }
scratch_atimes = { "t/bb" = 1500000123, "t/big" = 1700000456 }


# Instants before the epoch and far away, inside what ext4 holds
# (1901..2446).
[tree.instants]
cwd = "t"
scratch_dirs = ["t"]
scratch = { "t/y1902" = "", "t/y1969" = "", "t/y2020s" = "", "t/y2023w" = "", "t/y2100" = "", "t/y2400" = "" }
scratch_time_all = 1600000000
scratch_times = { "t/y1902" = -2145916800, "t/y1969" = -1, "t/y2020s" = 1600000000, "t/y2023w" = 1700000000, "t/y2100" = 4102444800, "t/y2400" = 13569465600 }

# --- the default format, every kind (one tree for both sides)
[[case]]
name = "a regular file"
tree = "kinds"
args = ["a"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "an empty file"
tree = "kinds"
args = ["empty"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "a directory"
tree = "kinds"
args = ["dir"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "a sticky directory"
tree = "kinds"
args = ["tdir"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "a link is itself"
