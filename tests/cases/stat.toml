args = ["with space"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "a name with a newline is printed as it is"
tree = "kinds"
args = ["new\nline"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "a link to a name with a space"
tree = "kinds"
args = ["splink"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "a file with two names"
tree = "kinds"
args = ["a", "hard"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "several operands"
