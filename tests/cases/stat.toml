[[case]]
name = "device numbers of /dev/zero"
args = ["-c", "%t,%T %Hr,%Lr", "/dev/zero"]
requires = "/dev/zero"

[[case]]
name = "device numbers of a block device (nvme)"
args = ["-c", "%t %T %r %R %Hr %Lr %F", "/dev/nvme0n1"]
requires = "/dev/nvme0n1"

[[case]]
name = "device numbers of a block device (scsi)"
args = ["-c", "%t %T %r %R %Hr %Lr %F", "/dev/sda"]
requires = "/dev/sda"

[[case]]
name = "device numbers of a block device (loop)"
args = ["-c", "%t %T %r %R %Hr %Lr %F", "/dev/loop0"]
requires = "/dev/loop0"

[[case]]
name = "a mac's block device"
args = ["-c", "%t %T %r %R %Hr %Lr %F", "/dev/disk0"]
requires = "/dev/disk0"

[[case]]
name = "%U %G of root's files"
args = ["-c", "%U %G %u %g", "/"]

# --- flags, width and precision
[[case]]
name = "a width on a number"
tree = "kinds"
args = ["-c", "[%10s] [%-10s] [%010s] [%1s]", "big"]

[[case]]
name = "+ and space do nothing to a number"
tree = "kinds"
args = ["-c", "[%+5s] [% 5s] [%+s]", "big"]

[[case]]
name = "a precision is the least digits"
tree = "kinds"
args = ["-c", "[%.3s] [%.6s] [%10.6s] [%-10.6s|]", "big"]

[[case]]
name = "- beats 0"
tree = "kinds"
args = ["-c", "[%-08s|]", "big"]

[[case]]
name = "the quote flag is accepted"
tree = "kinds"
args = ["-c", "[%'s]", "big"]

[[case]]
name = "# on octal and hex"
tree = "kinds"
