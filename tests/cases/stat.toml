tree = "kinds"
args = ["--printf", "%s\\n", "a"]

# --- which format wins
[[case]]
name = "--printf after -c"
tree = "kinds"
args = ["-c", "%n", "--printf=%s\\n", "a"]

[[case]]
name = "-c after --printf"
tree = "kinds"
args = ["--printf=%s\\n", "-c", "%n", "a"]

[[case]]
name = "--format twice: the last"
tree = "kinds"
args = ["--format=%s", "--format=%n", "a"]

[[case]]
name = "-c beats -t before it"
tree = "kinds"
args = ["-t", "-c", "%n", "a"]

[[case]]
name = "-c beats -t after it"
tree = "kinds"
args = ["-c", "%n", "-t", "a"]

[[case]]
name = "--cached is accepted"
tree = "kinds"
args = ["--cached=never", "-c", "%n", "a"]

[[case]]
name = "--cached=always"
tree = "kinds"
args = ["--cached=always", "-c", "%n", "a"]

[[case]]
name = "--cached=def abbreviates"
tree = "kinds"
args = ["--cached=def", "-c", "%n", "a"]

[[case]]
name = "--cached=bogus is refused"
tree = "kinds"
args = ["--cached=bogus", "a"]

# --- what cannot be reached, and usage
[[case]]
name = "a missing file, and the next still prints"
tree = "kinds"
args = ["-c", "%n", "nope", "a"]

[[case]]
name = "an empty operand"
tree = "kinds"
args = ["-c", "%n", ""]

[[case]]
name = "an operand under a file"
tree = "kinds"
args = ["-c", "%n", "a/b"]

[[case]]
name = "only missing files"
tree = "kinds"
args = ["nope", "nada"]

[[case]]
name = "a name that starts with a dash, after --"
tree = "kinds"
args = ["-c", "%s %n", "--", "-x", "a"]

[[case]]
name = "no operand"
args = []

[[case]]
name = "no operand after a format"
args = ["-c", "%n"]

[[case]]
name = "-c needs an argument"
args = ["-c"]

[[case]]
name = "--format needs an argument"
args = ["--format"]

[[case]]
name = "--format with only its argument has no operand"
tree = "kinds"
args = ["--format", "a"]

[[case]]
name = "an unknown option"
args = ["-x"]

[[case]]
name = "an unknown long option"
args = ["--nope"]

[[case]]
name = "--help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "--version"
args = ["--version"]
compare = ["exit"]

# --- the time zone
[[case]]
name = "%y in TZ=UTC0"
tree = "instants"
args = ["-c", "%y %n", "y1902", "y1969", "y2020s", "y2023w", "y2100", "y2400"]
env = { "TZ" = "UTC0" }

[[case]]
name = "%y in TZ=America/New_York"
tree = "instants"
args = ["-c", "%y %n", "y1902", "y1969", "y2020s", "y2023w", "y2100", "y2400"]
env = { "TZ" = "America/New_York" }
requires = "/usr/share/zoneinfo/America/New_York"

[[case]]
name = "%y in TZ=Asia/Kolkata"
tree = "instants"
args = ["-c", "%y %n", "y1902", "y1969", "y2020s", "y2023w", "y2100", "y2400"]
env = { "TZ" = "Asia/Kolkata" }
requires = "/usr/share/zoneinfo/Asia/Kolkata"

[[case]]
name = "%y in TZ=Australia/Lord_Howe"
tree = "instants"
args = ["-c", "%y %n", "y1902", "y1969", "y2020s", "y2023w", "y2100", "y2400"]
env = { "TZ" = "Australia/Lord_Howe" }
requires = "/usr/share/zoneinfo/Australia/Lord_Howe"

[[case]]
name = "%y in TZ=Europe/Dublin"
tree = "instants"
args = ["-c", "%y %n", "y1902", "y1969", "y2020s", "y2023w", "y2100", "y2400"]
env = { "TZ" = "Europe/Dublin" }
requires = "/usr/share/zoneinfo/Europe/Dublin"

[[case]]
name = "%y under a rule"
tree = "instants"
args = ["-c", "%y", "y1969", "y2020s", "y2023w"]
env = { "TZ" = "CET-1CEST,M3.5.0,M10.5.0/3" }

[[case]]
name = "%Y does not move with the zone"
tree = "instants"
args = ["-c", "%Y", "y1969", "y2020s"]
env = { "TZ" = "Asia/Tokyo" }

# --- refused by name: what wolf cannot read yet
[[case]]
name = "-f: a file system's status"
args = ["-f", "."]
skip = "no file-system record in wolf 0.2.27 (statfs, wolf-lang#686): refused by name, status 1"

[[case]]
name = "-f with a format"
args = ["-f", "-c", "%T", "."]
skip = "no file-system record in wolf 0.2.27 (statfs, wolf-lang#686): refused by name, status 1"

[[case]]
name = "-: standard input"
args = ["-c", "%F", "-"]
skip = "the record of an open handle is fs_fstat's three words (wolf-lang#536): refused by name, status 1"

[[case]]
name = "%C: the security context"
args = ["-c", "%C", "."]
skip = "a security context is an extended attribute, which wolf cannot read (wolf-lang#685): refused by name, status 1"

[[case]]
name = "%o: the I/O block size"
args = ["-c", "%o", "."]
skip = "the record has no I/O block size (wolf-lang#684): prints ? where GNU prints a number"

