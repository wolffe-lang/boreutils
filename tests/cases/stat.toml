[[case]]
name = "the ids in widths"
tree = "kinds"
args = ["-c", "[%5u] [%05u] [%-5g|] [%.6u]", "big"]

[[case]]
name = "a time string is a string"
tree = "kinds"
args = ["-c", "[%y] [%.3y] [%.0y] [%.10y] [%40y] [%-40y|]", "a"]

[[case]]
name = "a time in seconds takes a precision"
tree = "kinds"
args = ["-c", "[%Y] [%.3Y] [%.0Y] [%.9Y] [%.12Y]", "a"]

[[case]]
name = "a time in seconds in a width"
tree = "kinds"
args = ["-c", "[%20.3Y] [%-20.3Y|] [%020.3Y] [%015Y] [%-15Y|]", "a"]

[[case]]
name = "+ and space on a time in seconds"
tree = "kinds"
args = ["-c", "[%+Y] [% Y] [%+.2Y]", "a"]

[[case]]
name = "the access time, which differs"
tree = "kinds"
args = ["-c", "[%X] [%.3X] [%x]", "bb", "big"]

[[case]]
name = "a time before the epoch"
tree = "kinds"
args = ["-c", "[%Y] [%.3Y] [%.2Y] [%y]", "huge"]

[[case]]
name = "+ on a time before the epoch"
tree = "kinds"
args = ["-c", "[%+Y] [% Y] [%010Y]", "huge"]

[[case]]
name = "%N with a width is not quoted"
tree = "kinds"
args = ["-c", "[%.3N] [%12N] [%-12N|]", "a"]

[[case]]
name = "%N of a link with a width lays each part"
tree = "kinds"
args = ["-c", "[%12N] [%-12N|] [%.2N]", "link"]

[[case]]
name = "%Hd in widths"
