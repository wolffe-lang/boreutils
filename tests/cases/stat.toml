# --- what is not a directive
[[case]]
name = "an unknown letter is ?"
tree = "kinds"
args = ["-c", "%q", "a"]

[[case]]
name = "an unknown letter after flags is ?"
tree = "kinds"
args = ["-c", "[%5q] [%.2q] [%-q]", "a"]

[[case]]
name = "a % that ends the format is itself"
tree = "kinds"
args = ["-c", "a%", "a"]

[[case]]
name = "% alone"
tree = "kinds"
args = ["-c", "%", "a"]

[[case]]
name = "%% is a percent sign"
tree = "kinds"
args = ["-c", "%%%n%%", "a"]

[[case]]
name = "a width before % is invalid, after what was printed"
tree = "kinds"
args = ["-c", "x%%y %5% z", "a"]

[[case]]
name = "- before % is invalid"
tree = "kinds"
