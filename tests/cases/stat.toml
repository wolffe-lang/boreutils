args = ["a", "dir", "link", "fifo"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "the working directory"
tree = "kinds"
args = ["."]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "-L follows a link"
tree = "kinds"
args = ["-L", "link"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "-L follows a link to a directory"
tree = "kinds"
args = ["-L", "dlink"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "--dereference"
tree = "kinds"
args = ["--dereference", "link"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "-L of a file that is no link"
tree = "kinds"
args = ["-L", "a"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "-L cannot follow a dangling link"
tree = "kinds"
args = ["-L", "dangle"]

[[case]]
name = "-L of a dangling link beside a file"
tree = "kinds"
args = ["-L", "dangle", "a"]
scratch_keep = true
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "a character device"
args = ["/dev/null"]
requires = "/dev/null"
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "a block device (nvme)"
args = ["/dev/nvme0n1"]
requires = "/dev/nvme0n1"
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "a block device (scsi)"
args = ["/dev/sda"]
requires = "/dev/sda"
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "a block device (loop)"
args = ["/dev/loop0"]
requires = "/dev/loop0"
accounts = true
mask = ["IO Block: [0-9?]+ +"]

[[case]]
name = "the root directory"
args = ["/"]
accounts = true
mask = ["IO Block: [0-9?]+ +"]

# --- the terse format
[[case]]
name = "-t of a file"
tree = "kinds"
args = ["-t", "a"]
scratch_keep = true
mask = ["(?m) [0-9?]+$"]

[[case]]
name = "-t of every kind"
tree = "kinds"
args = ["-t", "a", "dir", "link", "dangle", "fifo", "sock", "suid", "empty"]
scratch_keep = true
mask = ["(?m) [0-9?]+$"]

[[case]]
name = "-t with -L"
tree = "kinds"
args = ["-tL", "link", "dlink"]
scratch_keep = true
mask = ["(?m) [0-9?]+$"]

[[case]]
name = "--terse"
tree = "kinds"
args = ["--terse", "big"]
scratch_keep = true
mask = ["(?m) [0-9?]+$"]

[[case]]
name = "-t of a name with a space"
tree = "kinds"
args = ["-t", "with space"]
scratch_keep = true
mask = ["(?m) [0-9?]+$"]

[[case]]
name = "-t of a character device"
args = ["-t", "/dev/null"]
requires = "/dev/null"
mask = ["(?m) [0-9?]+$"]

# --- the directives, one family at a time
[[case]]
name = "%a %A: the mode"
tree = "kinds"
args = ["-c", "%a %A %n", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]

[[case]]
name = "%f: the raw mode in hex"
tree = "kinds"
args = ["-c", "%f %n", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]

[[case]]
name = "%F: the type in words"
tree = "kinds"
args = ["-c", "%F|%n", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]

[[case]]
name = "%s %b %B: size and blocks"
tree = "kinds"
args = ["-c", "%s %b %B %n", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]

[[case]]
name = "%h: links"
tree = "kinds"
args = ["-c", "%h %n", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]

[[case]]
name = "%u %g: the ids"
tree = "kinds"
args = ["-c", "%u %g", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]

[[case]]
name = "%U %G: the names"
tree = "kinds"
args = ["-c", "%U %G", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]
accounts = true

[[case]]
name = "%i: the inode"
tree = "kinds"
args = ["-c", "%i %n", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]
scratch_keep = true

[[case]]
name = "%d %D %Hd %Ld: the device"
tree = "kinds"
args = ["-c", "%d %D %Hd %Ld", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]
scratch_keep = true

[[case]]
name = "%r %R %t %T %Hr %Lr of files that are no device"
tree = "kinds"
args = ["-c", "%r %R %t %T %Hr %Lr", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]

[[case]]
name = "%n and %N"
tree = "kinds"
args = ["-c", "%n|%N", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]

[[case]]
name = "%x %y: access and modification"
tree = "kinds"
args = ["-c", "%x|%y", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]

[[case]]
name = "%X %Y: the same in seconds"
tree = "kinds"
args = ["-c", "%X %Y", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]

[[case]]
name = "%z %Z: status change"
tree = "kinds"
args = ["-c", "%z|%Z", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]
scratch_keep = true

[[case]]
name = "%w %W: birth"
tree = "kinds"
args = ["-c", "%w|%W", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]
scratch_keep = true

[[case]]
name = "%m: the mount point"
tree = "kinds"
args = ["-c", "%m", "a", "dir", "tdir", "link", "dangle", "fifo", "sock", "suid", "sgid", "exe", "bb", "empty", "big"]

[[case]]
name = "%N of names a shell would have to quote"
tree = "kinds"
args = ["-c", "%N", "with space", "new\nline", "splink", "nllink"]

[[case]]
name = "%N under -L has no arrow"
tree = "kinds"
args = ["-L", "-c", "%N %F", "link", "dlink"]

[[case]]
name = "%m under -L"
tree = "kinds"
args = ["-L", "-c", "%m", "link", "dlink"]

[[case]]
name = "%m of the root directory"
args = ["-c", "%m", "/"]

[[case]]
name = "device numbers of a character device"
args = ["-c", "%t %T %r %R %Hr %Lr %F %a %A", "/dev/null"]
