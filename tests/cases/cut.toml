gnu_min = "9.11"

[[case]]
name = "only-delimited without fields"
args = ["-s", "-b1", "tests/fixtures/fields.txt"]

[[case]]
name = "a missing operand"
args = ["-f1", "tests/fixtures/nope.txt"]

[[case]]
name = "a missing operand between two that exist"
args = ["-b1", "tests/fixtures/plain.txt", "tests/fixtures/nope.txt", "tests/fixtures/second.txt"]

[[case]]
name = "a directory operand"
args = ["-f1", "tests/fixtures"]

[[case]]
name = "an empty operand name"
args = ["-b1", ""]

[[case]]
name = "a name that has to be quoted"
args = ["-b1", "tests/fixtures/no such file"]

[[case]]
name = "a name holding a tab"
args = ["-b1", "tests/fixtures/ta\tb"]

[[case]]
name = "an unknown option"
args = ["-Q", "tests/fixtures/fields.txt"]

[[case]]
name = "an unknown long option"
args = ["--nope", "tests/fixtures/fields.txt"]

# ------------------------------------------------------------------- -z

[[case]]
name = "z on NUL records"
args = ["-z", "-b1", "tests/fixtures/nulrec.dat"]

[[case]]
name = "z on text, which holds no NUL at all"
args = ["-z", "-b1", "tests/fixtures/fields.txt"]

[[case]]
name = "z with fields"
