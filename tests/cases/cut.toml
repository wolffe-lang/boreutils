# ------------------------------------------------------------ the errors

[[case]]
name = "no list at all"
args = ["tests/fixtures/fields.txt"]

[[case]]
name = "two lists of different kinds"
args = ["-b1", "-f1", "tests/fixtures/fields.txt"]

[[case]]
name = "two lists of the same kind"
args = ["-c1", "-c3", "tests/fixtures/fields.txt"]

[[case]]
name = "two byte lists"
args = ["-b1-2", "-b4", "tests/fixtures/fields.txt"]

[[case]]
