# GNU coreutils 9.11 black-box cases; bu30. No implementation source.

[[case]]
name = "help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "version"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "bad option"
args = ["--not-an-option"]

[[case]]
name = "closed help"
args = ["--help"]
stdout_closed = true

[[case]]
name = "no options"
args = []

[[case]]
name = "missing file"
args = ["-s", "5"]

[[case]]
name = "missing size"
args = ["f"]

[[case]]
name = "new empty file"
args = ["-s", "0", "f"]

[[case]]
name = "new sparse file"
args = ["-s", "128", "f"]

[[case]]
name = "shorten"
args = ["-s", "2", "f"]
scratch = { "f" = "abcdef" }

[[case]]
name = "extend"
args = ["-s", "12", "f"]
scratch = { "f" = "abc" }

[[case]]
name = "no create"
args = ["-c", "-s", "10", "absent"]

[[case]]
name = "no create existing"
args = ["-c", "-s", "2", "f"]
scratch = { "f" = "abcdef" }

[[case]]
name = "reference"
args = ["-r", "ref", "f"]
scratch = { "ref" = "abcd", "f" = "abcdefgh" }

[[case]]
name = "missing reference"
args = ["-r", "missing", "f"]

[[case]]
name = "reference with absolute size"
args = ["-r", "ref", "-s", "2", "f"]
scratch = { "ref" = "abcd" }

[[case]]
name = "directory"
args = ["-s", "2", "d"]
scratch_dirs = ["d"]

[[case]]
name = "follow link"
args = ["-s", "2", "l"]
scratch = { "f" = "abcdef" }
scratch_links = { "l" = "f" }

[[case]]
name = "continue after error"
args = ["-s", "2", "no/parent", "f"]

[[case]]
name = "io blocks refused"
args = ["-o", "-s", "1", "f"]
skip = "R-bu30-1: no stat st_blksize word; named refusal tested by smalltest"

