# A closed standard output (`tail … >&-`). GNU coreutils 9.11 on both
# hosts: ONE `tail: write error: Bad file descriptor` after every
# operand has been tried, and status 1. An operand that could not be
# opened is reported FIRST, and an operand that is the only one and
# cannot be opened writes nothing, so it earns no write error at all.
# `tail` is not `cat`: it does not check standard output before it
# starts, so the message is `write error`, never `standard output`.

[[case]]
name = "standard output closed"
args = ["-n", "1", "tests/fixtures/plain.txt"]
stdout_closed = true

[[case]]
name = "standard output closed, two operands, one message"
args = ["-n", "1", "tests/fixtures/plain.txt", "tests/fixtures/second.txt"]
stdout_closed = true

[[case]]
name = "standard output closed, nothing was written"
args = ["-n", "1", "tests/fixtures/nope.txt"]
stdout_closed = true

[[case]]
name = "standard output closed, the open error comes first"
args = ["-n", "1", "tests/fixtures/plain.txt", "tests/fixtures/nope.txt"]
stdout_closed = true

[[case]]
name = "standard output closed, version"
args = ["--version"]
stdout_closed = true

[[case]]
name = "standard output closed, a usage error comes first"
args = ["-Q", "tests/fixtures/plain.txt"]
stdout_closed = true

[[case]]
name = "a write error on a live descriptor"
args = ["-n", "1", "tests/fixtures/plain.txt"]
stdout_file = "/dev/full"
compare = ["exit"]

# ------------------------------------------------------------- the seek
#
# bu15: a regular file whose end can be trusted is read BACKWARDS from
# that end (wolf 0.2.22's positional read), 8 KiB at a time, as GNU does.
# `blocks.txt` is 28,214 bytes built so that BOTH bytes beside the last
# 8 KiB boundary are newlines (end-8193 and end-8192): `-n 311` starts
# just past the second, `-n 312` just past the first (an empty line),
# and `-n 313` inside the block before. `longline.txt` ends on a line
# longer than two blocks. Each shape is run on the file, on standard
# input that IS the file, and on that standard input with its offset
# already moved (`stdin_offset`, which also compares where tail LEFT
# the offset: GNU leaves it at the end).

[[case]]
name = "seek: n 1 across the block boundary"
args = ["-n", "1", "tests/fixtures/blocks.txt"]

[[case]]
name = "seek: n 10 across the block boundary"
