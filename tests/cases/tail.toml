# B73, RESOLVED: this was a skip, because Arch's 9.11 read `tail +3 f` as
# from-line-3 and Homebrew's 9.11 read `+3` as a file name — the same
# release, two builds, and `difftest` bounds a case by VERSION. It is an
# ordinary case now. `gnu-oracle.toml`'s `[oracle.env]` pins
# `_POSIX2_VERSION=200112`, which takes gnulib's `posix2_version()` off
# the build-time default, so every build answers the POSIX reading that
# boreutils implements; `[oracle.probe]` asserts the pin took before any
# case runs. `+NUM` is in neither POSIX.1-2024 nor GNU's --help.
[[case]]
name = "a leading plus is an operand, not the old from-line-K form"
args = ["+3", "tests/fixtures/twelve.txt"]

