# tail — GNU coreutils 9.11, black-box. Every expectation here was read
# off the GNU binary on BOTH hosts (macOS arm64 Homebrew `gtail`, linux
# x86-64 native `tail`), which agreed on every case in this file.
#
# The fixtures are the ones head.toml lists.
#
# `-f` is IMPLEMENTED and is almost untestable here: following a regular
# file never returns, so a differential case would be a timeout rather
# than a comparison. Two cases below do test the parts that terminate —
# `-f` on a pipe, which GNU ends at end of input, and the warnings
# `--retry` and `--pid` print when nothing is being followed — and the
# lane report carries the hand-run transcript of a live follow.
#
# --help and --version print OUR text, not GNU's FSF-owned prose, so
# their cases compare the exit status and stderr only.

