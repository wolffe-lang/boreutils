[[case]]
name = "seek: z 2 walks back by NUL"
args = ["-z", "-n", "2", "tests/fixtures/nulrec.dat"]

[[case]]
name = "seek: offset past the end writes nothing and stays"
args = ["-n", "2"]
stdin_file = "twelve.txt"
stdin_offset = 100

[[case]]
name = "seek: n 0 leaves the offset alone"
args = ["-n", "0"]
stdin_file = "twelve.txt"
stdin_offset = 5

[[case]]
name = "seek: c 0 leaves the offset alone"
args = ["-c", "0"]
stdin_file = "twelve.txt"
stdin_offset = 5

[[case]]
name = "seek: n 100 from an offset mid-line"
args = ["-n", "100"]
stdin_file = "twelve.txt"
stdin_offset = 3

[[case]]
name = "seek: plus n reads forward from the offset"
args = ["-n", "+2"]
stdin_file = "twelve.txt"
stdin_offset = 3

[[case]]
name = "seek: plus c skips from the offset"
args = ["-c", "+2"]
stdin_file = "twelve.txt"
stdin_offset = 3

[[case]]
name = "seek: plus c past the end moves the offset past it"
args = ["-c", "+2"]
stdin_file = "empty.txt"
stdin_offset = 0

[[case]]
name = "seek: plus c far past the end"
args = ["-c", "+100"]
stdin_file = "twelve.txt"
stdin_offset = 7

[[case]]
name = "seek: two files, one long"
args = ["-n", "3", "tests/fixtures/twelve.txt", "tests/fixtures/blocks.txt"]

[[case]]
name = "seek: a file and standard input at an offset"
args = ["-n", "2", "tests/fixtures/twelve.txt", "-"]
stdin_file = "blocks.txt"
stdin_offset = 28000


# A file whose fstat size is not its length: GNU reads these forward,
# and so must the seek path (bu15 measured trunk writing 0 bytes of the
# first for `-c 20` and all 144 of the second). linux only.

[[case]]
name = "seek: -c 20 of /sys/devices/system/cpu/online, whose size lies"
args = ["-c", "20", "/sys/devices/system/cpu/online"]
requires = "/sys/devices/system/cpu/online"

[[case]]
name = "seek: -c 20 of /proc/version, whose size lies"
args = ["-c", "20", "/proc/version"]
requires = "/proc/version"

[[case]]
name = "seek: -n 1 of /sys/devices/system/cpu/online, whose size lies"
args = ["-n", "1", "/sys/devices/system/cpu/online"]
requires = "/sys/devices/system/cpu/online"

[[case]]
name = "seek: -n 1 of /proc/version, whose size lies"
args = ["-n", "1", "/proc/version"]
requires = "/proc/version"

[[case]]
name = "seek: -c +5 of /sys/devices/system/cpu/online, whose size lies"
args = ["-c", "+5", "/sys/devices/system/cpu/online"]
requires = "/sys/devices/system/cpu/online"

[[case]]
name = "seek: -c +5 of /proc/version, whose size lies"
args = ["-c", "+5", "/proc/version"]
requires = "/proc/version"

[[case]]
name = "seek: c 20 of standard input whose size lies"
args = ["-c", "20"]
stdin_file = "/proc/version"
requires = "/proc/version"
