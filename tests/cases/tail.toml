# --follow[=WORD] is an OPTIONAL-argument option (boreutils#8): a word
# is taken only when it is attached with `=`, it is matched as GNU's
# argmatch matches (exact, or a unique prefix; the empty word is
# ambiguous), and the last of -f, -F and --follow[=WORD] decides HOW to
# follow. Following by name is refused for standard input before a byte
# is read. Every case here terminates: a pipe ends the follow, and each
# refusal is immediate. The timeout is what a regression would hit.

[[case]]
name = "follow with a word that is not one"
args = ["--follow=bogus", "tests/fixtures/twelve.txt"]
timeout = 5

[[case]]
name = "follow with an empty word is ambiguous"
args = ["--follow=", "tests/fixtures/twelve.txt"]
timeout = 5

[[case]]
name = "follow abbreviated, with a word that is not one"
args = ["--fo=bogus", "tests/fixtures/twelve.txt"]
timeout = 5

[[case]]
name = "follow's word is case-sensitive"
args = ["--follow=Name", "tests/fixtures/twelve.txt"]
timeout = 5

[[case]]
name = "follow by name refuses standard input"
stdin = "a\nb\n"
args = ["--follow=name"]
timeout = 5

[[case]]
name = "follow by name refuses a dash among files"
stdin = "a\nb\n"
args = ["--follow=name", "-n", "1", "tests/fixtures/twelve.txt", "-"]
timeout = 5

[[case]]
name = "F refuses standard input"
stdin = "a\nb\n"
args = ["-F"]
timeout = 5

[[case]]
