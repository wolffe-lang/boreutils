# GNU coreutils 9.11 black-box cases; bu30. No implementation source.

[[case]]
name = "help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "version"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "bad option"
args = ["--not-an-option"]

[[case]]
name = "closed help"
args = ["--help"]
stdout_closed = true

[[case]]
name = "too few Xs"
args = ["xXX"]
scratch = {  }

[[case]]
name = "empty template"
args = [""]
scratch = {  }

[[case]]
name = "two templates"
args = ["aXXX", "bXXX"]
scratch = {  }

[[case]]
name = "invalid suffix"
args = ["--suffix=a/b", "fXXX"]
scratch = {  }

[[case]]
name = "missing directory"
args = ["-p", "missing", "fXXX"]
scratch = {  }

[[case]]
name = "quiet missing directory"
args = ["-q", "-p", "missing", "fXXX"]
scratch = {  }

[[case]]
name = "template with slash under t"
args = ["-t", "d/fXXX"]
scratch = {  }

[[case]]
