args = ["--no-copy", "a", "new"]
scratch = { "a" = "A\n", "b" = "B\n" }

[[case]]
name = "-Z is accepted"
args = ["-Z", "a", "new"]
scratch = { "a" = "A\n", "b" = "B\n" }

[[case]]
name = "--context is accepted"
args = ["--context", "a", "new"]
scratch = { "a" = "A\n", "b" = "B\n" }

[[case]]
name = "-u: the source is newer"
args = ["-u", "a", "b"]
scratch = { "a" = "A\n", "b" = "B\n" }
scratch_times = { "a" = 2000000000, "b" = 1000000000 }
skip = "-u (--update) is not written yet: refused by name, status 1"

[[case]]
name = "-u: the source is older"
args = ["-u", "a", "b"]
scratch = { "a" = "A\n", "b" = "B\n" }
scratch_times = { "a" = 1000000000, "b" = 2000000000 }
skip = "-u (--update) is not written yet: refused by name, status 1"

[[case]]
name = "--update=none"
args = ["--update=none", "a", "b"]
scratch = { "a" = "A\n", "b" = "B\n" }
skip = "-u (--update) is not written yet: refused by name, status 1"

[[case]]
name = "-b"
args = ["-b", "a", "b"]
scratch = { "a" = "A\n", "b" = "B\n" }
skip = "-b (--backup, -S) is not written yet: refused by name, status 1"

[[case]]
name = "--backup=numbered"
args = ["--backup=numbered", "a", "b"]
scratch = { "a" = "A\n", "b" = "B\n" }
skip = "-b (--backup, -S) is not written yet: refused by name, status 1"

[[case]]
name = "-S"
args = ["-b", "-S", ".bak", "a", "b"]
scratch = { "a" = "A\n", "b" = "B\n" }
skip = "-b (--backup, -S) is not written yet: refused by name, status 1"

[[case]]
name = "--exchange"
args = ["--exchange", "a", "b"]
scratch = { "a" = "A\n", "b" = "B\n" }
skip = "wolf 0.2.27 cannot swap two names (renameat2, wolf-lang#706): refused by name, status 1"

[[case]]
name = "--debug"
args = ["--debug", "a", "new"]
scratch = { "a" = "A\n", "b" = "B\n" }
skip = "--debug is not written yet: refused by name, status 1"

# --- options
[[case]]
name = "-- ends the options"
args = ["--", "-f", "x"]
scratch = { "-f" = "" }

[[case]]
name = "a bad option"
args = ["-x", "a", "b"]
scratch = { "a" = "A\n", "b" = "B\n" }

[[case]]
name = "an unknown long option"
args = ["--bogus", "a", "b"]
scratch = { "a" = "A\n", "b" = "B\n" }

[[case]]
name = "-t with no argument"
args = ["-t"]

[[case]]
name = "--v is ambiguous"
args = ["--v", "a", "b"]
scratch = { "a" = "A\n", "b" = "B\n" }

[[case]]
name = "POSIXLY_CORRECT: the first operand ends the options"
args = ["a", "-v"]
scratch = { "a" = "" }
env = { "POSIXLY_CORRECT" = "1" }

[[case]]
name = "--help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "--version"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "--help wins over a later bad option"
args = ["--help", "--bogus"]
compare = ["exit"]

[[case]]
name = "stdout closed, nothing to write"
args = ["a", "new"]
scratch = { "a" = "A\n", "b" = "B\n" }
stdout_closed = true

[[case]]
name = "stdout closed under -v"
args = ["-v", "a", "new"]
scratch = { "a" = "A\n", "b" = "B\n" }
stdout_closed = true

[[case]]
name = "a file's time and mode survive the move"
args = ["a", "new"]
scratch = { "a" = "A\n", "b" = "B\n" }
scratch_times = { "a" = 1500000000 }
scratch_modes = { "a" = 0o640 }

[[case]]
name = "a tree's times and modes survive the move"
args = ["d", "e"]
scratch = { "d/c" = "c\n", "d/sub/s" = "s\n" }
scratch_time_all = 1400000000
scratch_modes = { "d/c" = 0o600, "d/sub" = 0o750 }
