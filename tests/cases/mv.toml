# mv — GNU coreutils 9.11, black-box, on linux x86-64 and macOS arm64.
# Written by ~/lanes/bu21/gen/mv_cases.py; this file is the record.
#
# mv renames and replaces, so every case runs in a scratch directory the
# harness made and checked (tools/difftest, bu21), and names no path
# outside it. What each side leaves is compared as `files` and `tree`:
# a moved file keeps its bytes, its mode, its link count and its time.
#
# What this mv cannot match is named, never imitated:
#   another file system  refused by name (a copy would lose the mode,
#                        the times, the owner and the links). No case
#                        can stage two file systems; the refusal is a
#                        hand transcript in the lane's note.
#   -u -b -S --debug     not written yet (skips)
#   --exchange           wolf-lang#706 (skip)

# --- operands
