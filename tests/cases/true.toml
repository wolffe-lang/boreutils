# true — GNU coreutils 9.11, black-box. `--help` and `--version` are
# honoured only spelled in full and only as the sole argument; every
# other command line is ignored and the status is 0.
#
# The help and version TEXT is ours, not GNU's (the licence rule), so
# those cases compare the exit status only.

[[case]]
name = "no arguments"

[[case]]
name = "arguments are ignored"
args = ["x", "-y", "--zebra"]

[[case]]
name = "help is the sole argument"
args = ["--help"]
compare = ["exit", "stderr"]

[[case]]
name = "version is the sole argument"
args = ["--version"]
compare = ["exit", "stderr"]

[[case]]
name = "help is not abbreviated"
args = ["--ver"]

[[case]]
name = "help is not honoured beside another argument"
args = ["--help", "x"]

[[case]]
name = "version twice is ignored"
args = ["--version", "--version"]

[[case]]
name = "a lone dash is ignored"
args = ["-"]

[[case]]
name = "end of options is ignored"
args = ["--"]

# A closed standard output (`true >&-`). Measured against GNU coreutils
# 9.11 on both hosts: a program that writes NOTHING never notices, so
# `true >&-` is still 0 — the failure belongs to the write, not to the
# descriptor.

[[case]]
name = "standard output closed, and nothing is written"
stdout_closed = true

[[case]]
name = "standard output closed, arguments still ignored"
args = ["x", "-y"]
stdout_closed = true

[[case]]
name = "standard output closed, version"
args = ["--version"]
stdout_closed = true

[[case]]
name = "standard output closed, help"
args = ["--help"]
stdout_closed = true
