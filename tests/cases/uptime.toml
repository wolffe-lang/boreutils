# GNU 9.11 C-locale utmp records, from Linux utmp(5).

[[case]]
name = "0 []"
args = []
env = { TZ = "UTC0" }
skip_on = { Darwin = "Linux utmp ABI/procfs or /etc/passwd account lookup lacks a macOS surface" }
mask = ["[0-9]{2}:[0-9]{2}:[0-9]{2}", "(?<= up )(?:[0-9]+ days? )? *[0-9]+:[0-9]{2}", "(?<=load average: )[0-9]+[.][0-9]{2}, [0-9]+[.][0-9]{2}, [0-9]+[.][0-9]{2}"]

[[case]]
name = "1 ['--help']"
args = ["--help"]
env = { TZ = "UTC0" }
compare = ["exit"]

[[case]]
name = "2 ['--version']"
args = ["--version"]
env = { TZ = "UTC0" }
compare = ["exit"]

[[case]]
name = "3 ['-Q']"
args = ["-Q"]
env = { TZ = "UTC0" }
skip_on = { Darwin = "Linux utmp ABI/procfs or /etc/passwd account lookup lacks a macOS surface" }

[[case]]
name = "4 ['missingfile']"
args = ["missingfile"]
env = { TZ = "UTC0" }
skip_on = { Darwin = "Linux utmp ABI/procfs or /etc/passwd account lookup lacks a macOS surface" }
mask = ["[0-9]{2}:[0-9]{2}:[0-9]{2}", "(?<= up )(?:[0-9]+ days? )? *[0-9]+:[0-9]{2}", "(?<=load average: )[0-9]+[.][0-9]{2}, [0-9]+[.][0-9]{2}, [0-9]+[.][0-9]{2}"]

[[case]]
name = "5 ['x', 'y']"
args = ["x", "y"]
env = { TZ = "UTC0" }
skip_on = { Darwin = "Linux utmp ABI/procfs or /etc/passwd account lookup lacks a macOS surface" }
