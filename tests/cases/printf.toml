args = ["\\1|\\12|\\101|\\1012|"]

[[case]]
name = "octal with a leading zero counts it"
args = ["\\0123"]

[[case]]
name = "octal past 255 drops the ninth bit"
args = ["\\400|\\777"]

[[case]]
name = "octal stops at 8"
args = ["\\08"]

[[case]]
name = "a NUL"
args = ["a\\0b"]

[[case]]
name = "hex, one and two digits"
args = ["\\x41|\\x4|\\x4142"]

[[case]]
name = "hex with no digit is fatal"
args = ["a\\xg\n"]

[[case]]
name = "hex at the end with no digit"
args = ["\\x"]

[[case]]
name = "\\c stops all output"
args = ["a\\cb"]

[[case]]
name = "\\c stops the reuse too"
args = ["%s\\c\n", "a", "b"]

[[case]]
name = "\\c alone"
args = ["\\c"]

[[case]]
name = "a trailing backslash"
args = ["a\\"]

[[case]]
name = "a lone backslash"
args = ["\\"]

[[case]]
name = "\\u for ASCII"
args = ["\\u0041\\u0024\\u0060\\u0040\\u0023|"]

[[case]]
name = "\\u for a NUL and DEL"
args = ["\\u0000\\u007f|"]

[[case]]
name = "\\u past ASCII in the C locale"
args = ["\\u00e9|\\u009F|\\u00A0|\\uE000|"]

[[case]]
name = "\\U in the C locale"
args = ["\\U0001F600|\\U00000041|\\U0010FFFF|\\U00110000|\\UFFFFFFFF|"]

[[case]]
name = "\\u with too few digits is fatal"
args = ["\\u00e"]

[[case]]
name = "\\U with too few digits is fatal"
args = ["\\U0001F6"]

[[case]]
name = "a high surrogate is fatal"
args = ["\\uD800"]

[[case]]
name = "a low surrogate is fatal"
args = ["\\udfff"]

[[case]]
name = "a surrogate through \\U is fatal"
args = ["\\U0000d800"]

[[case]]
name = "output before a fatal escape is written"
args = ["ab\\u12"]

[[case]]
name = "\\u under UTF-8"
args = ["\\u00e9|\\U0001F600|\\u0041|\\U00110000\n"]
env = { LC_ALL = "C.UTF-8" }

[[case]]
name = "\\u under LANG only"
args = ["\\u00e9\n"]
env = { LC_ALL = "", LANG = "C.UTF-8" }

[[case]]
name = "\\u under LC_CTYPE"
args = ["\\u00e9\n"]
env = { LC_ALL = "", LC_CTYPE = "C.UTF-8" }

# %b: the argument's escapes, octal as \0NNN.

[[case]]
name = "%b interprets escapes"
args = ["%b\n", "a\\nb\\tc"]

[[case]]
name = "%b octal forms"
args = ["%b", "\\1\\12\\0\\01\\012\\0123\\01234\\400\\0400\\8"]

[[case]]
name = "%b \\0 alone"
args = ["%b", "\\0"]

[[case]]
name = "%b \\0 then four digits"
args = ["%b", "\\00041"]

[[case]]
name = "%b quotes and unknowns"
args = ["%b", "\\\"\\'\\?\\q\\e\\a"]

[[case]]
name = "%b \\c stops everything"
args = ["%b-%s\n", "a\\cb", "x", "y", "z"]

[[case]]
name = "%b \\c in the middle of a reuse"
args = ["%s %b %s\n", "a", "b\\c", "c", "d"]

[[case]]
name = "%b \\c alone"
args = ["%b|%b\n", "\\c", "x"]

[[case]]
name = "%b hex"
args = ["%b|", "\\x4", "\\x41g", "\\xG"]

[[case]]
name = "%b hex with no digit is fatal"
args = ["%b\n", "\\x41\\x", "z"]

[[case]]
name = "%b \\u"
args = ["%b\n", "\\u00e9\\u0041"]

[[case]]
name = "%b \\u too short is fatal"
args = ["%b %b\n", "\\u0041\\u00", "z"]

[[case]]
name = "%b a surrogate is fatal"
args = ["%b", "\\U0000D800"]

[[case]]
name = "%b a trailing backslash"
args = ["%b", "a\\"]

[[case]]
name = "%b under UTF-8"
args = ["%b\n", "\\u00e9"]
