# %q: shell-escape quoting.

[[case]]
name = "%q of ordinary words"
args = ["%q|%q|%q\n", "abc", "-x", "x~"]

[[case]]
name = "%q of an empty argument"
args = ["%q\n", ""]

[[case]]
name = "%q of spaces and specials"
args = ["%q|%q|%q|%q|%q\n", "a b", "$x", "!", "a=b", "{a}"]

[[case]]
name = "%q of quotes"
args = ["%q|%q|%q|%q\n", "a'b", "a\"b", "a'b\"c", "'"]

[[case]]
name = "%q of a backslash"
args = ["%q\n", "a\\b"]

[[case]]
name = "%q of a leading # and ~"
args = ["%q|%q|%q|%q\n", "#a", "a#", "~x", "x~"]

[[case]]
name = "%q of control bytes"
args = ["%q|%q|%q\n", "a\tb", "a\nb", "\u0001"]

[[case]]
name = "%q of DEL and non-ASCII under C"
args = ["%q|%q|%q\n", "\u007f", "xy", "é"]

[[case]]
name = "%q of printable and control mixed"
args = ["%q\n", "a b\u0001"]

[[case]]
name = "%q under UTF-8 keeps a printable character"
args = ["%q|%q|%q\n", "é", "é x", "é\tx"]
env = { LC_ALL = "C.UTF-8" }

[[case]]
name = "%q takes no width"
args = ["[%10q]", "a b"]

[[case]]
name = "%q takes no precision"
args = ["[%.2q]", "a b"]

# %c and %s.

[[case]]
name = "%c takes the first byte"
args = ["%c%c%c\n", "abc", "", "x"]

[[case]]
name = "%c of a multibyte character is its first byte"
args = ["%c\n", "é"]

[[case]]
name = "%c with a width"
args = ["%5c|%-3c|\n", "a", "b"]

[[case]]
name = "%c of nothing with a width"
args = ["%5c|\n", ""]

[[case]]
name = "%c takes no precision"
args = ["[%.2c]", "a"]

[[case]]
name = "%c takes no 0"
args = ["[%0c]", "a"]

[[case]]
name = "%c takes no #"
args = ["[%#c]", "a"]

[[case]]
name = "%c accepts + and space"
args = ["[%+c][% c]", "a", "b"]

[[case]]
name = "%s width and precision"
args = ["%5s|%-5s|%.2s|%5.1s|\n", "abc", "abc", "abc", "abc"]

[[case]]
name = "%s precision cuts bytes, not characters"
args = ["%.3s|%.1s\n", "éé", "é"]

[[case]]
name = "%s takes no 0"
args = ["[%0s]", "a"]

[[case]]
name = "%s takes no #"
args = ["[%#s]", "a"]

[[case]]
name = "%s accepts + and space"
args = ["[%+s][% s]", "a", "b"]

[[case]]
name = "%s empty precision"
args = ["%.s|\n", "abc"]

[[case]]
name = "%s of --"
args = ["%s\n", "--"]

[[case]]
