# Integers: what an argument means.

[[case]]
name = "decimal, signs and blanks"
args = ["%d %d %d %d %d\n", "12", "-3", "+4", "  -5", " 7"]

[[case]]
name = "hex and octal"
args = ["%d %d %d %d\n", "0x1f", "0X1F", "-0x10", "010"]

[[case]]
name = "0x with no digit"
args = ["%d\n", "0x"]

[[case]]
name = "08 is octal 0 and a remainder"
args = ["%d\n", "08"]

[[case]]
name = "an exponent is a remainder"
args = ["%d\n", "1e3"]

[[case]]
name = "a trailing blank is a remainder"
args = ["%d\n", "7 "]

[[case]]
name = "trailing letters"
args = ["%d\n", "12abc"]

# GNU 9.4 takes an EMPTY numeric argument as 0 without a word; 9.11
# says `'': expected a numeric value`.
[[case]]
name = "nothing numeric"
gnu_min = "9.11"
args = ["%d %d %d\n", "", "x", "-"]

[[case]]
name = "a sign and a space"
args = ["%d %d %d\n", "- 5", "--5", "+-5"]

[[case]]
name = "a lone plus"
args = ["%d\n", "+"]

[[case]]
name = "character constants"
args = ["%d %d %d\n", "'a", "\"b", "'ab"]

[[case]]
name = "a lone quote"
args = ["%d\n", "'"]

[[case]]
name = "a character constant under POSIXLY_CORRECT"
args = ["%d %d\n", "'ab", "1x"]
env = { POSIXLY_CORRECT = "1" }

[[case]]
name = "a non-ASCII character constant under C"
args = ["%d\n", "'é"]

[[case]]
name = "a non-ASCII character constant under UTF-8"
args = ["%d\n", "'é"]
env = { LC_ALL = "C.UTF-8" }

[[case]]
name = "the 64-bit limits"
args = ["%d %d\n", "9223372036854775807", "-9223372036854775808"]

[[case]]
name = "past the 64-bit limits"
args = ["%d %d %d\n", "9223372036854775808", "-9223372036854775809", "99999999999999999999"]

[[case]]
name = "hex past the signed limit"
args = ["%d\n", "0x8000000000000000"]

[[case]]
name = "octal at and past the limits"
args = ["%i %i\n", "0777777777777777777777", "01777777777777777777777"]

[[case]]
name = "unsigned of -1"
args = ["%u %o %x %X\n", "-1", "-1", "-1", "-1"]

[[case]]
name = "unsigned limits"
args = ["%u %u\n", "18446744073709551615", "18446744073709551616"]

[[case]]
name = "unsigned of negatives"
args = ["%u %u %u\n", "-18446744073709551615", "-18446744073709551616", "-0"]

[[case]]
name = "hex of a negative past the signed limit"
args = ["%x\n", "-9223372036854775809"]

[[case]]
name = "octal at and past 2^64"
args = ["%o %o\n", "01777777777777777777777", "02000000000000000000000"]

[[case]]
name = "hex of character constants"
args = ["%x %X\n", "'a", "\"é"]

[[case]]
name = "unsigned of the signed limit"
args = ["%x %X %o %u\n", "9223372036854775807", "9223372036854775808", "9223372036854775808", "9223372036854775808"]

[[case]]
name = "a width argument that is not a number"
args = ["%*d|\n", "x", "1"]

[[case]]
name = "a 0b prefix"
args = ["%d\n", "0b101"]
# glibc 2.38+ reads 0b as binary and macOS as 0 with a remainder;
# src/printf.lu follows the host.

# Integers: formatting.

[[case]]
name = "every integer conversion"
args = ["%d %i %o %u %x %X\n", "10", "10", "10", "10", "255", "255"]

[[case]]
name = "width, left and zero"
args = ["%5d|%-5d|%05d|\n", "2", "3", "4"]

[[case]]
name = "signs"
args = ["%+d|% d|%+d|% d|%+d\n", "5", "6", "-5", "-6", "0"]

[[case]]
name = "precision"
args = ["%.3d|%5.3d|%.3d|%+.3d|%-6.3d\n", "7", "8", "-5", "5", "-5"]

[[case]]
name = "precision 0 of 0 is nothing"
args = ["[%.0d][%.d][%5.0d]\n", "0", "0", "0"]

[[case]]
name = "0 is ignored beside a precision"
args = ["%06.3d|%-08d|%0-8d\n", "5", "1", "2"]

[[case]]
name = "space and 0"
args = ["% 06d|%+ d|% +d\n", "5", "3", "4"]

[[case]]
name = "# on octal and hex"
args = ["%#o|%#x|%#X|%#5x|%#o|%#x\n", "8", "255", "255", "0", "0", "0"]

[[case]]
name = "# on octal with a precision"
args = ["%#.3o|%.3x\n", "8", "10"]

[[case]]
name = "# of zero with precision 0"
args = ["[%#.0o][%#.0x]\n", "0", "0"]

[[case]]
name = "+ and space are ignored for unsigned"
args = ["[%+u][% x][%+o]\n", "5", "5", "5"]

[[case]]
name = "the ' flag is accepted and does nothing in C"
args = ["%'d|%'u|%'i\n", "1234567", "1234567", "1234567"]

[[case]]
name = "length modifiers are skipped"
args = ["%ld %lld %hd %hhd %jd %zd %td\n", "1", "2", "3", "4", "5", "6", "7"]

[[case]]
name = "h does not truncate"
args = ["%hhd %hhu %hu\n", "300", "300", "70000"]

[[case]]
name = "q is a conversion, not a modifier"
args = ["%qd\n", "9"]

[[case]]
name = "a width from an argument"
args = ["%*d|%-*d|\n", "5", "1", "5", "2"]

[[case]]
name = "a negative width argument left-justifies"
args = ["%*d|\n", "-5", "1"]

[[case]]
name = "a precision from an argument"
args = ["%.*d|\n", "3", "5"]

[[case]]
name = "a negative precision argument is none"
args = ["%.*d|\n", "-3", "5"]

[[case]]
name = "a width argument past an int is fatal"
args = ["%*d\n", "2147483648", "1"]

[[case]]
name = "a width argument that fits"
args = ["%*d|\n", "3", "1"]

[[case]]
name = "a literal width past an int"
args = ["%2147483648d\n", "1"]

# Indexed arguments. GNU 9.4 (ubuntu-latest's own, the `field` leg's)
# has no `%N$` at all and refuses each of these as an invalid
# conversion, so they name 9.11 as the GNU they describe.

[[case]]
name = "%1$ twice"
gnu_min = "9.11"
args = ["%1$s %1$s %2$s\n", "a", "b"]

[[case]]
name = "indexed and sequential count separately"
gnu_min = "9.11"
args = ["%2$s %s\n", "a", "b", "c"]

[[case]]
name = "the highest index is what a pass consumed"
gnu_min = "9.11"
args = ["%1$s %s %s\n", "a", "b", "c", "d"]

[[case]]
name = "a sequential then an indexed reference"
gnu_min = "9.11"
args = ["%s %2$s\n", "a", "b", "c", "d"]

[[case]]
name = "%s then %1$"
gnu_min = "9.11"
args = ["%s %1$s\n", "a", "b"]

[[case]]
name = "an index past the arguments"
gnu_min = "9.11"
args = ["%3$s\n", "a"]

[[case]]
name = "a huge index"
gnu_min = "9.11"
args = ["%99999999999$s\n", "a"]

[[case]]
name = "%5$ with one argument"
gnu_min = "9.11"
args = ["%5$s|\n", "a"]

[[case]]
name = "index 0 is invalid"
args = ["%0$s\n", "a"]

[[case]]
name = "an index and no conversion"
gnu_min = "9.11"
args = ["%1$\n", "a"]

[[case]]
name = "two indexes"
gnu_min = "9.11"
args = ["%1$1$s\n", "a"]

[[case]]
name = "a width from an indexed argument"
gnu_min = "9.11"
args = ["%1$*2$d|\n", "5", "3"]

[[case]]
name = "an indexed width beside a sequential value"
gnu_min = "9.11"
args = ["%1$d %*2$d|\n", "5", "3"]

[[case]]
name = "a width from argument 1 for the first value"
gnu_min = "9.11"
args = ["%*1$d|\n", "5"]

[[case]]
name = "a precision from an indexed argument"
gnu_min = "9.11"
args = ["%.*2$d|\n", "5", "3"]

