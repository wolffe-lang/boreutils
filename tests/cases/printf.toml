# printf — GNU coreutils 9.11, black-box (`/usr/bin/printf`, never a
# shell's builtin), on linux x86-64 and macOS arm64. The floating
# conversions print the HOST's `long double` — x87 on linux, IEEE double
# on macOS — so a case like `%.20f 0.1` has a different right answer on
# each CI leg, and src/printf.lu emulates whichever one it runs on.
# The help and version TEXT is ours, so those compare the exit only.

# Operands, reuse and missing arguments.

[[case]]
name = "no operand"
args = []

[[case]]
name = "a plain format"
args = ["hello\n"]

[[case]]
name = "an empty format"
args = [""]

[[case]]
name = "the format is reused"
args = ["%s\n", "a", "b", "c"]

[[case]]
name = "two conversions, reused, the last pass short"
args = ["%s %s\n", "a", "b", "c"]

[[case]]
name = "a missing string is empty"
args = ["%s|%s\n", "a"]

[[case]]
name = "missing values of every kind"
args = ["[%q][%b][%s][%d][%f][%c]\n"]

[[case]]
name = "a missing %c is a NUL byte"
args = ["%c|%c\n"]

[[case]]
name = "excess arguments are ignored with a warning"
args = ["x\n", "extra"]

[[case]]
name = "excess arguments after %%"
args = ["%%d\n", "1"]

[[case]]
name = "an empty format with an argument"
args = ["", "a"]

[[case]]
name = "-- is skipped once"
args = ["--", "%s\n", "x"]

[[case]]
name = "-- alone is a missing operand"
args = ["--"]

[[case]]
name = "-- then --help is a format"
args = ["--", "--help"]

[[case]]
name = "a lone - is a format"
args = ["-"]

[[case]]
name = "-x is a format"
args = ["-x"]

[[case]]
name = "-n is a format, and its argument is excess"
args = ["-n", "x"]

[[case]]
name = "--help with an argument is a format"
args = ["--help", "x"]

[[case]]
name = "--version with an argument is a format"
args = ["--version", "x"]

[[case]]
name = "--he is a format, not help"
args = ["--he"]

[[case]]
name = "a format with no conversion and no argument"
args = ["%%%s%%\n", "x"]

[[case]]
name = "reuse stops when a pass consumes nothing"
args = ["%s\\n%s\n", "a"]

# Escapes in the format.

[[case]]
name = "the one-letter escapes"
args = ["\\a\\b\\e\\f\\n\\r\\t\\v\\\\\\\"|"]

[[case]]
name = "unknown escapes are written as they are"
args = ["\\'\\?\\q\\z|"]

[[case]]
