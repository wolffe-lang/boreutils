# timeout — GNU coreutils 9.11, black-box, on linux x86-64 and macOS arm64.
#
# NO CASE IN THIS FILE STARTS A COMMAND, and tools/difftest refuses the run
# if one could (bu27): every case is `--help`, `--version`, a usage error,
# or a COMMAND no host can run (`/`, `/etc/passwd`, `/nonexistent/...`),
# so timeout answers 125, 126 or 127 before any child exists and nothing
# is signalled. What runs a command is tests/timeout/cases.toml, run by
# tools/timeouttest in a fresh container a case.
#
# A valid DURATION is seen here by the command it then fails to run (127,
# `failed to run command`); an invalid one by 125 before it. Not here: a
# DURATION too small for a double (`1e-400`) with a command that cannot
# run, where GNU's timer kills its own child before the child can report
# the failed exec (124, measured) and wolf's spawn reports it at once
# (127): a race of GNU's, decided by its timer. The help and version TEXT
# is ours, so those cases compare the exit only.


[[case]]
name = "help: --help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "help: --version"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "help: --help after an option"
args = ["-v", "--help"]
compare = ["exit"]

[[case]]
name = "help: --help with standard output closed"
args = ["--help"]
compare = ["exit", "stderr"]
stdout_closed = true

[[case]]
name = "help: --version to a full device"
args = ["--version"]
compare = ["exit", "stderr"]
stdout_file = "/dev/full"

[[case]]
name = "help: an option that is wrong before --help"
args = ["-s", "FOO", "--help"]

[[case]]
name = "usage: too few operands: none"
args = []

[[case]]
name = "usage: too few operands: 1"
args = ["1"]

[[case]]
name = "usage: too few operands: -v"
args = ["-v"]

[[case]]
