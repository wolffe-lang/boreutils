# GNU 9.11 host identifier: both processes see the same host sources.
#
# Row 0 prints the identifier, so its answer is the host's (boreutils#70):
# GNU reads /etc/hostid, else asks the resolver, which answers from
# /etc/hosts only when the host database reads files first and a line
# names this host, and otherwise from DNS; boreutils reads the two files
# and has no resolver. `host_id` runs the row only where GNU answers from
# the files, and skips it by name anywhere else. The rows that write both
# files themselves, and the refusals where neither answers, run in a
# container: tests/ids/cases.toml, tools/idtest.

[[case]]
name = "0 []"
args = []
host_id = true
skip_on = { Darwin = "no gethostid or host-address resolver surface" }

[[case]]
name = "1 ['--help']"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "2 ['--version']"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "3 ['-Q']"
args = ["-Q"]

[[case]]
name = "4 ['x']"
args = ["x"]

[[case]]
name = "5 ['x', 'y']"
args = ["x", "y"]
