# GNU 9.11 host identifier: both processes see the same host sources.

[[case]]
name = "0 []"
args = []
skip_on = { Darwin = "no gethostid or host-address resolver surface" }

[[case]]
name = "1 ['--help']"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "2 ['--version']"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "3 ['-Q']"
args = ["-Q"]

[[case]]
name = "4 ['x']"
args = ["x"]

[[case]]
name = "5 ['x', 'y']"
args = ["x", "y"]
