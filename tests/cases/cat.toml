# ---------------------------------------------------------------- SIGPIPE

[[case]]
name = "a stream cut short by the reader dies on SIGPIPE"
args = ["/dev/zero"]
stdout_bytes = 4096

[[case]]
name = "a rendered stream cut short by the reader dies on SIGPIPE"
args = ["-v", "/dev/zero"]
stdout_bytes = 4096

# A closed standard output (`cat FILE >&-`). GNU coreutils 9.11 on both
# hosts says `cat: standard output: Bad file descriptor` and exits 1 —
# and it says it BEFORE it touches an operand, which is why `cat nope`
# with a closed descriptor never reports the missing file. `--version`
# is the other shape: it writes, and the failure is reported at the exit
# flush as `cat: write error: Bad file descriptor`.

[[case]]
name = "standard output closed"
args = ["tests/fixtures/plain.txt"]
stdout_closed = true

[[case]]
name = "standard output closed, a rendering option"
args = ["-n", "tests/fixtures/plain.txt"]
stdout_closed = true

[[case]]
name = "standard output closed, the operand is never opened"
args = ["nope"]
stdout_closed = true

[[case]]
name = "standard output closed, standard input"
stdin_file = "plain.txt"
stdout_closed = true

[[case]]
name = "standard output closed, version"
args = ["--version"]
stdout_closed = true

# A write error on a LIVE descriptor (see echo's case for why the
# comparison is the exit status only). GNU names no FILE here — the
# failure is standard output's, not the operand's — which is what the
# `Stop` type in cat.lu keeps apart.

[[case]]
name = "a write error on a live descriptor"
args = ["tests/fixtures/plain.txt"]
stdout_file = "/dev/full"
compare = ["exit"]

[[case]]
name = "a write error on a live descriptor, a rendering option"
args = ["-n", "tests/fixtures/plain.txt"]
stdout_file = "/dev/full"
compare = ["exit"]
