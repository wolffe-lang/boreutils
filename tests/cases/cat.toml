# cat — GNU coreutils 9.11, black-box. Every expectation here was read
# off the GNU binary under LC_ALL=C, never off its source.
#
# File operands are written relative to the repository root, which is
# where difftest runs every case from.

# ------------------------------------------------------------ streaming

[[case]]
name = "no operand reads standard input"
stdin = "one\ntwo\n"

[[case]]
name = "a lone dash is standard input"
args = ["-"]
stdin = "one\ntwo\n"

[[case]]
name = "standard input with no trailing newline"
args = ["-"]
stdin = "tail"

[[case]]
name = "empty standard input"
args = ["-"]
stdin = ""

[[case]]
name = "one file"
args = ["tests/fixtures/plain.txt"]

[[case]]
name = "two files"
args = ["tests/fixtures/plain.txt", "tests/fixtures/second.txt"]

[[case]]
name = "the same file twice"
args = ["tests/fixtures/plain.txt", "tests/fixtures/plain.txt"]

[[case]]
name = "an empty file"
args = ["tests/fixtures/empty.txt"]

[[case]]
name = "an empty file between two others"
args = [
    "tests/fixtures/plain.txt",
    "tests/fixtures/empty.txt",
    "tests/fixtures/second.txt",
]

[[case]]
name = "a file with no trailing newline"
args = ["tests/fixtures/nonl.txt"]

[[case]]
name = "an unterminated file runs into the next one"
args = ["tests/fixtures/nonl.txt", "tests/fixtures/second.txt"]

[[case]]
name = "a file, then standard input, then the file again"
args = ["tests/fixtures/plain.txt", "-", "tests/fixtures/plain.txt"]
stdin = "MIDDLE\n"

[[case]]
name = "two dashes read standard input once"
args = ["-", "-"]
stdin = "only\n"

[[case]]
name = "every byte value, byte for byte"
args = ["tests/fixtures/binary.bin"]

[[case]]
name = "every byte value through standard input"
args = ["-"]
stdin_file = "binary.bin"

[[case]]
name = "multibyte UTF-8"
args = ["tests/fixtures/utf8.txt"]

# -------------------------------------------------------------- renderings

[[case]]
name = "-E on plain text"
args = ["-E", "tests/fixtures/plain.txt"]

[[case]]
name = "-E shows only the carriage return that meets the newline"
args = ["-E", "tests/fixtures/crlf.txt"]

[[case]]
name = "-E on a file with no trailing newline"
args = ["-E", "tests/fixtures/nonl.txt"]

[[case]]
name = "-T on tabs"
args = ["-T", "tests/fixtures/tabs.txt"]

[[case]]
name = "-v on every byte value"
args = ["-v", "tests/fixtures/binary.bin"]

[[case]]
name = "-v on multibyte UTF-8"
args = ["-v", "tests/fixtures/utf8.txt"]

[[case]]
name = "-v shows every carriage return"
args = ["-v", "tests/fixtures/crlf.txt"]

[[case]]
name = "-A is -vET"
args = ["-A", "tests/fixtures/binary.bin"]

[[case]]
name = "-A on tabs"
args = ["-A", "tests/fixtures/tabs.txt"]

[[case]]
name = "-A on carriage returns"
args = ["-A", "tests/fixtures/crlf.txt"]

[[case]]
name = "-e is -vE"
args = ["-e", "tests/fixtures/binary.bin"]

[[case]]
name = "-e on carriage returns"
args = ["-e", "tests/fixtures/crlf.txt"]

[[case]]
name = "-t is -vT"
args = ["-t", "tests/fixtures/binary.bin"]

[[case]]
name = "-t on tabs"
args = ["-t", "tests/fixtures/tabs.txt"]

[[case]]
name = "-vET spelled out equals -A"
args = ["-v", "-E", "-T", "tests/fixtures/binary.bin"]

# --------------------------------------------------------------- numbering

[[case]]
name = "-n numbers every line"
args = ["-n", "tests/fixtures/plain.txt"]

[[case]]
name = "-n numbers empty lines too"
args = ["-n", "tests/fixtures/blanks.txt"]

[[case]]
name = "-b numbers only the lines that are not empty"
args = ["-b", "tests/fixtures/blanks.txt"]

[[case]]
name = "-b overrides -n"
args = ["-bn", "tests/fixtures/blanks.txt"]

[[case]]
name = "-n before -b is still -b"
args = ["-nb", "tests/fixtures/blanks.txt"]

[[case]]
name = "-b after -n as separate words"
args = ["-n", "-b", "tests/fixtures/blanks.txt"]

[[case]]
name = "numbering runs on across operands"
args = ["-n", "tests/fixtures/plain.txt", "tests/fixtures/second.txt"]

[[case]]
name = "numbering treats an unterminated line as a line"
args = ["-n", "tests/fixtures/nonl.txt"]

[[case]]
name = "numbering continues through an unterminated file"
args = ["-n", "tests/fixtures/nonl.txt", "tests/fixtures/second.txt"]

[[case]]
name = "-b on an unterminated file"
args = ["-b", "tests/fixtures/nonl.txt"]

[[case]]
name = "-n on an empty file"
args = ["-n", "tests/fixtures/empty.txt"]

[[case]]
name = "-n on a file that is one newline"
args = ["-n", "-"]
stdin = "\n"

[[case]]
name = "-b on a file that is one newline"
args = ["-b", "-"]
stdin = "\n"

[[case]]
name = "a carriage-return line is not empty for -b"
