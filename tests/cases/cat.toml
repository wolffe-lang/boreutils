stdin = "a\n\r\n\r\nb\n"

[[case]]
name = "-bE on carriage returns"
args = ["-bE", "-"]
stdin = "a\n\r\n\r\nb\n"

# ---------------------------------------------------------------- squeeze

[[case]]
name = "-s collapses runs of empty lines"
args = ["-s", "tests/fixtures/blanks.txt"]

[[case]]
name = "-s leaves a file with no empty lines alone"
args = ["-s", "tests/fixtures/plain.txt"]

[[case]]
name = "-s does not squeeze lines holding a space"
args = ["-s", "-"]
stdin = "a\n \n \n\n\nb\n"

[[case]]
name = "-s does not squeeze carriage-return lines"
args = ["-s", "-"]
stdin = "a\n\r\n\r\nb\n"

[[case]]
name = "-s squeezes leading and trailing runs"
args = ["-s", "-"]
stdin = "\n\n\nlead\n\n\n"

[[case]]
name = "-s squeezes across an operand boundary"
args = ["-s", "tests/fixtures/nonl.txt", "-"]
stdin = "\n\n\nz\n"

[[case]]
name = "-s squeezes before -n numbers"
args = ["-sn", "tests/fixtures/blanks.txt"]

[[case]]
name = "-s with -b"
args = ["-sb", "tests/fixtures/blanks.txt"]

[[case]]
name = "-s with -A"
args = ["-sA", "tests/fixtures/blanks.txt"]

