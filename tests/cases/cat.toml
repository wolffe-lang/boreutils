args = ["--show-nonprinting", "tests/fixtures/binary.bin"]

[[case]]
name = "a long option abbreviated to a unique prefix"
args = ["--number-n", "tests/fixtures/blanks.txt"]

[[case]]
name = "--squeeze abbreviated"
args = ["--squeeze", "tests/fixtures/blanks.txt"]

[[case]]
name = "--show-a abbreviated"
