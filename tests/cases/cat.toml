[[case]]
name = "the same option twice"
args = ["-n", "-n", "tests/fixtures/plain.txt"]

[[case]]
name = "end of options"
args = ["--", "tests/fixtures/plain.txt"]

[[case]]
name = "end of options with nothing after it reads standard input"
args = ["--"]
stdin = "S\n"

[[case]]
name = "options permute after an operand"
args = ["tests/fixtures/plain.txt", "-n"]

[[case]]
name = "POSIXLY_CORRECT: an operand ends the options"
args = ["tests/fixtures/plain.txt", "-n"]
