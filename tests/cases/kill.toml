[[case]]
name = "help: --ve"
args = ["--ve"]
compare = ["exit"]

[[case]]
name = "help: --help extra"
args = ["--help", "extra"]
compare = ["exit"]

[[case]]
name = "help: --version extra"
args = ["--version", "extra"]
compare = ["exit"]

[[case]]
name = "help: -l --help"
args = ["-l", "--help"]
compare = ["exit"]

[[case]]
name = "help: --help -l"
args = ["--help", "-l"]
compare = ["exit"]

[[case]]
name = "help: --help -x"
args = ["--help", "-x"]
