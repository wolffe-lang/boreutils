# bu27: the host's own signals (wolf 0.2.31's `-N`, `os_signal_last`,
# `os_signal_realtime`, `os_signal_text`). A real-time name is RTMIN or
# RTMAX, or either followed by a number C's strtol reads (measured: a
# blank, a sign, leading zeros), inside the range; on macOS, which has
# none, every one of them is invalid on both sides.

[[case]]
name = "host: -l RTMIN1"
args = ["-l", "RTMIN1"]

[[case]]
name = "host: -l 'RTMIN 1'"
args = ["-l", "RTMIN 1"]

[[case]]
name = "host: -l 'RTMAX -1'"
args = ["-l", "RTMAX -1"]

[[case]]
name = "host: -l 'RTMIN  +1'"
args = ["-l", "RTMIN  +1"]

[[case]]
name = "host: -l RTMIN0"
args = ["-l", "RTMIN0"]

[[case]]
name = "host: -l RTMAX0"
args = ["-l", "RTMAX0"]

[[case]]
name = "host: -l RTMAX1"
args = ["-l", "RTMAX1"]

[[case]]
name = "host: -l RTMIN-0"
args = ["-l", "RTMIN-0"]

[[case]]
name = "host: -l 'RTMIN '"
args = ["-l", "RTMIN "]

[[case]]
name = "host: -l RTMIN+-1"
args = ["-l", "RTMIN+-1"]

[[case]]
name = "host: -l RTMIN+1x"
args = ["-l", "RTMIN+1x"]

[[case]]
name = "host: -l RTMIN00000000000000000000001"
args = ["-l", "RTMIN00000000000000000000001"]

[[case]]
name = "host: -l RTMIN99999999999999999999"
args = ["-l", "RTMIN99999999999999999999"]

[[case]]
name = "host: -l SIGRTMAX"
args = ["-l", "SIGRTMAX"]

[[case]]
name = "host: -l rtmax-30"
args = ["-l", "rtmax-30"]

[[case]]
name = "host: -l RTMAX-31"
args = ["-l", "RTMAX-31"]

[[case]]
name = "host: -l RTMIN_1"
args = ["-l", "RTMIN_1"]

[[case]]
name = "host: -t RTMIN+15 RTMAX-14"
args = ["-t", "RTMIN+15", "RTMAX-14"]
mask = ["(?m)(?<=^ 0 EXIT)( +[^\\n]*)?$"]

[[case]]
