# kill — GNU coreutils 9.11, black-box: coreutils' OWN `kill`, built from
# the oracle tarball with --enable-install-program=kill (gnu-oracle.toml)
# and asserted by its `--version` line. Never a shell's builtin, never
# procps' or util-linux's /usr/bin/kill.
#
# NO CASE IN THIS FILE CAN SEND A SIGNAL, and tools/difftest refuses the
# run if one could: every case starts with a list option (`-l`, `-t`,
# `-L`, `--list`, `--table`), `--help` or `--version`, or else holds no
# argument that is a number. What sends is tests/kill/cases.toml, run by
# tools/killtest in a fresh container a case.
#
# A signal's NUMBER is the host's (`USR1` is 10 on linux, 30 on macOS),
# so a case written by number answers per host on both sides. Since bu27
# (wolf 0.2.31's host signals) every signal the host numbers is this
# kill's too — linux's STKFLT, POLL, PWR and the real-time range, macOS's
# EMT, IO, INFO — so no case is skipped for one any more.
#
# `-t` prints three columns: number, name, and the host's words for the
# signal (`strsignal`, which wolf asks through `os_signal_text`). The one
# row with no words here is signal 0's (`EXIT`): `os_signal_text` refuses
# 0, so the `mask` hides GNU's third column on that row only. The whole
# tables (`-l`, `-t` with no operand) are compared whole.
#
# Generated by notes/bu23/gen/kill_cases.py and carried to 0.2.32 by
# notes/bu27/gen/kill_cases_0232.py; the help and version TEXT is
# ours, so those cases compare the exit only.

# Help and version: our own words, GNU's shape.

[[case]]
name = "help: --help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "help: --version"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "help: --h"
args = ["--h"]
compare = ["exit"]

[[case]]
name = "help: --v"
args = ["--v"]
