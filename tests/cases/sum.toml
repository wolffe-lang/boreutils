[[case]]
name = "file"
args = ["f"]
scratch = { "f" = "abc" }

[[case]]
name = "two files"
args = ["f", "e"]
scratch = { "f" = "abc", "e" = "" }

[[case]]
name = "same file twice"
args = ["f", "f"]
scratch = { "f" = "abc" }

[[case]]
name = "stdin mixed with files"
args = ["f", "-", "e"]
