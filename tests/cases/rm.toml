# --- options
[[case]]
name = "-- ends the options"
args = ["--", "-f"]
scratch = { "-f" = "" }

[[case]]
name = "./-f names the file"
args = ["./-f"]
scratch = { "-f" = "" }

[[case]]
name = "a bad option"
args = ["-x"]

[[case]]
name = "a bad option, and a file of that name"
args = ["-x"]
scratch = { "-x" = "" }

[[case]]
name = "a bad option, and a file whose name has a space"
args = ["-a b"]
scratch = { "-a b" = "" }

[[case]]
name = "a bad option, and a file whose name has a quote"
args = ["-q'x"]
scratch = { "-q'x" = "" }

[[case]]
name = "a bad long option, and a file with a dash"
args = ["--bogus", "-y"]
scratch = { "-y" = "" }

[[case]]
name = "a bad option, and the first such file is the one named"
args = ["-x", "-y", "-z"]
scratch = { "-y" = "", "-z" = "" }

[[case]]
name = "an unknown long option"
args = ["--bogus", "f"]
scratch = { "f" = "hi\n" }

[[case]]
name = "POSIXLY_CORRECT: the first operand ends the options"
args = ["f", "-v"]
scratch = { "f" = "", "-v" = "" }
env = { "POSIXLY_CORRECT" = "1" }

[[case]]
name = "--help"
args = ["--help"]
compare = ["exit"]

[[case]]
name = "--version"
args = ["--version"]
compare = ["exit"]

[[case]]
name = "--help wins over a later bad option"
args = ["--help", "--bogus"]
compare = ["exit"]

[[case]]
name = "stdout closed, nothing to write"
args = ["f"]
scratch = { "f" = "hi\n" }
stdout_closed = true

[[case]]
name = "stdout closed under -v"
args = ["-v", "f"]
scratch = { "f" = "hi\n" }
stdout_closed = true
