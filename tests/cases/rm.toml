# rm — GNU coreutils 9.11, black-box, on linux x86-64 and macOS arm64.
# Written by ~/lanes/bu21/gen/rm_cases.py; this file is the record.
#
# rm removes, so every case runs in a scratch directory the harness made
# under its root and checked by prefix immediately before each side
# starts (tools/difftest, bu21), and the harness refuses the whole run
# when any case names `/`, a `~`, a `..` component or an absolute path
# outside `{scratch}`. NO CASE RUNS ANY rm ON THE ROOT: the refusal of
# `/` is a function, unit-tested in src/change_test.lu. A link in a
# fixture points inside the scratch directory or at nothing.
#
# What each side leaves is compared as `files` (names, kinds, bytes)
# and `tree` (modes, link counts): a removal that reached further than
# GNU's is a difference in what is LEFT.
#
# What this rm cannot match is named, never imitated:
#   --no-preserve-root   refused by name: this rm does not remove `/`
#   --preserve-root=all  not written yet
#   wolf-lang#633        "may I write it?" is the owner's write bit

# --- files
[[case]]
name = "no operand"
args = []

[[case]]
name = "a file"
args = ["f"]
scratch = { "f" = "hi\n" }

[[case]]
name = "two files"
args = ["f", "g"]
scratch = { "f" = "1\n", "g" = "2\n", "keep" = "3\n" }

[[case]]
name = "a missing name"
args = ["missing"]

[[case]]
name = "a missing name among files"
args = ["f", "missing", "g"]
scratch = { "f" = "1\n", "g" = "2\n" }

[[case]]
name = "an empty name"
args = [""]

[[case]]
name = "a file named twice"
args = ["f", "f"]
scratch = { "f" = "hi\n" }

[[case]]
name = "a name under a file"
args = ["f/x"]
scratch = { "f" = "hi\n" }

[[case]]
name = "a file with a trailing slash"
args = ["f/"]
scratch = { "f" = "hi\n" }

[[case]]
name = "a file with two trailing slashes"
args = ["f//"]
scratch = { "f" = "hi\n" }

[[case]]
name = "an empty file"
args = ["e"]
scratch = { "e" = "" }

[[case]]
name = "a file in a subdirectory"
args = ["d/a"]
scratch = { "d/a" = "a\n", "d/sub/b" = "b\n", "d/sub/deep/c" = "c\n" }

[[case]]
name = "an absolute path"
args = ["{scratch}/f"]
scratch = { "f" = "1\n", "keep" = "2\n" }

[[case]]
name = "the cwd is a subdirectory"
args = ["a"]
scratch = { "d/a" = "a\n", "d/sub/b" = "b\n", "d/sub/deep/c" = "c\n" }
