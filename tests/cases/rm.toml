# --- -r never follows a link
# The first of these is the case a planted break must turn red (the
# lane's contract): a link inside the tree that points OUT of it, at a
# directory beside it in the same scratch directory. The link goes; what
# it names stays, with everything in it.
[[case]]
name = "-r: a link out of the tree is removed, and what it names is not"
args = ["-r", "t"]
scratch = { "t/in" = "x\n", "outside/keep" = "kept\n", "outside/sub/deeper" = "kept too\n" }
scratch_links = { "t/link" = "../outside" }

[[case]]
