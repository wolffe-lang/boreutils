# tests/ids/selftest.toml — run by tools/idtest-selftest, never by CI's
# idtest step. Each `plant:` case makes the sides differ ON PURPOSE, on
# one field, and must FAIL by name; the control must pass. `$who` in
# `setup` is the side being run (gnu, release, dev).

[[case]]
name = "plant: an owner one side changes"
util = "chown"
args = ["-v", ":pack", "f"]
setup = "[ \"$who\" = gnu ] || chown 4242 g"

[[case]]
name = "plant: an account one side cannot see"
util = "id"
args = ["alice"]
setup = "[ \"$who\" = gnu ] || sed -i 's/^alice:/alyce:/' /etc/passwd"

[[case]]
name = "plant: the actor took (ours would be root's 0)"
util = "id"
args = ["-u"]
as = "alice"
ours = { stdout = "0\n" }

[[case]]
name = "plant: the terminal and its record reached ours (ours would say nothing)"
util = "logname"
args = []
tty = true
utmp = [[7, "{tty}", "alice"]]
ours = { stdout = "", exit = 1 }

[[case]]
name = "control: the actor's own id"
util = "id"
args = ["-u"]
as = "alice"
ours = { stdout = "1001\n" }
expect = { stdout = "1001\n" }
