ours = { exit = 1, stdout = "", stderr = "kill: '0': a process group cannot be signalled: wolf sends to one process, an id above 0 ([os.signal.send])\n", fates = ["ended 143"] }

# Not permitted: the targets are root's and kill runs as an unprivileged user.

[[case]]
name = "not permitted"
args = ["{pid0}"]
other = true
container = true

[[case]]
name = "not permitted: signal 0"
args = ["-0", "{pid0}"]
other = true
container = true

[[case]]
name = "not permitted: -KILL, a word between two"
args = ["-KILL", "{pid0}", "abc", "{pid1}"]
targets = 2
other = true
container = true
