group = true
container = true
expect = { exit = 0, stderr = "", fates = ["0"] }
ours = { exit = 1, stdout = "", stderr = "kill: '-{pgid}': a process group cannot be signalled: wolf sends to one process, an id above 0 ([os.signal.send])\n", fates = ["3"] }

