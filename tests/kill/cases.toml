# kill, where it SENDS — run only by tools/killtest: one fresh container a
# case, no mount, no network, a process-id namespace of its own, and every
# target a process the case's own script started there (bu23). tools/difftest
# refuses every case of `kill` that could send, and no host process is ever
# named. On CI's macOS runner, which has no container engine and is itself
# a throwaway machine, the cases that are not `container = true` run
# directly, still against their own children.
#
# Each case runs GNU coreutils 9.11's own `kill` (asserted by its
# `--version` line), then this repository's on both tiers, and compares
# the exit status, standard output, standard error (a target's id written
# `{pidN}`) and what became of each target. `ours` is where this
# repository answers differently BY DESIGN — a process group, a signal
# wolf has no meaning for — and `expect` is then what GNU answered,
# MEASURED (kasumi ~/lanes/bu23/ev/probe-p2.log, probe-p3.log) and
# asserted of GNU again on every run.
#
# `{n:USR1}` is the number THIS host gives USR1, asked of GNU's `kill -l`;
# `{x:USR1}` is 128 more. Generated by notes/bu23/gen/kill_cases.py.

# The default signal, and every one of the 28 by name, by `-NAME` and by this host's number.

