# boreutils — CI.
#
# Two hosts, because a utility's behaviour has to be right on both:
# linux runs GNU coreutils natively, macOS runs Homebrew's g-prefixed
# build. Windows is out of scope for this project (the byte-IO route
# boreutils uses is `/dev/stdout` and `/dev/stdin`), so there is no
# windows job.
#
# THE ORACLE OF RECORD (B44). `gnu-oracle.toml` names the one GNU
# release boreutils is drop-in for, and the gauntlet runs against THAT
# release on every host rather than against whatever the runner image
# happens to ship — ubuntu-latest ships 9.4, where Homebrew and Arch
# ship 9.11, and they differ. `tools/fetch-oracle` installs it by
# digest, cached on the pin file's hash so the build is paid once.
# `tools/difftest` refuses to return a verdict against any other
# version, so this cannot quietly stop being true.
#
# The oracle is a BINARY WE RUN, never a source we read: building a
# released tarball derives no boreutils code from GPL source.
#
# The `field` job below is the other half of the ruling and is
# INFORMATION, not a verdict: it runs the distro's own GNU so the
# divergences the cases name with gnu_min / gnu_max stay honest. It is
# non-blocking about WHAT GNU ANSWERED and blocking about WHETHER THE
# LEG RAN — that is B98's ruling, and `tools/field-verdict` is where it
# is written down and `tools/field-verdict-selftest` is the gate on it.
#
# The toolchain is acquired from the release archives BY DIGEST
# (tools/fetch-toolchain refuses on a mismatch); nothing is built from
# source. Every lane runs bare and its exit code is read directly — no
# pipes, so nothing can mask a failure.

name: ci

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gauntlet:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gnu_prefix: ""
          - os: macos-latest
            gnu_prefix: "g"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: the bench tool, and macOS's GNU
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install --quiet coreutils hyperfine
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq hyperfine || {
              echo "::notice::no hyperfine package; taking the release binary"
              v=1.19.0
              url="https://github.com/sharkdp/hyperfine/releases/download/v$v/hyperfine_${v}_amd64.deb"
              curl -sSfL -o /tmp/hyperfine.deb "$url"
              sudo dpkg -i /tmp/hyperfine.deb
            }
          fi
          hyperfine --version

      # Keyed on the pin file, so bumping the oracle of record is what
      # invalidates it and nothing else does.
      - name: the oracle of record, cached
        uses: actions/cache@v4
        with:
          path: .gnu-bin
          key: gnu-oracle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gnu-oracle.toml') }}

      - name: the oracle of record, by digest
        shell: bash
        run: |
          set -euo pipefail
          prefix='${{ matrix.gnu_prefix }}'
          dir=$(BORE_GNU_PREFIX="$prefix" tools/fetch-oracle)
          if [ -n "$dir" ]; then
            # A staged build's binaries are unprefixed, whatever the host
            # would otherwise call them.
            echo "$dir" >> "$GITHUB_PATH"
            prefix=""
          fi
          echo "BORE_GNU_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: the pinned toolchain, by digest
        run: tools/fetch-toolchain

      - name: wolf fmt --check
        run: tools/check-fmt

      - name: build (release)
        run: tools/build

      - name: wolf test
        run: tools/check-test

      - name: the differential suite against the oracle of record
        run: tools/difftest

      - name: the harness sees a difference (the planted red)
        run: tools/difftest-selftest

      # boreutils#10. Three macOS reds have ended at exit 141 with an
      # empty transcript, so the harness is gated on keeping its report:
      # a broken pipe of its own does not take the run down, and a run
      # killed outright still leaves every case it had already decided.
      - name: the report survives the process (boreutils#10)
        run: tools/difftest-evidence

      # B98. The `field` leg's ruling is a shell script, so it is tested
      # like one: every exit code the leg can produce, judged, plus a
      # REAL planted SIGPIPE death of `tools/difftest` whose pipeline
      # status is 0 — which is how the leg died unnoticed in run
      # 35673565877 in the first place.
      - name: a death on the field leg is loud (B98)
        run: tools/field-verdict-selftest

      - name: smoke bench
        run: tools/bench --scale 0.0005 --runs 3

  # Not a verdict. The distro's own GNU is what a user on that distro
  # actually has, and the cases that name a version range with gnu_min /
  # gnu_max are claims about it — this leg is what keeps those claims
  # from rotting. It carries continue-on-error because a divergence here
  # is a finding to record, not a broken build; a failure annotation
  # under it is an ANNOUNCED ADVISORY.
  field:
    name: the field's GNU (information, not a verdict)
    runs-on: ubuntu-latest
    # NO `continue-on-error` on the job any more (B98). It made the leg
    # non-blocking about everything, including its own death: in run
    # 35673565877 `tools/difftest` here took exit 141 from signal 13,
    # left a partial report, and the job reported `success`, because
    # linux's pipe block is 4096 bytes and macOS's is 16384 so only the
    # macOS deaths were ever loud enough to notice. The advisory now
    # lives on the one step that earns it — the differential run, whose
    # exit 1 is a divergence and is DATA — and `tools/field-verdict`
    # decides which of the two a given exit code is.
    timeout-minutes: 30
    env:
      BORE_GNU_PREFIX: ""
      BORE_ORACLE_ANY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: what this runner ships
        # Through `env`: `true` is a shell builtin and the builtin
        # ignores --version, so the bare spelling prints nothing at all.
        run: env true --version | head -1

      - name: the pinned toolchain, by digest
        run: tools/fetch-toolchain

      - name: build (release)
        run: tools/build

      # `continue-on-error` HERE, not on the job: a divergence against
      # the runner's own GNU is the finding this leg exists to make.
      - name: the differential suite against the distro's GNU
        id: differential
        continue-on-error: true
        shell: bash
        run: |
          # PLANTED, and reverted in the next commit. B98's ruling says a
          # SIGNAL death on this leg is loud even though a verdict
          # difference is not, and a ruling nobody has watched fail is
          # not a ruling. `head -c 1` takes one byte and goes away, so
          # the harness's next write is the broken pipe it exits 141 on
          # — the same death run 35673565877 took unnoticed. Note that
          # the PIPELINE's own status is `head`'s and is 0, which is
          # exactly how it went unnoticed.
          set +e
          tools/difftest | head -c 1 > /dev/null
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # And the ruling, which is NOT continue-on-error: a leg that
      # cannot say whether it finished has produced no information, so a
      # signal death or a harness refusal reds the build even though a
      # verdict difference does not (B98).
      - name: what that exit code MEANS (B98)
        shell: bash
        run: tools/field-verdict '${{ steps.differential.outputs.code }}'
