# boreutils — the pinned toolchain.
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256
# digest, never from a source build. `tools/fetch-toolchain` downloads
# the archive for this host, refuses on a digest mismatch, and stages
# the whole archive into `.wolf-bin/` (gitignored). The native tier
# needs `libwolf_rt.a` beside the driver, which is why the whole
# archive is staged and not just the binary.
#
# Identity is the FIRST line of `--version` (lobo's lib-toolchain
# rule): `tools/lib-toolchain.sh` refuses when it drifts from
# `version_line`. `rev` is information: the commit the tag names.
#
# One row per host target the archives ship. Windows is out of scope
# for boreutils, so its archive is not pinned.
#
# Bumps are deliberate: their own commit, every lane green at the new
# pin, this note saying what the bump changes.
#
# ## The bump to 0.2.16 / 0.1.38 (bu07, 2026-09-24)
#
# Two releases on each half, from wolf 0.2.14 / lupin 0.1.36. Taken
# from the release archives by digest and nowhere else: not from a
# clone, not from `~/.local/bin`, not from a tap. Every MEMBER of each
# archive was hashed by name as well, and the cross-check that the
# member hashes are of one build is `_wolf` — the zsh completion
# script, which is architecture-independent and hashes
# 2d1e48018333e3dd70473b34dfc78723f91f71d44a3d95287b68ce85fbbc2221 in
# all three wolf archives. The per-member table is in
# `notes/bu07-the-pin-and-the-rest-of-b3.md`.
#
# What a downstream has to read at this bump:
#
#   * `[conf.exit]` (s169): the COMPILER now exits 2 for a rejected
#     program and 4 for a refusal, where it used to exit 1. Nothing in
#     this repository observes that status except `tools/build` under
#     `set -eu`, which fails identically on any non-zero, and no
#     differential case runs the compiler at all — a case runs a
#     native binary built ahead of time. So the corpus cannot see it.
#   * `move` on a `Copy` place now RECORDS the move (s177, wolf-lang#444).
#     That was a silent wrong answer on the native tier and it is the
#     one fix here a boreutils program could have been wrong under.
#     No `move` expression appears in `src/`, so nothing changes.
#   * `Scope` / `Proc[T]`, the typed join and the frozen spawn argument
#     (s170), pools and `handle T` (s173): surfaces no utility uses.
#   * The place model (s168) and `[type.list.lit.elem]` saying
#     `List[i32]` (s175): this repository builds every list with
#     `List[T]()` and pushes, because lupin 0.1.36 refused list
#     literals, so the literal's element type is unreachable here.
#
# ## The bump to 0.2.19 / 0.1.42 (bu11, 2026-09-30)
#
# One release on each half, taken from the release archives by digest
# as above; the per-member table is in
# `notes/bu11-the-pair-at-0.2.19.md`, and `_wolf` again hashes
# 2d1e48018333e3dd70473b34dfc78723f91f71d44a3d95287b68ce85fbbc2221 in
# all three wolf archives.
#
# What a downstream has to read at this bump:
#
#   * The checker only widens. Two `mut` claims on two literal elements
#     (EG2), a member read beside an element claim (#472) and
#     `len`/`count`/`is_empty` beside a moved element (#474) now
#     compile; the CHANGELOG names nothing 0.2.18 compiled that 0.2.19
#     refuses, and bu11's per-utility count found none. No site carries
#     a workaround for any of them: the only claim diagnostic `src/`
#     names is E1010 (wolf-lang#418, untouched).
#   * `--deny-warnings` no longer hides #464's E1001 behind a W1002
#     (#469, filed by bu10). Every boreutils build denies warnings and
#     none has one, so it shows only on a witness.
#   * The release-tier inliner keeps a call out of line when two of its
#     `mut` formals bind one caller region (#470, an ICE on 0.2.18).
#     0.2.18 built every utility, so no call here was spliced in that
#     shape; `cat` and `paste` are the utilities whose calls pass two
#     `mut` arguments, and bu11 benched them at both pins.
#
# ## The bump to 0.2.18 / 0.1.41 (bu10, 2026-09-28)
#
# One release on each half, a point release, taken from the release
# archives by digest as above; the per-member table is in
# `notes/bu10-the-pair-at-0.2.18.md`, and `_wolf` again hashes
# 2d1e48018333e3dd70473b34dfc78723f91f71d44a3d95287b68ce85fbbc2221 in
# all three wolf archives.
#
# What a downstream has to read at this bump:
#
#   * Two programs 0.2.17 compiled are refused (E1001), and both were
#     reading a moved value on every machine. #464: a function that
#     moves out of a `mut` parameter and returns without storing a
#     value back. #460: a read of a moved element that an index store
#     elsewhere in the container appeared to revive. No expression in
#     `src/` moves anything by name (no `move`, no `take`), and every
#     read-out of a `mut` parameter here is an `int` or a `bool`.
#   * The checked machine stores index first, then value (#452): no
#     native binary, and so no differential case, can see it.
#
# ## The bump to 0.2.17 / 0.1.40 (bu09, 2026-09-26)
#
# One release on each half, taken from the release archives by digest
# as above; the per-member table is in
# `notes/bu09-the-pair-and-the-449-revert.md`, and `_wolf` again hashes
# 2d1e48018333e3dd70473b34dfc78723f91f71d44a3d95287b68ce85fbbc2221 in
# all three wolf archives.
#
# What a downstream has to read at this bump:
#
#   * wolf-lang#449 is FIXED. 0.2.16's exclusivity walk read a `mut`
#     claim made BEFORE a call as inside the call's extent, and refused
#     the shape the exit convention prescribes. bu07 worked around it
#     at eleven sites and later utilities inherited the writer-last
#     shape; bu09 reverts every one and deletes `bore.put_last` and
#     `bore.finish_last`.
#   * The index store follows `push` (s180, wolf-lang#438): `xs[i] = v`
#     deep-copies a non-`Copy` place. Every index store in `src/`
#     stores a byte, an int, a bool, a temporary or an explicit `copy`,
#     so no store here gained a copy.
#   * A `Scope` handle as a parameter (#431), the record's file index
#     (#437): surfaces no utility uses.
#
# ## The bump to 0.2.16 / 0.1.38 — the rest of this note is bu07's
#
# lupin 0.1.38 is the first lupin a downstream can pin since 0.1.36:
# 0.1.37's tag was cut off the released line. Its `version_line` names
# pin `2e4ca76`, which is an ancestor of wolf v0.2.15 and is what the
# interpreter conforms to; the `rev` below is the commit the 0.1.38
# TAG names, which is the thing this file pins.

[wolf]
version = "0.2.19"
repo = "wolffe-lang/wolf-lang"
rev = "c2401f05f37794a078d2acf62f837dad98e5950d"
version_line = "wolf 0.2.19 (wolfgang, pin c2401f0)"
aarch64-apple-darwin = "8e9a9653ec320b513c8f6c05c4969ea2f84dc2160718e8a2b62a0c234c2233b6"
x86_64-unknown-linux-gnu = "9f3873d80118681a583a7bc00ead8d00186d447d2584aea75bc65a81f8238c8e"
aarch64-unknown-linux-gnu = "dcb418a959a3034ac17ff3a9a82ccb7dabd72fd70f437d7011496a7e91e83b78"

[lupin]
# The reference interpreter wolf 0.2.19 declares as its pairing:
# `wolf --version` line 2 reads "paired with lupin 0.1.42 (reference
# interpreter), pin ec56a08". The pin lupin conforms to is wolf v0.2.18
# (one release behind; 0.1.41's was two); the `rev` below is the commit
# the 0.1.42 TAG names.
version = "0.1.42"
repo = "wolffe-lang/wolf-interp"
rev = "8e2516dc47bf808512388cc687e070981d331d98"
version_line = "lupin 0.1.42 (wolf-interp, reference interpreter at pin ec56a08)"
aarch64-apple-darwin = "756d6498dc424c54f638974db9e561c91251ac1592531ee258942f5e7ec3da0a"
x86_64-unknown-linux-gnu = "9856335aacbb26d22bd3fde867f28238c6ffde98e5d9fc15ecdedf4103998ab6"
aarch64-unknown-linux-gnu = "0cb937ec29a8ea7957f98b3f7c3cbe29f72d8b2def461b23ca55fc9a6370416e"

[std]
# wolf-std ships no release archive, so the tree is pinned by commit:
# git's object hash is the digest. `use std.…` resolves against
# `.wolf-bin/std` through the driver's own $WOLF_STD, and `STD-REV`
# beside it is the tree's identity.
#
# MOVED AT THE 0.2.16 BUMP BECAUSE IT HAD TO BE, and bu07 intended not
# to move it. The old rev 2d10219 — the one lobo pinned at ws35 — DOES
# NOT COMPILE under wolf 0.2.16. s168's place model now sees what it
# always meant:
#
#   error[E1002]: `v` is the caller's value, and it is returned here
#     while the caller still holds it
#      --> std://cmp/cmp.lu:356:20
#   344 | pub fn clamp[T: Ord](v: T, lo: T, hi: T) -> T {
#   357 |         Less => v,
#   help: to hand on an independent value, copy it at the move
#
# `std.cmp` is reached from `use std.env`, so every boreutils utility
# fails to build. wolf-std#39 (`9ca0139`, "copy at the move where a
# read parameter's value escapes") is the fix and it is only on trunk,
# so the pin has to advance to a rev that carries it. 2d10219 ->
# 070884c is 69 commits, sc48 onwards; under `std/` it is 15 files,
# +914 / -301.
#
# This is a downstream-visible consequence of 0.2.16 that neither the
# release notes nor this lane's contract named, and it is waiting for
# every other pin lane in wave 46: lobo pins the same 2d10219.
#
# MOVED AGAIN AT THE 0.2.17 BUMP, by choice this time (B151: re-derive
# the std pin against the new compiler first). Both 070884c and
# 14f0ab2 build all 21 utilities under 0.2.17 with --deny-warnings.
# 070884c..14f0ab2 is 12 commits touching one file under `std/`,
# `std/map/map.lu` (B117), which no utility reaches: boreutils imports
# `std.env` and `std.time` only. 14f0ab2 is wolf-std trunk and the tree
# lobo's wave-48 pin lane (ws42) was given.
#
# KEPT AT THE 0.2.18 BUMP: wolf-std trunk is still 14f0ab2, so there
# was one candidate (bu10 re-derived it against 0.2.18 first, B151).
# KEPT AT THE 0.2.19 BUMP for the same reason: wolf-std trunk is still
# 14f0ab2 (bu11 re-derived it against 0.2.19 first).
repo = "wolffe-lang/wolf-std"
rev = "14f0ab2c6a64e86240113e21c4da9f746380eb29"
