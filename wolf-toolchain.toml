# boreutils — the pinned toolchain.
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256
# digest, never from a source build. `tools/fetch-toolchain` downloads
# the archive for this host, refuses on a digest mismatch, and stages
# the whole archive into `.wolf-bin/` (gitignored). The native tier
# needs `libwolf_rt.a` beside the driver, which is why the whole
# archive is staged and not just the binary.
#
# Identity is the FIRST line of `--version` (lobo's lib-toolchain
# rule): `tools/lib-toolchain.sh` refuses when it drifts from
# `version_line`. `rev` is information: the commit the tag names.
#
# One row per host target the archives ship. Windows is out of scope
# for boreutils, so its archive is not pinned.
#
# Bumps are deliberate: their own commit, every lane green at the new
# pin, this note saying what the bump changes.
#
# ## The bump to 0.2.16 / 0.1.38 (bu07, 2026-09-24)
#
# Two releases on each half, from wolf 0.2.14 / lupin 0.1.36. Taken
# from the release archives by digest and nowhere else: not from a
# clone, not from `~/.local/bin`, not from a tap. Every MEMBER of each
# archive was hashed by name as well, and the cross-check that the
# member hashes are of one build is `_wolf` — the zsh completion
# script, which is architecture-independent and hashes
# 2d1e48018333e3dd70473b34dfc78723f91f71d44a3d95287b68ce85fbbc2221 in
# all three wolf archives. The per-member table is in
# `notes/bu07-the-pin-and-the-rest-of-b3.md`.
#
# What a downstream has to read at this bump:
#
#   * `[conf.exit]` (s169): the COMPILER now exits 2 for a rejected
#     program and 4 for a refusal, where it used to exit 1. Nothing in
#     this repository observes that status except `tools/build` under
#     `set -eu`, which fails identically on any non-zero, and no
#     differential case runs the compiler at all — a case runs a
#     native binary built ahead of time. So the corpus cannot see it.
#   * `move` on a `Copy` place now RECORDS the move (s177, wolf-lang#444).
#     That was a silent wrong answer on the native tier and it is the
#     one fix here a boreutils program could have been wrong under.
#     No `move` expression appears in `src/`, so nothing changes.
#   * `Scope` / `Proc[T]`, the typed join and the frozen spawn argument
#     (s170), pools and `handle T` (s173): surfaces no utility uses.
#   * The place model (s168) and `[type.list.lit.elem]` saying
#     `List[i32]` (s175): this repository builds every list with
#     `List[T]()` and pushes, because lupin 0.1.36 refused list
#     literals, so the literal's element type is unreachable here.
#
# ## The bump to 0.2.25 / 0.1.48 (bu17, 2026-10-07)
#
# Two releases on the wolf half (0.2.24 was never pinned here), two on
# lupin's, taken from the release archives by digest as above; the
# per-member table is in `notes/bu17-the-pin-0225.md`. `_wolf` MOVED
# for the first time since bu07: it hashes
# a368c8eccce8b1800c80aa818ae482e541aa9636b676540851e23863d333eb8b in
# all three wolf archives, one line longer than 0.2.23's (0.2.24's
# `wolf prelude` subcommand), so the cross-check that the members are of
# one build still holds, on the new hash. lupin 0.1.48's spec pin is
# wolf v0.2.24 (`294d626`), which is what its version line names.
#
# What a downstream has to read at this bump:
#
#   * #598 and #601 (s214): a call now clobbers foreign memory (module
#     `var`s, `extern "c" let` storage, raw-pointer memory) in the
#     builder, and a `List` not lent to the callee loses its reuse
#     across the call. `src/` has no module state and no raw pointer,
#     so no answer here was stale; but every utility's lowering gains
#     reloads: `--emit=wir` differs in all 27 ONLY by `load`, `icmp`,
#     `ptr.off` (and one `agg` in head, nproc and tee, one `zext` in
#     printf), from +8 loads (six utilities) to +159 (sort). No call, store or
#     branch count moved. All 27 binaries differ on both tiers.
#   * #600 (s214): release bounds `x >> s` by the width's unsigned
#     maximum. `bore.u64_text` and `u64_radix` shift a `wrapping[u64]`
#     (printf, nproc), but compare the result only with 0, which both
#     bounds contain; the WIR above is the whole difference.
#   * `fence` is a prelude name (0.2.24, kw11): `src/` declares none.
#     0.2.25 adds no prelude name.
#   * A keyword member continued onto a new line at the item's column is
#     refused (#589), and a module string literal holds its value
#     (#585): `src/` has no module `let`/`const`/`var` at all.
#   * The release tier's scratch directory is per unit (#583, filed by
#     bu16): the macOS `build (release)` ICE that made bu16's first CI
#     attempt red cannot recur.
#   * The archives gain `libwolf_rt_none.a` (the freestanding runtime).
#     `tools/fetch-toolchain` stages the whole archive, so it sits in
#     `.wolf-bin/` unused: no hosted build links it.
#   * `unexpand` is 1.51x SLOWER on ordinary lines (+14% instructions,
#     +63% cycles) with identical IR for its hot fn: the release
#     partition moved `flush_run` into `one`'s unit because unrelated
#     fns grew, and clang compiles `one` worse with the body beside it
#     (wolf-lang#624, witness in `notes/bu17-the-pin-0225.md`). Nothing
#     here works around it. Every other bench row is within noise.
#   * The verdict list is byte-identical to 0.2.23's on both tiers
#     (2749 / 0 / 32 on kasumi); the only verdict text that moved is the
#     eight SKIP reasons that name the version.
#
# ## The bump to 0.2.23 / 0.1.46 (bu16, 2026-10-04)
#
# One release on each half, taken from the release archives by digest
# as above; the per-member table is in `notes/bu16-the-pin-0223.md`,
# and `_wolf` again hashes
# 2d1e48018333e3dd70473b34dfc78723f91f71d44a3d95287b68ce85fbbc2221 in
# all three wolf archives. lupin 0.1.46's spec pin is wolf v0.2.22
# (`8e36bc1`), which is what its version line names.
#
# What a downstream has to read at this bump:
#
#   * Ruling #34 (s208, wolf-lang#541): the then-block of an else-less
#     `if` at a fallible fn's tail is a unit context, so a raise from
#     it is a warned discard, not the fn's raise. Three fns here end
#     that way (`bore.put`, `bore.put_byte`, `bore.sink_push`), and in
#     each the raise leaves through `?`, which the ruling leaves alone:
#     no warning, no behaviour change. A bare tag as that block's tail
#     (`if c { bad }`) is now `unsupported`; `src/` has none.
#   * Module `const`/`let`/`var` compile (a `var` is raw-tier, E1301),
#     raw pointer casts, `*p`, volatile access, `repr(c, packed)` /
#     `align(N)`, `size_of`/`align_of`/`offset_of`, `#[section]`,
#     `extern "c" let`, `[abi.interrupt]` (kw06–kw10): `src/` uses none
#     of them, so none of the new refusals (E0705, E0819, E0820, E0821,
#     E1301, E1307) can reach a site here.
#   * `offset_of`, `align_of` and `size_of` are PRELUDE names (kw08):
#     `bore.offset_of` (bu15's "where the next read starts") shadowed
#     the new `offset_of`, W0304, refused under `--deny-warnings`. The
#     CHANGELOG's "Read this before you bump the pin" does not name it.
#     Renamed `bore.position_of` in the commit before this pin; it is
#     the one site 0.2.23 refused.
#   * `libwolf_rt.a` differs from 0.2.22's though `crates/wolf_rt` is
#     unchanged between the tags: the crate's hash moved with the
#     version (`wolf_rt-6a72b950…` -> `wolf_rt-e3125a76…`), which
#     renames every symbol, so all 27 binaries differ.
#
# ## The bump to 0.2.22 / 0.1.45 (bu15, 2026-10-04)
#
# Two releases on the wolf half (0.2.21 was never pinned here), two on
# lupin's, taken from the release archives by digest as above; the
# per-member table is in `notes/bu15-the-seek.md`, and `_wolf` again
# hashes 2d1e48018333e3dd70473b34dfc78723f91f71d44a3d95287b68ce85fbbc2221
# in all three wolf archives. All 27 utilities build under 0.2.22 with
# --deny-warnings at both std candidates, nothing refused or warned.
#
# What a downstream has to read at this bump:
#
#   * The reason for it: `fs_seek`, `fs_tell` and `fs_read_at` (s199,
#     wolf-lang#426), and descriptors 0, 1 and 2 are the standard streams
#     for `fs_fstat` and those three (#424, `[os.fs.std]`). The first
#     handle an open answers is now 3, never 0; nothing here assumed a
#     number. `tail`, `head` and `wc` adopt the calls in later commits.
#   * An integer cast keeps the value or TRAPS (kw03, ruling #31 K12):
#     native used to truncate `n as byte` and reinterpret a change of
#     sign. Every narrowing cast in `src/` is of a value already in
#     range (a byte read back as an int and pushed back, a digit, an
#     ASCII code), and the verdict list at this pin is identical.
#   * A `for` piece cannot outlive its region (s207, #540): no site here
#     holds a `words()`/`split()` piece past its `region` (it builds, so
#     the checker agrees).
#   * The attribute set is closed (kw01, E0817): `src/` carries no
#     attribute at all.
#   * Ruling #34 (s208, wolf-lang#559) is NOT in this release: #559 was
#     still open when 0.2.22 was cut, so `bore.put`, `put_byte` and
#     `sink_push` keep their 0.2.20 shape.
#
# ## The bump to 0.2.20 / 0.1.43 (bu13, 2026-10-02)
#
# One release on each half, taken from the release archives by digest
# as above; the per-member table is in
# `notes/bu13-the-pair-at-0.2.20.md`, and `_wolf` again hashes
# 2d1e48018333e3dd70473b34dfc78723f91f71d44a3d95287b68ce85fbbc2221 in
# all three wolf archives.
#
# What a downstream has to read at this bump:
#
#   * Arguments are two-phase (the maintainer's ruling #17,
#     `[mem.tier0.excl.4]`): a later argument may READ a place an
#     earlier `mut` argument claims, and may not write, move, re-claim
#     or lend it (E1002), for a `mut` receiver too. The six sites here
#     that read after a `mut` argument (`head.lu` 2, `paste.lu` 1,
#     `tail.lu` 3, all `bore.ring_drop(mut r, bore.ring_len(r))` or
#     `ensure(mut f, f.len + n, keeper)`) were legal at 0.2.19 and stay
#     legal; no later argument in `src/` writes what it claims.
#   * Seven silent wrong answers of 0.2.19 are now refused or fixed:
#     the struct field shorthand moves (#486), a `mut` receiver or
#     claimed place written in its own arguments (#487, #476), a
#     view-set receiver's write-back (#494), a moded fn used as a value
#     (#484), a nested fn's modes (#466), and `else` under a
#     propagating `?` on the checked machine (#492). `src/` has no
#     field shorthand, no nested fn with a moded parameter, no fn read
#     as a value and no view-set receiver; bu13's per-utility count
#     found no diagnostic.
#   * One RUNTIME file moved (#483): `os_signal_listen` unblocks the
#     signals a program arms under an inherited blocked mask. No
#     utility arms a signal (SIGPIPE is left alone, wolf-lang#423), so
#     the path is never entered here; every binary still differs,
#     since `libwolf_rt.a` does.
#   * EG3: two `mut` claims through an offset or a loop index
#     (`add2(mut xs[i], mut xs[i + 1])`) now compile. No site here
#     waited on it.
#
