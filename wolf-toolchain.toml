# boreutils — the pinned toolchain.
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256
# digest, never from a source build. `tools/fetch-toolchain` downloads
# the archive for this host, refuses on a digest mismatch, and stages
# the whole archive into `.wolf-bin/` (gitignored). The native tier
# needs `libwolf_rt.a` beside the driver, which is why the whole
# archive is staged and not just the binary.
#
# Identity is the FIRST line of `--version` (lobo's lib-toolchain
# rule): `tools/lib-toolchain.sh` refuses when it drifts from
# `version_line`. `rev` is information: the commit the tag names.
#
# One row per host target the archives ship. Windows is out of scope
# for boreutils, so its archive is not pinned.
#
# Bumps are deliberate: their own commit, every lane green at the new
# pin, this note saying what the bump changes.
#
# ## The bump to 0.2.16 / 0.1.38 (bu07, 2026-09-24)
#
# Two releases on each half, from wolf 0.2.14 / lupin 0.1.36. Taken
# from the release archives by digest and nowhere else: not from a
# clone, not from `~/.local/bin`, not from a tap. Every MEMBER of each
# archive was hashed by name as well, and the cross-check that the
# member hashes are of one build is `_wolf` — the zsh completion
# script, which is architecture-independent and hashes
# 2d1e48018333e3dd70473b34dfc78723f91f71d44a3d95287b68ce85fbbc2221 in
# all three wolf archives. The per-member table is in
# `notes/bu07-the-pin-and-the-rest-of-b3.md`.
#
# What a downstream has to read at this bump:
#
#   * `[conf.exit]` (s169): the COMPILER now exits 2 for a rejected
#     program and 4 for a refusal, where it used to exit 1. Nothing in
#     this repository observes that status except `tools/build` under
#     `set -eu`, which fails identically on any non-zero, and no
#     differential case runs the compiler at all — a case runs a
#     native binary built ahead of time. So the corpus cannot see it.
#   * `move` on a `Copy` place now RECORDS the move (s177, wolf-lang#444).
#     That was a silent wrong answer on the native tier and it is the
#     one fix here a boreutils program could have been wrong under.
#     No `move` expression appears in `src/`, so nothing changes.
#   * `Scope` / `Proc[T]`, the typed join and the frozen spawn argument
#     (s170), pools and `handle T` (s173): surfaces no utility uses.
#   * The place model (s168) and `[type.list.lit.elem]` saying
#     `List[i32]` (s175): this repository builds every list with
#     `List[T]()` and pushes, because lupin 0.1.36 refused list
#     literals, so the literal's element type is unreachable here.
#
# lupin 0.1.38 is the first lupin a downstream can pin since 0.1.36:
# 0.1.37's tag was cut off the released line. Its `version_line` names
# pin `2e4ca76`, which is an ancestor of wolf v0.2.15 and is what the
# interpreter conforms to; the `rev` below is the commit the 0.1.38
# TAG names, which is the thing this file pins.

[wolf]
version = "0.2.16"
repo = "wolffe-lang/wolf-lang"
rev = "93a5fe504593ca7642b78ba83b4986e7a03cfe71"
version_line = "wolf 0.2.16 (wolfgang, pin 93a5fe5)"
aarch64-apple-darwin = "b04310568d0104d7a804917bbd999cf4343c032c6e41aeda61c5b13b194706b5"
x86_64-unknown-linux-gnu = "84e30c05e56b89fde2fe6e27eec8f7cec0a6aae6e1464a2993fcfc87a7a1829e"
aarch64-unknown-linux-gnu = "fe1966a42a1d95b16f615f57aa4c3dd993b0ccce42ae8288d8f9ae70693e395e"

[lupin]
# The reference interpreter wolf 0.2.16 declares as its pairing:
# `wolf --version` line 2 reads "paired with lupin 0.1.38 (reference
# interpreter), pin 2e4ca76".
version = "0.1.38"
repo = "wolffe-lang/wolf-interp"
rev = "ba357aa6a2e32040d4f089d2cefe05bab86c4f86"
version_line = "lupin 0.1.38 (wolf-interp, reference interpreter at pin 2e4ca76)"
aarch64-apple-darwin = "28760a9923a9f5712dfaf06a827138e5b6ca617135447b267794c7a88434f3d6"
x86_64-unknown-linux-gnu = "828b5c5571644107a1b123490b5e188da50020676c6b15b0bc53a899a7cc520b"
aarch64-unknown-linux-gnu = "b85ec6471d0572e646a16326f49f6c243626546b1f64a10ec54d72af1941f5d2"

[std]
# wolf-std ships no release archive, so the tree is pinned by commit:
# git's object hash is the digest. `use std.…` resolves against
# `.wolf-bin/std` through the driver's own $WOLF_STD, and `STD-REV`
# beside it is the tree's identity.
#
# MOVED AT THE 0.2.16 BUMP BECAUSE IT HAD TO BE, and bu07 intended not
# to move it. The old rev 2d10219 — the one lobo pinned at ws35 — DOES
# NOT COMPILE under wolf 0.2.16. s168's place model now sees what it
# always meant:
#
#   error[E1002]: `v` is the caller's value, and it is returned here
#     while the caller still holds it
#      --> std://cmp/cmp.lu:356:20
#   344 | pub fn clamp[T: Ord](v: T, lo: T, hi: T) -> T {
#   357 |         Less => v,
#   help: to hand on an independent value, copy it at the move
#
# `std.cmp` is reached from `use std.env`, so every boreutils utility
# fails to build. wolf-std#39 (`9ca0139`, "copy at the move where a
# read parameter's value escapes") is the fix and it is only on trunk,
# so the pin has to advance to a rev that carries it. 2d10219 ->
# 070884c is 69 commits, sc48 onwards; under `std/` it is 15 files,
# +914 / -301.
#
# This is a downstream-visible consequence of 0.2.16 that neither the
# release notes nor this lane's contract named, and it is waiting for
# every other pin lane in wave 46: lobo pins the same 2d10219.
repo = "wolffe-lang/wolf-std"
rev = "070884c6e1e3f0e813c822e3cc57502c74e08328"
